# macOS kurulum paketi (ArthurLegal-Kurulum.pkg).
#
# Windows kurulumu Inno Setup'la Windows'ta derlenir. macOS paketi yalnız macOS'ta derlenebildiği için GitHub'ın
# macOS bilgisayarında (Apple Silicon) derlenir ve aynı bilgisayarda kurulup denenir:
#   1. İstemci testleri (macOS'a özgü olanlar dâhil)
#   2. Paketin derlenmesi (ArthurLegal-setup/yayin/derle_macos.py): paketler bu depodan, Tapu public
#      arthurlegal-mcp deposundan; Python Apple Silicon ve Intel için
#   3. Kurulum: Courthouse, Tapu ve Arthur Mask seçilerek, ev klasörüne, yönetici şifresi olmadan
#   4. Denetim (ArthurLegal-setup/tests/mac_kurulum_denetimi.py): Python, Claude Desktop kaydı, uygulamalar,
#      masaüstü simgeleri, oturum açılışında güncelleme, yerel sunucu ve Tapu; Arthur Mask'in indirilip
#      kurulması; kaldırma
# Paket ve derleme-macos.json işin çıktısıdır (Artifacts). Yayına yayin/yayinla.py ile girer, yalnız Windows
# derlemesiyle aynı sürümden ve aynı commit'ten derlendiyse.

name: macOS kurulumu

on:
  push:
    branches: [main, "kurulum/**"]
    paths:
      - "ArthurLegal-setup/**"
      - "ArthurLegal-*-Public-Release/**"
      - ".github/workflows/macos-kurulum.yml"
  workflow_dispatch:
    inputs:
      mask:
        description: "Arthur Mask'i de indir, kur ve dene (~1,2 GB)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: macos-kurulum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derle:
    name: Derle, kur, denetle
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: ArthurLegal-setup
    steps:
      - uses: actions/checkout@v4

      - name: macOS arayüz metinleri (README'deki Mac çizimleri için)
        working-directory: .
        continue-on-error: true
        run: python3 docs/kurulum/mac_metinleri.py

      - name: Ekran (metinlerden sonra)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/ekran"; sleep 3; command -v python3; python3 -c 'import sys; print(sys.executable)'
          perl -e 'alarm 20; exec @ARGV' screencapture -x "$RUNNER_TEMP/ekran/00-metinlerden-sonra.png" || true

      - name: Tapu kaynağı (public arthurlegal-mcp)
        working-directory: .
        run: git clone --quiet https://github.com/beerbottle90/arthurlegal-mcp.git "$GITHUB_WORKSPACE/../arthurlegal-mcp"

      - uses: astral-sh/setup-uv@v6

      - name: Testler
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests -v

      - name: Ekran (testlerden sonra)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/ekran"; sleep 3
          perl -e 'alarm 20; exec @ARGV' screencapture -x "$RUNNER_TEMP/ekran/0a-testlerden-sonra.png" || true

      - name: Derle
        run: uv run --no-project --python 3.12 python yayin/derle_macos.py

      - name: Paketi sakla
        uses: actions/upload-artifact@v4
        with:
          name: ArthurLegal-Kurulum-macos-${{ github.sha }}
          path: |
            ArthurLegal-setup/yayin/cikti/ArthurLegal-Kurulum.pkg
            ArthurLegal-setup/yayin/cikti/derleme-macos.json
          if-no-files-found: error
          retention-days: 30

      - name: Kur (Courthouse, Tapu, Arthur Mask; yönetici şifresi olmadan)
        run: |
          cat > "$RUNNER_TEMP/secim.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><array>
            <dict><key>choiceIdentifier</key><string>adliye</string><key>choiceAttribute</key><string>selected</string><key>attributeSetting</key><integer>1</integer></dict>
            <dict><key>choiceIdentifier</key><string>tapu</string><key>choiceAttribute</key><string>selected</string><key>attributeSetting</key><integer>1</integer></dict>
            <dict><key>choiceIdentifier</key><string>mask</string><key>choiceAttribute</key><string>selected</string><key>attributeSetting</key><integer>1</integer></dict>
          </array></plist>
          XML
          installer -pkg yayin/cikti/ArthurLegal-Kurulum.pkg -target CurrentUserHomeDirectory \
            -showChoicesAfterApplyingChangesXML "$RUNNER_TEMP/secim.xml"
          installer -pkg yayin/cikti/ArthurLegal-Kurulum.pkg -target CurrentUserHomeDirectory \
            -applyChoiceChangesXML "$RUNNER_TEMP/secim.xml" -verbose

      - name: Ekran (kurulumdan sonra)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/ekran"; sleep 3
          perl -e 'alarm 20; exec @ARGV' screencapture -x "$RUNNER_TEMP/ekran/0b-kurulumdan-sonra.png" || true

      - name: Kurulumu denetle
        run: uv run --no-project --python 3.12 python tests/mac_kurulum_denetimi.py adliye,tapu,mask

      - name: Ekran (denetimden sonra)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/ekran"; sleep 3
          perl -e 'alarm 20; exec @ARGV' screencapture -x "$RUNNER_TEMP/ekran/0c-denetimden-sonra.png" || true

      - name: Arthur Mask (iner, kurulur, Claude Desktop'a kaydolur)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mask }}
        run: uv run --no-project --python 3.12 python tests/mac_kurulum_denetimi.py adliye,tapu,mask --mask

      - name: Ekran (Arthur Mask'tan sonra)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/ekran"; sleep 3
          perl -e 'alarm 20; exec @ARGV' screencapture -x "$RUNNER_TEMP/ekran/0d-masktan-sonra.png" || true

      - name: Kaldır
        run: uv run --no-project --python 3.12 python tests/mac_kurulum_denetimi.py adliye,tapu,mask --kaldir

      # README'deki Mac çizimleri için örnek ekranlar (İngilizce macOS): kurulum sihirbazının ilk adımları (Yükle'ye
      # basılmaz) ve internetten inmiş gibi işaretli paketin ilk açılışı. İş çıktısı olarak saklanır; adımlar kendi
      # süre sınırlarıyla çalışır, bir izin penceresi işi bekletmez.
      - name: Ekran görüntüleri (kurulum sihirbazı)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 4
        run: |
          E="$RUNNER_TEMP/ekran"; mkdir -p "$E"
          sinirli() { perl -e 'alarm shift; exec @ARGV' 20 "$@" || true; }
          cek() { sleep "${2:-4}"; sinirli screencapture -x "$E/$1.png"; }
          tikla() { sinirli osascript -e "tell application \"System Events\" to tell process \"Installer\" to click button \"$1\" of $2"; }
          dugmeler() { sinirli osascript -e 'tell application "System Events" to tell process "Installer" to get name of every button of window 1'; }
          sinirli open -a Installer yayin/cikti/ArthurLegal-Kurulum.pkg; cek 1-giris 12; dugmeler
          tikla Continue "window 1"; cek 2-lisans; dugmeler
          tikla Continue "window 1"; cek 3-lisans-onayi
          tikla Agree "sheet 1 of window 1"; cek 4-hedef; dugmeler
          tikla Continue "window 1"; cek 5-yukleme-turu; dugmeler
          pkill -x Installer || true
          ls -la "$E"

      - name: Ekran görüntüleri (ilk açılış uyarısı, Gizlilik ve Güvenlik)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 4
        run: |
          E="$RUNNER_TEMP/ekran"; mkdir -p "$E"
          sinirli() { perl -e 'alarm shift; exec @ARGV' 20 "$@" || true; }
          cek() { sleep "${2:-4}"; sinirli screencapture -x "$E/$1.png"; }
          cp yayin/cikti/ArthurLegal-Kurulum.pkg "$HOME/Downloads/"
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;$(uuidgen)" "$HOME/Downloads/ArthurLegal-Kurulum.pkg"
          sinirli open "$HOME/Downloads/ArthurLegal-Kurulum.pkg"; cek 6-ilk-acilis 6
          sinirli open "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension"; cek 7-gizlilik-ve-guvenlik 8
          for i in 1 2 3 4 5 6; do
            sinirli osascript -e 'tell application "System Events" to tell process "System Settings" to key code 121'
          done
          cek 8-guvenlik 3
          ls -la "$E"

      - name: Ekran görüntülerini sakla
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri-${{ github.sha }}
          path: ${{ runner.temp }}/ekran
          retention-days: 14

      - name: Günlükler
        if: ${{ always() }}
        working-directory: .
        run: |
          KOK="$HOME/Library/Application Support/ArthurLegal"
          ls -la "$KOK" "$HOME/Applications" "$HOME/Desktop" 2>&1 || true
          for f in "$KOK"/veri/gunluk/*.log; do echo "== $f"; tail -n 80 "$f"; done 2>/dev/null || true
          echo "== /var/log/install.log (ArthurLegal)"
          grep -i "arthurlegal\|postinstall\|preinstall" /var/log/install.log | tail -n 80 || true
          # macOS 15'in "yerel ağdaki aygıtları bulma" izni: hangi süreç istedi (kurulumun Python'u mu, iş araçları mı)
          echo "== yerel ağ izni istekleri"
          sudo log show --last 90m --style compact --predicate 'process == "nehelper"' 2>/dev/null | grep -v "^Timestamp" | tail -n 60 || true
          sudo log show --last 90m --style compact --predicate 'eventMessage CONTAINS[c] "local network" OR eventMessage CONTAINS[c] "LocalNetwork"' 2>/dev/null | grep -v "^Timestamp" | tail -n 40 || true
