# Paket denetimi (sürüm sınavı, Katman 1).
#
# Her push'ta (bütün dallar) ve PR'da GitHub'ın Linux bilgisayarında çalışır; ana dalda zorunlu denetim
# olduğu için yol süzgeci yok (süzgeçle atlanan PR, zorunlu denetimi hiç almaz ve birleşemez);
# ağa çıkmaz, API anahtarı istemez, birkaç saniyede biter. ArthurLegal-setup/yayin/paket_denetimi.py depo
# kökündeki ArthurLegal-*-v*-Public-Release paketlerini denetler (arsiv/ hariç):
#   1. Kırık skill atfı: .md dosyalarındaki /eklenti:komut o pakette tanımlı bir skill'e gidiyor mu
#      (eski eklenti adıyla yazılan atıf da kırıktır; "hazırlanıyor" notlu atıf planlı sayılır)
#   2. Sürüm: klasör adındaki sürüm VERSION, SYSTEM_PROMPT, README, KURULUM, INSTALLATION, CHANGELOG ve
#      ATTRIBUTION'da aynı mı; aynı paketin iki klasörü kalmış mı
#   3. Sayım: kitapçıklarda "Toplam skill", İçindekiler ve gövde aynı mı; başlıklardaki plugin, skill,
#      referans, agent, profil ve knowledge dosyası sayıları gerçek mi
#   4. Yeni ayrışma: paketler arasında birbirinin aynısı olan bir dosya yalnız bir pakette değişti mi
#   5. Ortak rehberler: ArthurLegal-setup/ortak-rehberler/ tek kaynağından üretilen paket kopyaları kaynakla
#      aynı mı (yayin/ortak_uret.py); paketin içinde elle yapılan düzeltme burada yakalanır
#   6. Claude eklentisi: ArthurLegal-plugin/ Law Firm paketinden üretilmiş mi ve dizinin dosya kurallarına uyuyor
#      mu (yayin/eklenti_uret.py, tests/test_eklenti.py); paket değişip eklenti üretilmediyse kırmızı
#   7. Eklenti sürümü: eklenti tabandakinden (PR'da hedef dal, push'ta önceki commit) farklıysa sürümü artmış mı.
#      Kurulu kopyalar ve Claude dizini güncellemeyi sürümden anlar; eklenti_uret.py sürümü kendisi artırır
# Bilinen eski sorunlar ArthurLegal-setup/tests/paket_denetimi_taban.json'dadır; iş yalnız yeni bir sorunda
# kırmızı biter. Ayrıntılı rapor: python ArthurLegal-setup/yayin/paket_denetimi.py --ayrinti

name: Paket denetimi

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  denetle:
    name: Paketleri denetle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Depo kökünden çalışır; test, depo kökünü kendi konumundan bulur
      - name: Paket denetimi
        run: python -m unittest ArthurLegal-setup/tests/test_paketler.py ArthurLegal-setup/tests/test_ortak.py -v

      - name: Claude eklentisi
        run: python -m unittest ArthurLegal-setup/tests/test_eklenti.py ArthurLegal-setup/tests/test_dizin.py -v

      # Taban: PR'da hedef dalın ucu, push'ta önceki commit; yeni açılan dalda (önceki commit yok) main
      - name: Eklenti sürümü
        env:
          TABAN: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$TABAN" ] || [ "$TABAN" = "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin main
            TABAN=$(git rev-parse FETCH_HEAD)
          else
            git fetch --no-tags --depth=1 origin "$TABAN"
          fi
          python ArthurLegal-setup/yayin/eklenti_uret.py --denetle --taban "$TABAN"
