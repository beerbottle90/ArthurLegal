<svg xmlns="http://www.w3.org/2000/svg" width="600" height="372" viewBox="0 0 600 372" role="img" aria-label="Örnek: yapay zekâ uygulaması ekranında Claude Desktop (bu bilgisayarda kurulu) önden işaretli, ChatGPT de işaretlendi; biri de yeter. Sonraki'ye tıklayın"><title>Örnek: yapay zekâ uygulaması ekranında Claude Desktop (bu bilgisayarda kurulu) önden işaretli, ChatGPT de işaretlendi; biri de yeter. Sonraki'ye tıklayın</title><g font-family="'Segoe UI', 'Segoe UI Variable', 'Helvetica Neue', Arial, sans-serif"><rect x="12" y="14" width="580" height="336" fill="#000000" opacity="0.14"/><rect x="10" y="10" width="580" height="336" fill="#f0f0f0" stroke="#8c959f"/><rect x="11" y="11" width="578" height="31" fill="#ffffff"/><rect x="20" y="19" width="16" height="16" fill="#14233c"/><text x="44" y="32" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">ArthurLegal - Kurulum yardımcısı</text><text x="564" y="32" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">✕</text><rect x="11" y="42" width="578" height="64" fill="#ffffff"/><text x="32" y="64" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">Yapay zekâ uygulamanızı seçin</text><text x="44" y="84" font-size="12" fill="#1f2328" font-weight="400" text-anchor="start">ArthurLegal seçtiğiniz uygulamanın içinde çalışır. En az birini işaretleyin; sonra</text><text x="44" y="100" font-size="12" fill="#1f2328" font-weight="400" text-anchor="start">kurulumu yeniden çalıştırıp değiştirebilirsiniz.</text><rect x="532" y="48" width="46" height="52" fill="#14233c"/><text x="555" y="84" font-size="26" fill="#b08d3c" font-weight="700" text-anchor="middle">A</text><line x1="11" y1="106" x2="589" y2="106" stroke="#d0d7de"/><rect x="34" y="130" width="13" height="13" fill="#ffffff" stroke="#333333"/><path d="M36.5 136.5 l3 3 l5.5 -6" stroke="#1f2328" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="141" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">Claude Desktop (bu bilgisayarda kurulu)</text><text x="54" y="159" font-size="12" fill="#6e7781" font-weight="400" text-anchor="start">Anthropic'in masaüstü uygulaması. Kurulu değilse kurulum onu da kurar.</text><rect x="34" y="185" width="13" height="13" fill="#ffffff" stroke="#333333"/><path d="M36.5 191.5 l3 3 l5.5 -6" stroke="#1f2328" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="196" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">ChatGPT</text><text x="54" y="214" font-size="12" fill="#6e7781" font-weight="400" text-anchor="start">OpenAI'ın masaüstü uygulaması. Kurulu değilse kurulum onu Microsoft Store'dan</text><text x="54" y="230" font-size="12" fill="#6e7781" font-weight="400" text-anchor="start">kurar; olmazsa masaüstündeki simge resmî indirme sayfasını açar.</text><text x="34" y="264" font-size="12" fill="#6e7781" font-weight="400" text-anchor="start">Claude, Anthropic'in; ChatGPT ve OpenAI, OpenAI'ın markalarıdır.</text><line x1="11" y1="290" x2="589" y2="290" stroke="#d0d7de"/><rect x="322" y="302" width="78" height="26" fill="#e1e1e1" stroke="#adadad"/><text x="361" y="319" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="middle">Önceki</text><rect x="406" y="302" width="78" height="26" fill="#e1e1e1" stroke="#0f6cbd"/><text x="445" y="319" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="middle">Sonraki</text><rect x="494" y="302" width="78" height="26" fill="#e1e1e1" stroke="#adadad"/><text x="533" y="319" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="middle">İptal</text><rect x="29" y="125" width="338" height="23" rx="7" fill="none" stroke="#e5243b" stroke-width="3"/><circle cx="381" cy="136.5" r="13" fill="#e5243b"/><text x="381" y="141.5" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="29" y="180" width="82" height="23" rx="7" fill="none" stroke="#e5243b" stroke-width="3"/><circle cx="125" cy="191.5" r="13" fill="#e5243b"/><text x="125" y="196.5" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="402" y="298" width="86" height="34" rx="7" fill="none" stroke="#e5243b" stroke-width="3"/><circle cx="445.0" cy="284" r="13" fill="#e5243b"/><text x="445.0" y="289" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="300.0" y="364" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle">Çizim · ArthurLegal kurulumunun yapay zekâ uygulaması ekranı (örnek görünüm)</text></g></svg>
