<svg xmlns="http://www.w3.org/2000/svg" width="600" height="352" viewBox="0 0 600 352" role="img" aria-label="Example: in the Windows protected your PC window, first click More info"><title>Example: in the Windows protected your PC window, first click More info</title><g font-family="'Segoe UI', 'Segoe UI Variable', 'Helvetica Neue', Arial, sans-serif"><rect x="13" y="14" width="580" height="316" fill="#000000" opacity="0.18"/><rect x="10" y="10" width="580" height="316" fill="#1f5fae" stroke="#16477f"/><text x="556" y="36" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">✕</text><text x="36" y="76" font-size="25" fill="#ffffff" font-weight="600" text-anchor="start">Windows protected your PC</text><text x="36" y="112" font-size="14.5" fill="#ffffff" font-weight="400" text-anchor="start">Microsoft Defender SmartScreen prevented an unrecognized app</text><text x="36" y="133" font-size="14.5" fill="#ffffff" font-weight="400" text-anchor="start">from starting. Running this app might put your PC at risk.</text><text x="36" y="190" font-size="15" fill="#ffffff" font-weight="600" text-anchor="start" text-decoration="underline">More info</text><rect x="29" y="170" width="88" height="30" rx="7" fill="none" stroke="#e5243b" stroke-width="3"/><circle cx="131" cy="185.0" r="13" fill="#e5243b"/><text x="131" y="190.0" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="440" y="268" width="126" height="36" fill="#174b8a" stroke="#ffffff" stroke-width="1.5"/><text x="503" y="292" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle">Don't run</text><text x="300.0" y="344" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle">Drawing · Windows SmartScreen warning (example)</text></g></svg>
