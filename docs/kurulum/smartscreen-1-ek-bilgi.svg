<svg xmlns="http://www.w3.org/2000/svg" width="560" height="352" viewBox="0 0 560 352" role="img" aria-label="Örnek: SmartScreen penceresinde önce Ek bilgi yazısına tıklayın"><title>Örnek: SmartScreen penceresinde önce Ek bilgi yazısına tıklayın</title><g font-family="'Segoe UI', 'Segoe UI Variable', 'Helvetica Neue', Arial, sans-serif"><rect x="13" y="14" width="540" height="316" fill="#000000" opacity="0.18"/><rect x="10" y="10" width="540" height="316" fill="#1f5fae" stroke="#16477f"/><text x="516" y="36" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">✕</text><text x="36" y="76" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">Windows bilgisayarınızı korudu</text><text x="36" y="112" font-size="14.5" fill="#ffffff" font-weight="400" text-anchor="start">Microsoft Defender SmartScreen tanınmayan bir uygulamanın</text><text x="36" y="133" font-size="14.5" fill="#ffffff" font-weight="400" text-anchor="start">başlatılmasını engelledi. Bu uygulamanın çalıştırılması</text><text x="36" y="154" font-size="14.5" fill="#ffffff" font-weight="400" text-anchor="start">bilgisayarınızı riske atabilir.</text><text x="36" y="190" font-size="15" fill="#ffffff" font-weight="600" text-anchor="start" text-decoration="underline">Ek bilgi</text><rect x="29" y="170" width="82" height="30" rx="7" fill="none" stroke="#e5243b" stroke-width="3"/><circle cx="125" cy="185.0" r="13" fill="#e5243b"/><text x="125" y="190.0" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="400" y="268" width="126" height="36" fill="#174b8a" stroke="#ffffff" stroke-width="1.5"/><text x="463" y="292" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle">Çalıştırma</text><text x="280.0" y="344" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle">Çizim · Windows SmartScreen uyarısı (örnek görünüm)</text></g></svg>
