<svg xmlns="http://www.w3.org/2000/svg" width="600" height="372" viewBox="0 0 600 372" role="img" aria-label="Örnek: arayüz ekranında ArthurLegal yeni arayüz seçili gelir; Claude Desktop klasik de seçilebilir. Sonraki'ye tıklayın"><title>Örnek: arayüz ekranında ArthurLegal yeni arayüz seçili gelir; Claude Desktop klasik de seçilebilir. Sonraki'ye tıklayın</title><g font-family="'Segoe UI', 'Segoe UI Variable', 'Helvetica Neue', Arial, sans-serif"><rect x="12" y="14" width="580" height="336" fill="#000000" opacity="0.14"/><rect x="10" y="10" width="580" height="336" fill="#f0f0f0" stroke="#8c959f"/><rect x="11" y="11" width="578" height="31" fill="#ffffff"/><rect x="20" y="19" width="16" height="16" fill="#14233c"/><text x="44" y="32" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">ArthurLegal - Kurulum yardımcısı</text><text x="564" y="32" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">✕</text><rect x="11" y="42" width="578" height="64" fill="#ffffff"/><text x="32" y="64" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">Arayüzü seçin</text><text x="44" y="84" font-size="12" fill="#1f2328" font-weight="400" text-anchor="start">ArthurLegal nasıl açılsın? Sonra kurulumu yeniden çalıştırıp değiştirebilirsiniz.</text><rect x="532" y="48" width="46" height="52" fill="#14233c"/><text x="555" y="84" font-size="26" fill="#b08d3c" font-weight="700" text-anchor="middle">A</text><line x1="11" y1="106" x2="589" y2="106" stroke="#d0d7de"/><circle cx="40" cy="130" r="6.5" fill="#ffffff" stroke="#333333"/><circle cx="40" cy="130" r="3.2" fill="#1f2328"/><text x="54" y="134" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">ArthurLegal yeni arayüz</text><text x="54" y="153" font-size="12" fill="#6e7781" font-weight="400" text-anchor="start">Masaüstündeki simge Claude Desktop'un içinde ArthurLegal Masası'nı açar: solda</text><text x="54" y="169" font-size="12" fill="#6e7781" font-weight="400" text-ancho