<svg xmlns="http://www.w3.org/2000/svg" width="560" height="372" viewBox="0 0 560 372" role="img" aria-label="Örnek: mavi Sil düğmesinin yanındaki oka, sonra Yine de sakla'ya tıklayın"><title>Örnek: mavi Sil düğmesinin yanındaki oka, sonra Yine de sakla'ya tıklayın</title><g font-family="'Segoe UI', 'Segoe UI Variable', 'Helvetica Neue', Arial, sans-serif"><rect x="12" y="14" width="540" height="336" rx="10" fill="#000000" opacity="0.14"/><rect x="10" y="10" width="540" height="336" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="32" y="46" font-size="17" fill="#1f2328" font-weight="600" text-anchor="start">Açmadan önce ArthurLegal-Kurulum.exe dosyasının</text><text x="32" y="69" font-size="17" fill="#1f2328" font-weight="600" text-anchor="start">güvenilir olduğundan emin olun</text><text x="32" y="106" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">Dosya yaygın olarak indirilmediğinden Microsoft Defender SmartScreen</text><text x="32" y="124" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">bu dosyanın güvenli olup olmadığı doğrulayamadı. Açmadan önce</text><text x="32" y="142" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">indirdiğiniz dosyanın veya kaynağının güvenli olduğundan emin olun.</text><text x="32" y="174" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">Ad: ArthurLegal-Kurulum.exe</text><text x="32" y="194" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">Yayımcı: Bilinmiyor</text><text x="32" y="222" font-size="12.5" fill="#0f6cbd" font-weight="400" text-anchor="start" text-decoration="underline">Bu uygulamayı güvenli olarak bildir</text><text x="32" y="244" font-size="12.5" fill="#0f6cbd" font-weight="400" text-anchor="start" text-decoration="underline">Daha fazla bilgi edinin</text><rect x="322" y="296" width="84" height="32" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="364" y="317" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="middle">İptal</text><rect x="418" y="296" width="112" height="32" rx="6" fill="#0f6cbd"/><text x="456" y="317" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle">Sil</text><line x1="494" y1="302" x2="494" y2="322" stroke="#ffffff" opacity="0.6"/><path d="M506 309 l6 6 l6 -6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="495" y="292" width="37" height="40" rx="7" fill="none" stroke="#e5243b" stroke-width="3"/><circle cx="546" cy="312.0" r="13" fill="#e5243b"/><text x="546" y="317.0" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="378" y="244" width="152" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/><text x="394" y="269" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">Yine de sakla</text><rect x="384" y="249" width="140" height="30" rx="7" fill="none" stroke="#e5243b" stroke-width="3"/><circle cx="370" cy="264.0" r="13" fill="#e5243b"/><text x="370" y="269.0" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="280.0" y="364" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle">Çizim · Microsoft Edge onay penceresi (örnek görünüm)</text></g></svg>
