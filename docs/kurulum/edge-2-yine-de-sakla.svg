<svg xmlns="http://www.w3.org/2000/svg" width="560" height="372" viewBox="0 0 560 372" role="img" aria-label="Örnek: Daha fazla göster'e, sonra Yine de sakla'ya tıklayın"><title>Örnek: Daha fazla göster'e, sonra Yine de sakla'ya tıklayın</title><g font-family="'Segoe UI', 'Segoe UI Variable', 'Helvetica Neue', Arial, sans-serif"><rect x="12" y="14" width="540" height="336" rx="10" fill="#000000" opacity="0.14"/><rect x="10" y="10" width="540" height="336" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="32" y="46" font-size="17" fill="#1f2328" font-weight="600" text-anchor="start">Açmadan önce ArthurLegal-Kurulum.exe dosyasının</text><text x="32" y="69" font-size="17" fill="#1f2328" font-weight="600" text-anchor="start">güvenilir olduğundan emin olun</text><text x="32" y="106" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">Dosya yaygın olarak indirilmediğinden Microsoft Defender SmartScreen</text><text x="32" y="124" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">bu dosyanın güvenli olup olmadığı doğrulayamadı. Açmadan önce</text><text x="32" y="142" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">indirdiğiniz dosyanın veya kaynağının güvenli olduğundan emin olun.</text><text x="32" y="174" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">Ad: ArthurLegal-Kurulum.exe</text><text x="32" y="200" font-size="12.5" fill="#0f6cbd" font-weight="400" text-anchor="start" text-decoration="underline">Bu uygulamayı güvenli olarak bildir</text><text x="32" y="222" font-size="12.5" fill="#0f6cbd" font-weight="400" text-anchor="start" text-decoration="underline">Microsoft Defender SmartScreen hakkında daha fazla bilgi edinin</text><text x="32" y="254" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">Daha fazla göster</text><path d="M168 246 l5 5 l5 -5" stroke="#1f2328" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="234" width="168" height="30" rx="7" fill="none" stroke="#e5243b" stroke-width="3"/><circle cx="206" cy="249.0" r="13" fill="#e5243b"/><text x="206" y="254.0" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="32" y="270" width="120" height="32" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="92" y="291" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="middle">Yine de sakla</text><rect x="26" y="264" width="132" height="44" rx="7" fill="none" stroke="#e5243b" stroke-width="3"/><circle cx="172" cy="286.0" r="13" fill="#e5243b"/><text x="172" y="291.0" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="354" y="296" width="84" height="32" rx="6" fill="#0f6cbd"/><text x="396" y="317" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle">Sil</text><rect x="450" y="296" width="84" height="32" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="492" y="317" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="middle">İptal</text><text x="280.0" y="364" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle">Çizim · Microsoft Edge onay penceresi (örnek görünüm)</text></g></svg>
