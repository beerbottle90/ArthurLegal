<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" role="img" aria-label="Örnek: modül ekranında paketinizi (burada Hukuk Bürosu), isterseniz Tapu ve Arthur Mask'i işaretleyip Sonraki'ye tıklayın"><title>Örnek: modül ekranında paketinizi (burada Hukuk Bürosu), isterseniz Tapu ve Arthur Mask'i işaretleyip Sonraki'ye tıklayın</title><g font-family="'Segoe UI', 'Segoe UI Variable', 'Helvetica Neue', Arial, sans-serif"><rect x="12" y="14" width="580" height="484" fill="#000000" opacity="0.14"/><rect x="10" y="10" width="580" height="484" fill="#f0f0f0" stroke="#8c959f"/><rect x="11" y="11" width="578" height="31" fill="#ffffff"/><rect x="20" y="19" width="16" height="16" fill="#14233c"/><text x="44" y="32" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">ArthurLegal - Kurulum yardımcısı</text><text x="564" y="32" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">✕</text><rect x="11" y="42" width="578" height="64" fill="#ffffff"/><text x="32" y="64" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">Modülleri seçin</text><text x="44" y="84" font-size="12" fill="#1f2328" font-weight="400" text-anchor="start">Kurmak istediklerinizi işaretleyin. En az bir paket gerekir; sonra kurulumu yeniden</text><text x="44" y="100" font-size="12" fill="#1f2328" font-weight="400" text-anchor="start">çalıştırıp değiştirebilirsiniz.</text><rect x="532" y="48" width="46" height="52" fill="#14233c"/><text x="555" y="84" font-size="26" fill="#b08d3c" font-weight="700" text-anchor="middle">A</text><line x1="11" y1="106" x2="589" y2="106" stroke="#d0d7de"/><text x="32" y="134" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">Asistan paketleri (en az birini seçin)</text><rect x="34" y="148" width="13" height="13" fill="#ffffff" stroke="#333333"/><path d="M36.5 154.5 l3 3 l5.5 -6" stroke="#1f2328" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="159" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">Hukuk Bürosu</text><text x="54" y="177" font-size="12" fill="#6e7781" font-weight="400" text-anchor="start">Avukatlar için dilekçe, sözleşme, içtihat ve mevzuat araştırması, süre takibi.</text><rect x="34" y="192" width="13" height="13" fill="#ffffff" stroke="#333333"/><text x="54" y="203" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">Kurumsal Asistan</text><text x="54" y="221" font-size="12" fill="#6e7781" font-weight="400" text-anchor="start">Şirket hukuk birimleri için sözleşme incelemesi, uyum, KVKK ve şirketler hukuku.</text><rect x="34" y="236" width="13" height="13" fill="#ffffff" stroke="#333333"/><text x="54" y="247" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">Courthouse</text><text x="54" y="265" font-size="12" fill="#6e7781" font-weight="400" text-anchor="start">Hâkim ve kalem için tarafsız taslak: gerekçe iskeleti, tensip, müzekkere, tebligat.</text><rect x="34" y="280" width="13" height="13" fill="#ffffff" stroke="#333333"/><text x="54" y="291" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">Akademisyen</text><text x="54" y="309" font-size="12" fill="#6e7781" font-weight="400" text-anchor="start">Hukuk akademisyenleri için literatür, atıf doğrulama, dergi seçimi, yayın etiği.</text><text x="32" y="328" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="start">Araçlar</text><rect x="34" y="342" width="13" height="13" fill="#ffffff" stroke="#333333"/><path d="M36.5 348.5 l3 3 l5.5 -6" stroke="#1f2328" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="353" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">ArthurLegal Tapu</text><text x="54" y="371" font-size="12" fill="#6e7781" font-weight="400" text-anchor="start">Ada/parsel ya da yer adıyla TKGM'den canlı parsel bilgisi, kroki ve harç.</text><rect x="34" y="386" width="13" height="13" fill="#ffffff" stroke="#333333"/><path d="M36.5 392.5 l3 3 l5.5 -6" stroke="#1f2328" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="397" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">Arthur Mask</text><text x="54" y="415" font-size="12" fill="#6e7781" font-weight="400" text-anchor="start">Belgeleri Claude'a vermeden önce bu bilgisayarda maskeler; yaklaşık 1 GB indirilir.</text><line x1="11" y1="438" x2="589" y2="438" stroke="#d0d7de"/><rect x="322" y="450" width="78" height="26" fill="#e1e1e1" stroke="#adadad"/><text x="361" y="467" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="middle">Önceki</text><rect x="406" y="450" width="78" height="26" fill="#e1e1e1" stroke="#0f6cbd"/><text x="445" y="467" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="middle">Sonraki</text><rect x="494" y="450" width="78" height="26" fill="#e1e1e1" stroke="#adadad"/><text x="533" y="467" font-size="12.5" fill="#1f2328" font-weight="400" text-anchor="middle">İptal</text><rect x="29" y="143" width="122" height="23" rx="7" fill="none" stroke="#e5243b" stroke-width="3"/><circle cx="165" cy="154.5" r="13" fill="#e5243b"/><text x="165" y="159.5" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="29" y="337" width="154" height="23" rx="7" fill="none" stroke="#e5243b" stroke-width="3"/><circle cx="197" cy="348.5" r="13" fill="#e5243b"/><text x="197" y="353.5" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="29" y="381" width="114" height="23" rx="7" fill="none" stroke="#e5243b" stroke-width="3"/><circle cx="157" cy="392.5" r="13" fill="#e5243b"/><text x="157" y="397.5" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="402" y="446" width="86" height="34" rx="7" fill="none" stroke="#e5243b" stroke-width="3"/><circle cx="445.0" cy="432" r="13" fill="#e5243b"/><text x="445.0" y="437" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="300.0" y="512" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle">Çizim · ArthurLegal kurulumunun modül ekranı (örnek görünüm)</text></g></svg>
