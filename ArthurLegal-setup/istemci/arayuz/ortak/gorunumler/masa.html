  // Karar satırı: kurum, konu, künye; metni aç, (SPK'da) bültende ara, atfı kopyala, resmî kaynak.
  function kararSatiri(v) {
    const g = ogesi("section", "grup karar");
    const bas = ogesi("div", "grup-bas");
    bas.append(ogesi("span", "hap-altin", ISTEK.AD[v.kurum] || v.kurum), ogesi("span", "baslik", v.baslik));
    g.append(bas, ogesi("div", "kunye", [v.no && `No. ${v.no}`, v.tarih, ...v.ek].filter(Boolean).join(" · ")));
    if (v.ozet) g.append(ogesi("p", "kunye", String(v.ozet).replace(/\s+/g, " ").slice(0, 260) + "…"));
    const eylem = ogesi("div", "eylemler sol");
    const yer = ogesi("div", "karar-metni");
    if (v.getir || v.ref) {
      const metin = dugme("Metni aç", { simge: "kitap" });
      let acik = false;
      metin.onclick = async () => {
        if (acik) { yer.replaceChildren(); acik = false; metin.querySelector("span").textContent = "Metni aç"; return; }
        acik = true;
        metin.querySelector("span").textContent = "Metni kapat";
        const adim = AL.adimlar(yer).ekle("Metin resmî kaynaktan getiriliyor…");
        try {
          const { veri, hata } = v.ref
            ? await cagir(app, "tr_belge_getir", { ref: v.ref })
            : await cagir(app, "tr_kurum_karari_getir", { ...v.getir, page_chars: 8000 });
          const yazi = veri && (veri.text || veri.content || "");
          if (!yazi) throw new Error(hata || "Metin boş geldi.");
          adim.tamam(`Metin geldi${veri.total_pages > 1 ? ` (1/${veri.total_pages}. sayfa)` : ""}.`);
          yer.append(KART.uzunMetin(String(yazi).split(/\n+/).map((p) => p.trim()).filter(Boolean), 700));
        } catch {
          adim.hata("Metin getirilemedi.");
          yer.append(ogesi("p", "uyari", AL.UYARI + (v.url || KURUM_KAYNAK[v.kurum])));
        }
      };
      eylem.append(metin);
    }
    if (v.kurum === "spk" && v.bulten) {
      const ara = dugme("Bültende ara", { simge: "arama" });
      ara.onclick = () => {
        yer.replaceChildren();
        const f = ogesi("form", "satir");
        const q = girdi("search", "halka arz · idari para cezası · işlem yasağı");
        const b = dugme("Ara", { sinif: "kucuk", simge: "arama" });
        b.type = "submit";
        f.append(alan(`SPK Bülteni ${v.bulten} içinde`, q), b);
        const s = ogesi("div", "kesit");
        f.onsubmit = async (e) => {
          e.preventDefault();
          s.replaceChildren();
          const adim = AL.adimlar(s).ekle(`Bülten ${v.bulten} içinde “${q.value.trim()}” aranıyor…`);
          try {
            const { veri, hata } = await cagir(app, "tr_spk_bulten_icinde_ara", { bulten: v.bulten, query: q.value.trim(), limit: 8 });
            if (!veri) throw new Error(hata);
            const bolumler = veri.results || veri.matches || [];
            (bolumler.length ? adim.tamam : adim.uyar)(bolumler.length ? `${bolumler.length} bölüm bulundu.` : "Bu bültende geçmiyor.");
            for (const r of bolumler) s.append(ogesi("p", "kunye", String(r.snippet || r.text || r.excerpt || "").replace(/\s+/g, " ").slice(0, 400)));
          } catch {
            adim.hata("Bültende aranamadı.");
            s.append(ogesi("p", "uyari", AL.UYARI + v.url));
          }
        };
        yer.append(f, s);
        q.focus();
      };
      eylem.append(ara);
    }
    const kopya = dugme("Atfı kopyala", { simge: "kopya" });
    kopya.onclick = () => kopyala(v.atif || v.baslik, kopya, null, ortam.duyuru);
    const kaynak = dugme("Resmî kaynak", { simge: "dis" });
    kaynak.onclick = () => baglantiAc(app, v.url, ortam.duyuru);
    eylem.append(kopya, kaynak);
    g.append(eylem, yer);
    return g;
  }

  // Arama sonucunun satırı: tür, ad, künye; madde getir, içindekiler, atıf, resmî metin.
  function mevzuatSatiri(m) {
    const g = ogesi("section", "grup karar");
    const bas = ogesi("div", "grup-bas");
    bas.append(ogesi("span", "hap-altin", TUR_ADI[m.type] || m.type || "Mevzuat"));
    bas.append(ogesi("span", "baslik", mevzuatAdi(m)));
    g.append(bas, ogesi("div", "kunye", mevzuatKunyesi(m)));
    const eylem = ogesi("div", "eylemler sol");
    const madde = dugme("Madde getir", { simge: "kitap" });
    const icind = dugme("İçindekiler", { simge: "liste" });
    const kopya = dugme("Atfı kopyala", { simge: "kopya" });
    const kaynak = dugme("Resmî metin", { simge: "dis" });
    const yer = ogesi("div", "karar-metni");
    madde.onclick = () => {
      mevzuatSecili = { mevzuat_id: String(m.mevzuat_id), ad: mevzuatAdi(m), number: m.number, type: m.type };
      mevzuatSekme("getir");
    };
    let acik = false;
    icind.onclick = async () => {
      if (acik) { yer.replaceChildren(); acik = false; icind.querySelector("span").textContent = "İçindekiler"; return; }
      acik = true;
      icind.querySelector("span").textContent = "İçindekileri kapat";
      icindekiler(yer, m);
    };
    kopya.onclick = () => kopyala(m.citation || mevzuatAdi(m), kopya, null, ortam.duyuru);
    kaynak.onclick = () => baglantiAc(app, m.source_url || MEVZUAT_KAYNAK, ortam.duyuru);
    eylem.append(madde, icind, kopya, kaynak);
    g.append(eylem, yer);
    return g;
  }

  // Madde ağacı: başlıklar listelenir, süzülür; bir maddeye basınca metni kartla gelir.
  async function icindekiler(yer, m) {
    const adim = AL.adimlar(yer).ekle("Madde başlıkları resmî kaynaktan getiriliyor…");
    try {
      const { veri, hata } = await cagir(app, "tr_mevzuat_icindekiler", { mevzuat_id: String(m.mevzuat_id), compact: true, limit: 2000 });
      if (!veri) throw new Error(hata);
      const satirlar = (veri.rows || []).map((r) => String(r).split(" | ")).filter((p) => p.length >= 2)
        .map(([no, baslik]) => ({ no: no.replace(/\s*\[\d+\]$/, ""), baslik: AL.baslikGoster(baslik) }));
      if (!satirlar.length) { adim.uyar("Bu mevzuatın madde ağacı kaynakta yok; maddeyi numarasıyla getirin."); return; }
      adim.tamam(`${satirlar.length} madde başlığı.` + (veri.has_more ? " Liste kısaltıldı." : ""));
      const suz = girdi("search", "Başlıkta süz: kira, süre, fesih …");
      const liste = ogesi("div", "madde-listesi");
      const kart = ogesi("div", "sonuc-kabi");
      kart.hidden = true;
      const ciz = () => {
        const k = suz.value.trim().toLocaleLowerCase("tr");
        liste.replaceChildren();
        for (const s of satirlar.filter((x) => !k || x.baslik.toLocaleLowerCase("tr").includes(k))) {
          const b = ogesi("button", "madde-satiri");
          b.type = "button";
          b.append(ogesi("span", "no", `m. ${s.no}`), ogesi("span", "ad", s.baslik || "başlık kaynakta yok"));
          b.onclick = () => maddeyiGoster(kart, { mevzuat_id: String(m.mevzuat_id), ad: mevzuatAdi(m) }, [s.no]);
          liste.append(b);
        }
      };
      suz.oninput = ciz;
      ciz();
      yer.append(alan("Başlıkta süz", suz), liste, kart);
    } catch {
      adim.hata("Madde başlıkları getirilemedi.");
      yer.append(ogesi("p", "uyari", AL.UYARI + (m.source_url || MEVZUAT_KAYNAK)));
    }
  }

  // Maddeyi resmî metinden çekip kartla gösterir. hedef: { mevzuat_id, ad } ya da { number, ad }.
  async function maddeyiGoster(kap, hedef, maddeler, adimlar = null) {
    kap.hidden = false;
    if (!adimlar) { kap.replaceChildren(); adimlar = AL.adimlar(kap); }
    const a = adimlar.ekle(`${hedef.ad} m. ${maddeler.join(", ")} resmî kaynaktan çekiliyor…`);
    const girdiler = { madde_no: maddeler.length === 1 ? maddeler[0] : maddeler };
    if (hedef.mevzuat_id) girdiler.mevzuat_id = hedef.mevzuat_id; else girdiler.number = hedef.number;
    try {
      const { veri, hata } = await cagir(app, "tr_mevzuat_madde_getir", girdiler);
      if (!veri) throw new Error(hata);
      const tamam = (veri.items || []).filter((i) => i && i.ok).length;
      const toplam = (veri.items || []).length;
      // Kaynak hiç madde döndürmediyse doğrulanan bir şey yoktur: 0/0 başarı sayılmaz.
      const hepsi = toplam > 0 && tamam === toplam;
      const ozet = toplam ? `${toplam} maddeden ${sayiEki(tamam)} doğrulandı` : "Kaynak madde döndürmedi; doğrulanmadı";
      (hepsi ? a.tamam : a.uyar)(ozet + ".");
      kap.append(KART.madde(veri, ortam));
      gecmiseEkle(`${hedef.ad} m. ${maddeler.join(", ")}`, [["tamam", hedef.ad], [hepsi ? "tamam" : "uyar", ozet]],
        { kategori: "mevzuat", tur: "madde", sorgu: { hedef, maddeler }, anlik: { veri } });
      bildir(`${hedef.ad} m. ${maddeler.join(", ")} getirildi; ${tamam}/${toplam} doğrulandı. Atıflar: ${(veri.items || []).filter((i) => i.ok).map((i) => i.citation).join(" | ")}`);
      return true;
    } catch {
      a.hata("Madde getirilemedi.");
      kap.append(ogesi("p", "uyari", AL.UYARI + MEVZUAT_KAYNAK));
      return false;
    }
  }

  function maddeGetir(ekran) {
    const form = ogesi("form", "form");
    const kanun = girdi("text", "Kanun adı, numarası ya da kısaltması: TBK, 6446, Elektrik Piyasası …");
    const madde = girdi("text", "344  ·  344, 345  ·  geçici 1");
    const satir = ogesi("div", "satir");
    const getir = dugme("Getir", { sinif: "birincil", simge: "arama" });
    getir.type = "submit";
    // Aramadan gelen mevzuat (KHK, yönetmelik, tebliğ dâhil) seçili durur; değiştirince kanun alanına dönülür.
    const seciliAlan = ogesi("div", "alan");
    const kanunAlani = alan("Mevzuat", kanun);
    const seciliCiz = () => {
      seciliAlan.replaceChildren();
      seciliAlan.hidden = !mevzuatSecili;
      kanunAlani.hidden = !!mevzuatSecili;
      if (!mevzuatSecili) return;
      const hap = ogesi("div", "secili-mevzuat");
      hap.append(ogesi("span", "hap-altin", TUR_ADI[mevzuatSecili.type] || "Mevzuat"), ogesi("span", "ad", mevzuatSecili.ad));
      const degis = dugme("Değiştir", { sinif: "kucuk" });
      degis.onclick = () => { mevzuatSecili = null; seciliCiz(); kanun.focus(); };
      hap.append(degis);
      seciliAlan.append(ogesi("label", null, "Mevzuat"), hap);
    };
    seciliCiz();
    satir.append(seciliAlan, kanunAlani, alan("Madde", madde, "alan dar"), getir);
    form.append(satir);
    const sonuc = ogesi("div", "kesit");
    form.onsubmit = async (e) => {
      e.preventDefault();
      sonuc.replaceChildren();
      const adimlar = AL.adimlar(sonuc);
      const maddeler = madde.value.split(",").map((s) => s.trim()).filter(Boolean).slice(0, 10);
      if (!mevzuatSecili && !kanun.value.trim()) { adimlar.ekle("").hata("Mevzuatın adını ya da numarasını yazın (ör. TBK, 6446)."); return; }
      if (!maddeler.length) { adimlar.ekle("").hata("Madde numarası yazın (ör. 344)."); return; }
      getir.disabled = true;
      try {
        let hedef = mevzuatSecili;
        if (!hedef) {
          const no = kanunCoz(kanun.value);
          if (no) {
            hedef = { number: no, ad: kanunAdi(no) };
            adimlar.ekle("").tamam(hedef.ad);
          } else {
            // Kısa ad listesinde yok: ad, mevzuatın tamamında aranır.
            const a1 = adimlar.ekle(`“${kanun.value.trim()}” mevzuatta aranıyor…`);
            // Madde çoğunlukla kanundan istenir: önce kanunlarda, bulunmazsa bütün mevzuatta aranır.
            let { veri } = await cagir(app, "tr_mevzuat_ara", { query: kanun.value.trim(), types: ["KANUN"], page_size: 5 });
            if (!veri || !(veri.results || []).length) ({ veri } = await cagir(app, "tr_mevzuat_ara", { query: kanun.value.trim(), page_size: 5 }));
            // Adı tam tutan (ya da "… Kanunu" diye tamamlanan) tek aday sorulmadan seçilir; ötekiler adı aranan
            // ifadeyle başlayan önce, kısası önce sıralanır (torba kanunlar arkaya düşer).
            const norm = (s) => AL.baslikDuzeni(s || "").toLocaleLowerCase("tr");
            const aranan = norm(kanun.value.trim());
            const bas = (m) => norm(m.title).startsWith(aranan);
            let adaylar = [...((veri && veri.results) || [])]
              .sort((x, y) => (bas(y) - bas(x)) || ((x.title || "").length - (y.title || "").length));
            const tam = adaylar.filter((m) => [aranan, aranan + " kanunu"].includes(norm(m.title)));
            if (tam.length === 1) adaylar = tam;
            if (!adaylar.length) { a1.hata("Bu adla mevzuat bulunamadı. Numarasını yazın ya da “Mevzuatta ara”yı kullanın."); return; }
            if (adaylar.length > 1) {
              a1.uyar(`${adaylar.length} mevzuat bulundu; hangisi?`);
              const secim = ogesi("div", "aday-listesi");
              for (const m of adaylar) {
                const b = ogesi("button", "madde-satiri");
                b.type = "button";
                b.append(ogesi("span", "no", TUR_ADI[m.type] || m.type || ""), ogesi("span", "ad", `${mevzuatAdi(m)} · ${mevzuatKunyesi(m)}`));
                b.onclick = () => {
                  mevzuatSecili = { mevzuat_id: String(m.mevzuat_id), ad: mevzuatAdi(m), number: m.number, type: m.type };
                  seciliCiz();
                  form.requestSubmit();
                };
                secim.append(b);
              }
              sonuc.append(secim);
              return;
            }
            const m = adaylar[0];
            hedef = { mevzuat_id: String(m.mevzuat_id), ad: mevzuatAdi(m) };
            a1.tamam(`${hedef.ad} (${mevzuatKunyesi(m)})`);
          }
        }
        const kap = ogesi("div", "sonuc-kabi");
        sonuc.append(kap);
        await maddeyiGoster(kap, hedef, maddeler, adimlar);
      } catch {
        adimlar.ekle("").hata("Mevzuat aranamadı.");
        sonuc.append(ogesi("p", "uyari", AL.UYARI + MEVZUAT_KAYNAK));
      } finally {
        getir.disabled = false;
      }
    };
    ekran.append(form, sonuc);
    if (bekleyen && bekleyen.sekme === "getir") {
      if (!mevzuatSecili && bekleyen.kanun) kanun.value = bekleyen.kanun;
      madde.value = bekleyen.maddeler.join(", ");
      bekleyen = null;
      form.requestSubmit();
    }
  }

  // Atıfları (kanun + madde) resmî metinden doğrular. Taslağın cümleleri kullanılmaz; geçmişe de yalnız bu satırlar gider.
  async function atiflariDogrula(atiflar, adimlar) {
    const gruplar = new Map();
    for (const a of atiflar) gruplar.set(a.kanun, [...(gruplar.get(a.kanun) || []), a]);
    const tablo = ogesi("div", "teyit");
    const satirlar = [];
    let dogru = 0;
    for (const [kanun, liste] of gruplar) {
      for (let i = 0; i < liste.length; i += 10) {
        const parca = liste.slice(i, i + 10);
        const ad = adimlar.ekle(`${kanunAdi(kanun)}: m. ${parca.map((p) => p.madde).join(", ")} kontrol ediliyor…`);
        try {
          const { veri, hata } = await cagir(app, "tr_mevzuat_madde_getir", { number: kanun, madde_no: parca.map((p) => p.madde) });
          if (!veri) throw new Error(hata);
          const items = veri.items || [];
          let ok = 0;
          parca.forEach((p, j) => {
            const it = items[j] || {};
            const s = { kanun, madde: p.madde, ok: !!it.ok, baslik: it.ok ? AL.baslikYolu(it) : "",
              citation: it.citation || "", hata: it.ok ? "" : (it.error_code || "") };
            if (s.ok) ok++;
            satirlar.push(s);
            tablo.append(teyitSatiri(s));
          });
          dogru += ok;
          (ok === parca.length ? ad.tamam : ad.uyar)(`${kanunAdi(kanun)}: ${parca.length} atıftan ${sayiEki(ok)} doğru.`);
        } catch {
          ad.hata(`${kanunAdi(kanun)}: kaynağa ulaşılamadı.`);
        }
      }
    }
    return { tablo, satirlar, dogru };
  }

  function teyitSatiri(s) {
    const satirEl = ogesi("div", "teyit-satiri");
    if (s.ok) {
      satirEl.append(ogesi("span", "rozet nane", "Doğrulandı"), ogesi("span", "ne", `${kisaAd(s.kanun)} m. ${s.madde}`),
        ogesi("span", "baslik-k", s.baslik || "başlık kaynakta yok"));
      const kp = dugme("Atfı kopyala", { sinif: "kucuk", simge: "kopya" });
      kp.onclick = () => kopyala(s.citation, kp, null, ortam.duyuru);
      satirEl.append(kp);
    } else {
      satirEl.append(ogesi("span", "rozet amber", s.hata === "NOT_FOUND" ? "Bulunamadı" : "Doğrulanamadı"),
        ogesi("span", "ne", `${kisaAd(s.kanun)} m. ${s.madde}`), ogesi("span", "baslik-k", "Atıf olarak kullanmayın; resmî metinden teyit edin."));
    }
    return satirEl;
  }

  function atifTeyidi(ekran) {
    const form = ogesi("form", "form");
    const metin = girdi("metin-alani", "Dilekçe ya da sözleşme metnini yapıştırın. Örnek: … 6098 sayılı TBK m. 344 uyarınca kira bedelinin belirlenmesi …");
    metin.rows = 8;
    const satir = ogesi("div", "satir");
    const bul = dugme("Atıfları bul ve teyit et", { sinif: "birincil", simge: "onay" });
    bul.type = "submit";
    satir.append(bul);
    form.append(alan("Metin", metin), bilgi("Metin bu ekranda kalır; sunucuya yalnız kanun ve madde numaraları gider."), satir);
    const sonuc = ogesi("div", "kesit");
    form.onsubmit = async (e) => {
      e.preventDefault();
      sonuc.replaceChildren();
      const adimlar = AL.adimlar(sonuc);
      const a1 = adimlar.ekle("Metindeki madde atıfları aranıyor…");
      const atiflar = atiflariBul(metin.value);
      if (!atiflar.length) { a1.uyar("Metinde tanınan bir madde atfı bulunamadı. “TBK m. 344” ya da “6098 sayılı … 344. maddesi” biçimleri tanınır."); return; }
      a1.tamam(`${atiflar.length} atıf bulundu.`);
      bul.disabled = true;
      const { tablo, satirlar, dogru } = await atiflariDogrula(atiflar, adimlar);
      bul.disabled = false;
      const kap = ogesi("div", "sonuc-kabi");
      const ust = ogesi("div", "sonuc-ust");
      const bk = ogesi("div", "sonuc-baslik");
      bk.append(ogesi("h2", null, "Atıf teyidi"), ogesi("div", "kunye", `${atiflar.length} atıf · ${dogru} doğrulandı`));
      ust.append(bk, KART.durumRozeti(dogru, atiflar.length));
      const kontrol = dugme("Cümleleri Claude'a kontrol ettir", { simge: "sohbet" });
      kontrol.onclick = () => claudeaSor(
        "ArthurLegal atıf teyidi: aşağıdaki cümlelerdeki madde atıflarının içeriği maddenin başlığı ve metniyle örtüşüyor mu? " +
        "Her maddeyi tr_mevzuat_madde_getir ile çek, atfı citation alanıyla birebir yaz, uyuşmayanı açıkça belirt.\n\n" +
        atiflar.map((a, i) => `${i + 1}. [${kanunAdi(a.kanun)} m. ${a.madde}] … ${a.cumle} …`).join("\n"),
        `Atıf teyidi: ${atiflar.length} atfın içerik uyumu Claude'a soruldu`, { metinSaklanmaz: true });
      kap.append(ust, tablo, bilgi("Numaraların doğruluğu burada kontrol edildi. Maddeye yüklenen içeriğin (hakkın sahibi, şart, süre) metinle örtüşmesini Claude'a kontrol ettirebilirsiniz; bu, atıfların geçtiği cümleleri sohbete gönderir. Müvekkil bilgisi varsa önce ArthurMask'ten geçirin."));
      const alt = ogesi("div", "alt-satir");
      const ey = ogesi("div", "eylemler");
      ey.append(kontrol);
      alt.append(ogesi("span", "zaman", "mevzuat.gov.tr"), ey);
      kap.append(alt);
      sonuc.append(kap);
      gecmiseEkle(`Atıf teyidi (${atiflar.length} atıf)`, [["tamam", `${atiflar.length} atıf bulundu`], [dogru === atiflar.length ? "tamam" : "uyar", `${dogru} doğrulandı`]],
        { kategori: "atif", tur: "atif", sorgu: { atiflar: atiflar.map((a) => ({ kanun: a.kanun, madde: a.madde })) },
          anlik: { satirlar, dogru, toplam: atiflar.length } });
      bildir(`atıf teyidi yapıldı: ${atiflar.length} atıftan ${sayiEki(dogru)} resmî metinde bulundu.`);
    };
    ekran.append(form, sonuc);
  }

  // ---- İçtihat ----
  CIZIM.ictihat = (ekran) => {
    const form = ogesi("form", "form");
    const sorgu = girdi("text", "kira bedelinin tespiti hak ve nesafet");
    const daire = girdi("text", "H3, HGK, D10 …");
    const sayi = document.createElement("select");
    for (const n of [5, 10, 20]) sayi.append(new Option(`${n} karar`, String(n), n === 10, n === 10));
    const seg = ogesi("div", "segment");
    let mahkeme = "hepsi";
    for (const [id, yazi] of [["yargitay", "Yargıtay"], ["danistay", "Danıştay"], ["hepsi", "İkisi"]]) {
      const b = dugme(yazi);
      b.setAttribute("aria-pressed", String(id === mahkeme));
      b.onclick = () => { mahkeme = id; seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); };
      seg.append(b);
    }
    const ara = dugme("Ara", { sinif: "birincil", simge: "arama" });
    ara.type = "submit";
    const s1 = ogesi("div", "satir");
    s1.append(alan("Aranan ifade", sorgu));
    const s2 = ogesi("div", "satir");
    const segAlan = ogesi("div", "alan");
    segAlan.append(ogesi("label", null, "Mahkeme"), seg);
    s2.append(segAlan, alan("Daire (isteğe bağlı)", daire, "alan dar"), alan("Sonuç", sayi, "alan dar"), ara);
    form.append(s1, s2);
    const sonuc = ogesi("div", "kesit");
    form.onsubmit = async (e) => {
      e.preventDefault();
      const q = sorgu.value.trim();
      sonuc.replaceChildren();
      const adimlar = AL.adimlar(sonuc);
      if (!q) { adimlar.ekle("").hata("Aranacak ifadeyi yazın."); return; }
      const courts = mahkeme === "yargitay" ? ["YARGITAYKARARI"] : mahkeme === "danistay" ? ["DANISTAYKARAR"] : ["YARGITAYKARARI", "DANISTAYKARAR"];
      const yer = mahkeme === "yargitay" ? "Yargıtay" : mahkeme === "danistay" ? "Danıştay" : "Yargıtay ve Danıştay";
      const a = adimlar.ekle(`${yer} kararlarında “${q}” aranıyor…`);
      ara.disabled = true;
      try {
        const girdiler = { query: q, courts, page_size: Number(sayi.value) };
        if (daire.value.trim()) girdiler.chamber = daire.value.trim();
        const { veri, hata } = await cagir(app, "tr_ictihat_ara", girdiler);
        if (!veri) throw new Error(hata);
        const n = (veri.results || []).length;
        (n ? a.tamam : a.uyar)(n ? `${veri.total ?? n} karar bulundu, ${sayiEki(n)} listelendi (${veri.arama_modu || "arama"}).` : "Bu ifadeyle karar bulunamadı.");
        const kap = ogesi("div", "sonuc-kabi");
        kap.append(KART.ictihat(veri, ortam));
        sonuc.append(kap);
        const derin = dugme("Claude'a derin araştırma yaptır", { simge: "sohbet" });
        derin.onclick = () => claudeaSor(`ArthurLegal ile şu konuda içtihat araştırması yap; kararları künyeleriyle birebir ver: ${q}`, `İçtihat araştırması: ${q}`);
        sonuc.append(derin);
        gecmiseEkle(`İçtihat: “${q}”`, [["tamam", `${yer} tarandı`], [n ? "tamam" : "uyar", n ? `${n} karar listelendi` : "Sonuç yok"]],
          { kategori: "ictihat", tur: "ictihat", sorgu: { q, mahkeme, daire: daire.value.trim(), sayi: Number(sayi.value) },
            anlik: { veri } });
        bildir(`içtihat araması "${q}": ${n} karar. Künyeler: ${(veri.results || []).map((k) => k.citation).join(" | ")}`);
      } catch {
        a.hata("Kararlar getirilemedi.");
        sonuc.append(ogesi("p", "uyari", AL.UYARI + "https://karararama.yargitay.gov.tr/"));
      } finally {
        ara.disabled = false;
      }
    };
    ekran.append(form, sonuc);
    if (bekleyen && bekleyen.ekran === "ictihat") {
      const b = bekleyen;
      bekleyen = null;
      sorgu.value = b.q || "";
      daire.value = b.daire || "";
      if ([5, 10, 20].includes(b.sayi)) sayi.value = String(b.sayi);
      if (["yargitay", "danistay", "hepsi"].includes(b.mahkeme)) {
        mahkeme = b.mahkeme;
        seg.querySelectorAll("button").forEach((x, i) => x.setAttribute("aria-pressed", String(["yargitay", "danistay", "hepsi"][i] === mahkeme)));
      }
      form.requestSubmit();
    }
  };

  // ---- Hesap kartları ----
  // Hesabı sunucudaki kod yapar (hesap_ araçları, Resmî Gazete'deki tarife verisiyle); masa işlem seçtirir, yalnız o
  // işlemin istediği kutuları açar ve sonucu her kalemin dayanağıyla gösterir. Hangi işlemde hangi kutunun sorulduğu
  // hesap_kalemleri'nden (veriden) gelir. Masa tutar hesaplamaz, toplamaz, yuvarlamaz.
  const HESAP_ARACLARI = ["hesap_kalemleri", "hesap_vekalet_ucreti", "hesap_yargi_harci"];
  const HESAP_KARTLARI = [["vekalet", "Vekâlet ücreti", "hesap_vekalet_ucreti"],
    ["harc", "Yargı harcı ve gider avansı", "hesap_yargi_harci"]];
  let hesapMenusu = null;      // hesap_kalemleri cevabı, oturum boyunca
  let hesapKart = "vekalet";
  const hesapSecili = {};      // kart -> son seçilen işlem

  CIZIM.hesap = (ekran) => {
    if (!HESAP_ARACLARI.every((a) => DURUM.yetenekler.has(a))) {
      ekran.append(bilgi("Hesap kartları bu bağlantıda yok. Avukatlık asgari ücreti, yargı harcı ve gider avansı " +
        "ArthurLegal'in kendi bağlantısında (arthurlegal-mcp) hesaplanır; Claude'a sorarsanız aynı araçlarla hesaplatır."));
      return;
    }
    const seg = ogesi("div", "segment");
    seg.style.maxWidth = "520px";
    for (const [id, yazi] of HESAP_KARTLARI) {
      const b = dugme(yazi);
      b.setAttribute("aria-pressed", String(hesapKart === id));
      b.onclick = () => { hesapKart = id; const e = $("ekran"); e.replaceChildren(); CIZIM.hesap(e); };
      seg.append(b);
    }
    const govde = ogesi("div", "kesit");
    ekran.append(seg, govde);
    if (hesapMenusu) { hesapFormu(govde); return; }
    const a = AL.adimlar(govde).ekle("Hesap kartları açılıyor…");
    cagir(app, "hesap_kalemleri", {}).then(({ veri, hata }) => {
      if (!veri || !veri.vekalet || !veri.harc) throw new Error(hata || "menü gelmedi");
      hesapMenusu = veri;
      if (govde.isConnected) { govde.replaceChildren(); hesapFormu(govde); }
    }).catch((e) => a.hata("Hesap kartları açılamadı: " + (e.message || "bilinmeyen hata")));
  };

  function hesapFormu(govde) {
    const kart = hesapMenusu[hesapKart];
    const arac = HESAP_KARTLARI.find((k) => k[0] === hesapKart)[2];
    const islemler = kart.islemler || [];
    let islem = islemler.find((i) => i.kod === hesapSecili[hesapKart]) || islemler[0];
    const form = ogesi("form", "form");
    const secim = document.createElement("select");
    for (const i of islemler) secim.append(new Option(i.ad, i.kod, false, i.kod === islem.kod));
    const kutular = ogesi("div", "hesap-kutular");
    const hesapla = dugme("Hesapla", { sinif: "birincil", simge: "hesap" });
    hesapla.type = "submit";
    const sonuc = ogesi("div", "kesit");
    let alanlar = hesapKutulari(islem, kutular);
    secim.onchange = () => {
      islem = islemler.find((i) => i.kod === secim.value);
      hesapSecili[hesapKart] = islem.kod;
      sonuc.replaceChildren();
      alanlar = hesapKutulari(islem, kutular);
    };
    const ey = ogesi("div", "eylemler sol");
    ey.append(hesapla);
    const kaynak = hesapKart === "vekalet" ? [kart.kaynak] : (kart.kaynaklar || []);
    const not = kaynak.filter((k) => k && k.rg).map((k) => `${k.ad}, ${k.rg}`).join(" · ");
    const ust = ogesi("div", "satir");
    ust.append(alan("İşlem", secim));
    form.append(ust, kutular, ey);
    if (not) form.append(ogesi("p", "kucuk-not", "Kaynak: " + not));
    // Menüde bu kartı etkileyen yeni düzenleme varsa formun üstünde kırmızı kutu; hesaptan sonra sonucun kendi kutusu kalır.
    const mt = hesapMenusu.tazelik;
    let ustKutu = [];
    if (mt && mt.durum === "yeni_duzenleme" && (mt.yeni || []).some((y) => (y.kartlar || []).includes(hesapKart))) {
      ustKutu = tazelikOgeleri(Object.assign({}, mt, { yeni: mt.yeni.filter((y) => (y.kartlar || []).includes(hesapKart)) }),
        { satirsiz: true });
      govde.append(...ustKutu);
    }
    form.onsubmit = async (e) => {
      e.preventDefault();
      sonuc.replaceChildren();
      const adimlar = AL.adimlar(sonuc);
      const girdi = { islem: islem.kod };
      for (const [ad, a] of Object.entries(alanlar)) {
        if (!a.gorunur()) continue;
        const v = a.deger();
        if (v === "" || v === false || v == null) {
          if (a.tanim.zorunlu) { adimlar.ekle("").hata(`${a.tanim.etiket}: bu kutu gerekli.`); a.odak(); return; }
          continue;
        }
        girdi[ad] = v;
      }
      const s = adimlar.ekle(hesapKart === "vekalet" ? "Asgari ücret tarifeden hesaplanıyor…" : "Harç tarifeden hesaplanıyor…");
      hesapla.disabled = true;
      try {
        const { veri, hata } = await cagir(app, arac, girdi);
        if (!veri) throw new Error(hata || "Hesap yapılamadı.");
        const tz = veri.tazelik || {};
        const kilitli = tz.durum === "yeni_duzenleme";
        const h = kilitli ? (veri.teyit_bekleyen_tutarlar || {}) : veri;
        const teyitsiz = tz.durum === "kontrol_edilemedi" ? " (teyit edilmedi)" : "";
        const ozet = kilitli ? "Resmî Gazete'de yeni düzenleme var; toplam gösterilmiyor"
          : (hesapKart === "vekalet" ? `Asgari ücret: ${tlYaz(veri.asgari_tl)}` : `Toplam: ${tlYaz(veri.toplam_tl)}`) + teyitsiz;
        if (kilitli || teyitsiz) s.uyar(ozet); else s.tamam(ozet);
        for (const o of ustKutu) o.remove();
        sonuc.append(hesapSonucu(veri));
        bildir(`hesap kartı, ${islem.ad}: ${ozet}. ${tz.uyari ? tz.uyari + " " : ""}${tz.satir ? tz.satir + ". " : ""}` +
          `${kilitli ? "Teyit bekleyen kalemler" : "Kalemler"}: ${(h.kalemler || []).map((k) => `${k.kalem} ${tlYaz(k.tutar_tl)}`).join(" | ")}`);
      } catch (e2) {
        s.hata(e2.message || "Hesap yapılamadı.");
      } finally {
        hesapla.disabled = false;
      }
    };
    govde.append(form, sonuc);
  }

  // İşlemin istediği kutular; `yalniz` olan kutu ancak öteki kutunun değeri o olunca görünür.
  function hesapKutulari(islem, kap) {
    kap.replaceChildren();
    const alanlar = {};
    let satir = null;         // yan yana duran kutular; seçim düğmeleri kendi satırında
    const sonra = [];         // onay kutuları ve açıklamalar en altta
    const guncelle = () => {
      for (const a of Object.values(alanlar)) {
        const g = a.gorunur();
        a.yer.hidden = !g;
        if (a.not) a.not.hidden = !g;
      }
    };
    for (const g of islem.girdiler || []) {
      let el;
      let deger;
      let kok;
      const kisa = g.tur === "secim" && !g.gruplar && (g.secenekler || []).length <= 3 && g.secenekler.every((s) => s.ad.length <= 28);
      if (kisa) {
        el = ogesi("div", "segment");
        let sec = g.secenekler[0].kod;
        for (const s of g.secenekler) {
          const b = dugme(s.ad);
          b.setAttribute("aria-pressed", String(s.kod === sec));
          b.onclick = () => {
            sec = s.kod;
            el.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
            guncelle();
          };
          el.append(b);
        }
        deger = () => sec;
        kok = ogesi("div", "alan");
        kok.append(ogesi("label", null, g.etiket), el);
      } else if (g.tur === "secim") {
        el = document.createElement("select");
        // Uzun listede varsayılan seçim yok: kullanıcı kendi seçer, ilk satır sessizce hesaba girmez.
        el.append(new Option("Seçin…", ""));
        for (const gr of g.gruplar || [{ secenekler: g.secenekler }]) {
          const hedef = gr.bolum ? document.createElement("optgroup") : el;
          if (gr.bolum) hedef.label = gr.bolum;
          for (const s of gr.secenekler) {
            const ek = s.tutar_tl != null ? ` (${tlYaz(s.tutar_tl)}${s.ek_saat_tl ? ", ilk saat" : ""}${s.birim === "aylık" ? ", aylık" : ""})` : "";
            const o = new Option(s.ad + ek, s.kod);
            if (s.ek_saat_tl) o.dataset.ekSaat = "1";
            hedef.append(o);
          }
          if (hedef !== el) el.append(hedef);
        }
        deger = () => el.value;
        kok = alan(g.etiket, el);
      } else if (g.tur === "onay") {
        el = document.createElement("input");
        el.type = "checkbox";
        const l = ogesi("label", "onay-kutusu");
        l.append(el, ogesi("span", null, g.etiket));
        kok = ogesi("div", "alan");
        kok.append(l);
        deger = () => el.checked;
      } else {
        el = girdi(g.tur === "sayi" ? "number" : "text", g.tur !== "tutar" ? "" : g.zorunlu || g.ad === "deger" ? "örn. 1.250.000" : "TL",
          g.varsayilan != null ? String(g.varsayilan) : "");
        if (g.tur === "sayi") { el.min = "1"; el.step = "1"; } else el.inputMode = "decimal";
        deger = () => el.value.trim();
        kok = alan(g.etiket + (g.zorunlu ? "" : " (isteğe bağlı)"), el, g.tur === "sayi" ? "alan dar" : "alan");
      }
      el.addEventListener("input", guncelle);
      el.addEventListener("change", guncelle);
      const kosul = g.yalniz || {};
      const gorunur = () => Object.entries(kosul).every(([k, v]) => {
        const o = alanlar[k];
        if (!o || !o.gorunur()) return false;
        if (v === "dolu") return !!o.deger();
        if (v === "ek_saat") { const s = o.el.selectedOptions && o.el.selectedOptions[0]; return !!(s && s.dataset.ekSaat); }
        return o.deger() === v;
      });
      let yer = kok;
      if (g.tur === "onay") sonra.push(kok);
      else if (kisa) {
        yer = ogesi("div", "satir");
        yer.append(kok);
        kap.append(yer);
        satir = null;
      } else {
        if (!satir) { satir = ogesi("div", "satir"); kap.append(satir); }
        satir.append(kok);
      }
      const not = g.aciklama ? ogesi("p", "kucuk-not", g.aciklama) : null;
      if (not) sonra.push(not);
      alanlar[g.ad] = { tanim: g, el, kok, yer, not, deger, gorunur, odak: () => (el.focus ? el.focus() : null) };
    }
    for (const x of sonra) kap.append(x);
    guncelle();
    return alanlar;
  }

  function hesapSatiri(kalem, tutar, dayanak, aciklama) {
    const s = ogesi("div", "hesap-satir");
    s.append(ogesi("span", null, kalem), ogesi("span", "tutar", tlYaz(tutar)));
    if (aciklama) s.append(ogesi("span", "dayanak", aciklama));
    if (dayanak) s.append(ogesi("span", "dayanak", dayanak));
    return s;
  }

  function katlanir(baslik, maddeler) {
    const d = document.createElement("details");
    d.className = "hesap-katlanir";
    const u = ogesi("ul");
    for (const m of maddeler) u.append(ogesi("li", null, m));
    d.append(ogesi("summary", null, baslik), u);
    return d;
  }

  // Tazelik (hesap_ araçlarının `tazelik` alanı): kartın verisi Resmî Gazete'nin günlük denetiminden geçer. Küçük satır
  // kaynağı ve son kontrolü söyler; yeni düzenleme varsa kırmızı kutu (toplam gösterilmez), denetim yapılamadıysa sarı kutu.
  function tazelikOgeleri(t, { satirsiz = false } = {}) {
    if (!t || typeof t !== "object") return [];
    const out = [];
    if (t.durum === "yeni_duzenleme") {
      const kutu = ogesi("div", "uyari kirmizi tazelik-kutu");
      kutu.setAttribute("role", "alert");
      const yeni = Array.isArray(t.yeni) ? t.yeni : [];
      kutu.append(ogesi("p", null, "Resmî Gazete'de bu hesabı etkileyebilecek yeni bir düzenleme yayımlandı. Tutarlar " +
        "güncellenene kadar toplam gösterilmiyor; düzenlemeyi açıp kontrol edin."));
      const ey = ogesi("div", "eylemler sol");
      for (const y of yeni.slice(0, 3)) {
        kutu.append(ogesi("p", null, `${y.rg}: ${y.baslik}`));
        if (!y.url) continue;
        const b = dugme(yeni.length > 1 ? `Aç: ${y.rg}` : "Düzenlemeyi aç", { sinif: "kucuk", simge: "dis", baslik: y.baslik });
        b.onclick = () => baglantiAc(app, y.url, ortam.duyuru);
        ey.append(b);
      }
      if (yeni.length > 3) kutu.append(ogesi("p", null, `ve ${yeni.length - 3} yayım daha`));
      if (ey.childElementCount) kutu.append(ey);
      out.push(kutu);
    } else if (t.durum === "kontrol_edilemedi") {
      const kutu = ogesi("div", "uyari tazelik-kutu");
      kutu.setAttribute("role", "status");
      const metin = String(t.uyari || "Resmî Gazete denetimi yapılamadı.")
        .replace(/^UYARI:\s*/, "").replace(/,?\s*teyidiniz gerekli:\s*\S+\s*$/, "");
      kutu.append(ogesi("p", null, `${metin}. Tutarları teyit edin.`));
      const ey = ogesi("div", "eylemler sol");
      const b = dugme("Resmî Gazete", { sinif: "kucuk", simge: "dis", baslik: "Resmî Gazete'yi aç" });
      b.onclick = () => baglantiAc(app, "https://www.resmigazete.gov.tr/", ortam.duyuru);
      ey.append(b);
      kutu.append(ey);
      out.push(kutu);
    }
    if (!satirsiz && t.satir) out.push(ogesi("p", "hesap-tazelik", t.satir));
    return out;
  }

  function hesapSonucu(v) {
    const kap = ogesi("div", "sonuc-kabi hesap-sonuc");
    const t = v.tazelik && typeof v.tazelik === "object" ? v.tazelik : null;
    const kilitli = !!t && t.durum === "yeni_duzenleme";
    // Yeni düzenlemede toplam yoktur; hesabın ayrıntısı `teyit_bekleyen_tutarlar`da, katlanır bölümde durur.
    const h = kilitli ? (v.teyit_bekleyen_tutarlar || {}) : v;
    const vekalet = typeof h.asgari_tl === "number";
    let yer = kap;
    if (kilitli) {
      kap.append(...tazelikOgeleri(t));
      const d = document.createElement("details");
      d.className = "hesap-katlanir";
      yer = ogesi("div", "hesap-sonuc");
      d.append(ogesi("summary", null, "Teyit bekleyen hesap (kesin değil)"), yer);
      kap.append(d);
    } else {
      const ust = ogesi("div", "hesap-toplam");
      const teyitsiz = !!t && t.durum === "kontrol_edilemedi";
      ust.append(ogesi("span", "etiket", (vekalet ? "Asgari avukatlık ücreti" : "Toplam") + (teyitsiz ? " (teyit edilmedi)" : "")),
        ogesi("b", "hesap-tutar", tlYaz(vekalet ? h.asgari_tl : h.toplam_tl)));
      kap.append(ust, ...tazelikOgeleri(t));
    }
    if (vekalet && h.asgari_notu && h.asgari_notu.metin) {
      yer.append(ogesi("p", "kucuk-not", `${h.asgari_notu.metin} ${(h.asgari_notu.dayanak || []).join("; ")}.`));
    }
    if (typeof h.ust_sinir_tl === "number") {
      yer.append(ogesi("p", "kunye", `Mahkemece karşı tarafa yükletilecek ücret en çok ${tlYaz(h.ust_sinir_tl)} (${h.ust_sinir_dayanak}).`));
    }
    const tablo = ogesi("div", "hesap-kalemler");
    for (const k of h.kalemler || []) tablo.append(hesapSatiri(k.kalem, k.tutar_tl, k.dayanak, k.hesap));
    yer.append(tablo);
    if (Array.isArray(h.hesap) && h.hesap.length) {
      const ol = ogesi("ol", "hesap-adimlar");
      for (const x of h.hesap) ol.append(ogesi("li", null, x));
      yer.append(ol);
    }
    const dokum = (h.kalemler || []).flatMap((k) => k.dokum || []);
    if (dokum.length > 1) {
      yer.append(katlanir(`Dilim dökümü (${dokum.length} dilim)`, dokum.map((d) =>
        `${d.sira}. dilim: ${tlYaz(d.dilim_tl)} × %${String(d.yuzde).replace(".", ",")} = ${tlYaz(d.ucret_tl)}`)));
    }
    const ga = h.gider_avansi;
    if (ga && ga.eksik) {
      yer.append(bilgi(`Gider avansı hesaplanmadı: ${ga.eksik === "tebligat_ucreti" ? "bir tebligatın ücretini girin" : "taraf sayısını girin"}. ` +
        `Hesap: ${ga.formul} (${ga.dayanak}).`));
    }
    if (h.kalan_tl != null) {
      yer.append(ogesi("p", "kunye", `Peşin ödenen ${tlYaz(h.pesin_odenen_tl)} düşülünce kalan: ${tlYaz(h.kalan_tl)} (${h.kalan_dayanak}).`));
    }
    if (Array.isArray(h.ayrica) && h.ayrica.length) {
      const k = ogesi("div", "kesit");
      k.append(ogesi("h3", null, "Toplama katılmayanlar"));
      for (const a of h.ayrica) k.append(hesapSatiri(a.kalem, a.tutar_tl, a.dayanak, a.teyit));
      yer.append(k);
    }
    for (const n of h.notlar || []) yer.append(ogesi("p", "kucuk-not", n));
    if (Array.isArray(h.teyit_edin) && h.teyit_edin.length) yer.append(katlanir(`Teyit edin (${h.teyit_edin.length})`, h.teyit_edin));
    const ey = ogesi("div", "eylemler sol");
    for (const k of h.kaynak ? [h.kaynak] : (h.kaynaklar || [])) {
      if (!k || !k.url) continue;
      const b = dugme(k.rg || "Kaynak", { sinif: "kucuk", simge: "dis", baslik: `${k.ad} (${k.rg || "kaynak"})` });
      b.onclick = () => baglantiAc(app, k.url, ortam.duyuru);
      ey.append(b);
    }
    const kop = dugme("Kopyala", { sinif: "kucuk", simge: "kopya" });
    kop.onclick = () => kopyala(hesapMetni(v), kop, null, ortam.duyuru);
    ey.append(kop);
    kap.append(ey);
    return kap;
  }

  // Panoya giden düz metin: avukat yazışmasına yapıştırılabilir; tutar ve dayanak aracın verdiği gibi.
  function hesapMetni(v) {
    const t = v.tazelik && typeof v.tazelik === "object" ? v.tazelik : null;
    const kilitli = !!t && t.durum === "yeni_duzenleme";
    const h = kilitli ? (v.teyit_bekleyen_tutarlar || {}) : v;
    const vekalet = typeof h.asgari_tl === "number";
    const s = [];
    if (t && t.uyari) s.push(t.uyari);
    if (kilitli) s.push("Teyit bekleyen hesap (kesin değil):");
    else s.push(`${vekalet ? "Asgari avukatlık ücreti" : "Toplam"}: ${tlYaz(vekalet ? h.asgari_tl : h.toplam_tl)}` +
      (t && t.durum === "kontrol_edilemedi" ? " (teyit edilmedi)" : ""));
    for (const k of h.kalemler || []) s.push(`- ${k.kalem}: ${tlYaz(k.tutar_tl)} (${k.dayanak})`);
    for (const x of h.hesap || []) s.push(`  ${x}`);
    for (const a of h.ayrica || []) s.push(`Toplama katılmayan: ${a.kalem}: ${tlYaz(a.tutar_tl)}. ${a.teyit || ""}`.trim());
    for (const k of h.kaynak ? [h.kaynak] : (h.kaynaklar || [])) if (k && k.url) s.push(`Kaynak: ${k.ad}, ${k.rg || ""} ${k.url}`);
    if (vekalet && h.asgari_notu && h.asgari_notu.metin) s.push(h.asgari_notu.metin);
    if (t && t.satir) s.push(t.satir);
    return s.join("\n");
  }

  // ---- Geçmiş ----
  // Liste kalıcı depodan (disk ya da cihaz, 90 gün; bkz. gecmiseEkle), depo kapalıysa bu pencereden (GECMIS). Ayrıntı
  // o günkü sonucu ekranların kendi çizicileriyle gösterir; "Yeniden çalıştır" işi kendi ekranında güncel kaynakla yeniden yapar.
  const KATEGORI_ADI = { hepsi: "Tümü", mevzuat: "Mevzuat ve kararlar", ictihat: "İçtihat", atif: "Atıf teyidi",
    claude: "Claude'a sorulanlar" };
  let gecmisSuzgec = { kategori: "hepsi", ekran: null, ara: "" };
  let gecmisAcik = null;   // açık kayıt: kalıcıda kimlik (metin), oturumda kayıt nesnesi
  let bekleyen = null;     // yeniden çalıştırma: hedef ekran formu doldurup kendisi gönderir

  function gecmisSifirla(suzgec = {}) {
    gecmisAcik = null;
    gecmisSuzgec = { kategori: "hepsi", ekran: null, ara: "", ...suzgec };
  }

  // Bir ekranın başlığındaki "Geçmiş": o ekranın işleri.
  function ekraninSuzgeci(id) {
    if (id === "mevzuat") return { kategori: mevzuatAktif === "teyit" ? "atif" : "mevzuat" };
    if (id === "ictihat") return { kategori: "ictihat" };
    if (["tapu", "beyin", "mask", "donna"].includes(id)) return { kategori: "claude", ekran: id };
    return {};
  }

  const ekranAdi = (id) => (EKRANLAR.find((e) => e.id === id) || {}).ad || "";
  const ekranSimgesi = (id) => (EKRANLAR.find((e) => e.id === id) || {}).simge || "liste";

  function gunEtiketi(iso) {
    const bugun = new Date();
    bugun.setHours(0, 0, 0, 0);
    const g = new Date(iso);
    g.setHours(0, 0, 0, 0);
    const fark = Math.round((bugun - g) / 86400000);
    if (fark === 0) return "Bugün";
    if (fark === 1) return "Dün";
    return g.toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });
  }

  // Oturum kaydı kalıcı kaydın biçimine çevrilir: liste ve ayrıntı tek biçimle çalışır.
  const oturumKaydi = (g) => ({ id: g.id || null, oturum: g, zaman: g.saat.toISOString(), ekran: g.ekran,
    kategori: g.kategori || "claude", tur: g.tur || "claude", baslik: g.soru, adimlar: g.adimlar,
    sorgu: g.sorgu ?? null, anlik: g.anlik ?? null });

  CIZIM.gecmis = (ekran) => {
    if (gecmisAcik) { gecmisAyrinti(ekran, gecmisAcik); return; }
    const depo = gecmisDeposu();
    const kalici = depo !== "pencere";
    const ORTAK = " Atıf teyidinde yapıştırdığınız metin değil, yalnız bulunan atıflar saklanır. UYAP işleri geçmişe yazılmaz.";
    ekran.append(ogesi("p", "kapsam-notu", {
      disk: "Bu bilgisayarda tutulur ve 90 gün sonra kendiliğinden silinir; hiçbir sunucuya gönderilmez. Yeni sohbette " +
        "ve ArthurLegal güncellendiğinde de durur." + ORTAK,
      cihaz: "Bu cihazda, masanın kendi deposunda tutulur ve 90 gün sonra kendiliğinden silinir; hiçbir sunucuya " +
        "gönderilmez. Yeni sohbette, Claude yeniden açıldığında ve ArthurLegal güncellendiğinde de durur; başka " +
        "cihazda görünmez." + ORTAK,
      pencere: "Bu pencerede tarayıcı deposu kapalı: geçmiş yalnız pencere açıkken durur ve hiçbir yere yazılmaz.",
    }[depo]));
    const seg = ogesi("div", "segment");
    for (const [id, yazi] of Object.entries(KATEGORI_ADI)) {
      const b = dugme(yazi);
      b.setAttribute("aria-pressed", String(gecmisSuzgec.kategori === id));
      b.onclick = () => { gecmisSuzgec = { ...gecmisSuzgec, kategori: id, ekran: null }; git("gecmis"); };
      seg.append(b);
    }
    const ara = girdi("search", "Başlıkta ara: kira, 6098, EPDK …", gecmisSuzgec.ara);
    const temizle = dugme(kalici ? "Geçmişi temizle" : "Listeyi temizle", { simge: "sil" });
    let emin = false;
    temizle.onclick = async () => {
      const yazi = temizle.querySelector("span");
      if (!emin) {
        emin = true;
        yazi.textContent = "Emin misiniz? Bir daha basın";
        setTimeout(() => { emin = false; yazi.textContent = kalici ? "Geçmişi temizle" : "Listeyi temizle"; }, 4000);
        return;
      }
      temizle.disabled = true;
      try {
        if (depo === "disk") {
          const { hata } = await cagir(app, "al_gecmis", { islem: "temizle" });
          if (hata) throw new Error(hata);
        }
        if (depo === "cihaz") localStorage.removeItem(CIHAZ_GECMISI);
        GECMIS.length = 0;
        ortam.duyuru.textContent = "Geçmiş temizlendi.";
      } catch (e) {
        ortam.duyuru.textContent = "Geçmiş temizlenemedi: " + (e.message || "bilinmeyen hata");
      }
      git("gecmis");
    };
    const ust = ogesi("div", "satir gecmis-ust");
    ust.append(alan("Ara", ara), temizle);
    ekran.append(seg, ust);
    if (gecmisSuzgec.ekran) {
      const not = ogesi("div", "eylemler sol");
      const kaldir = dugme(`Yalnız ${ekranAdi(gecmisSuzgec.ekran)} · süzgeci kaldır`, { sinif: "kucuk", simge: "carpi" });
      kaldir.onclick = () => { gecmisSuzgec = { ...gecmisSuzgec, ekran: null }; git("gecmis"); };
      not.append(kaldir);
      ekran.append(not);
    }
    const liste = ogesi("div", "kesit");
    ekran.append(liste);
    let zamanlayici = null;
    ara.oninput = () => {
      clearTimeout(zamanlayici);
      zamanlayici = setTimeout(() => { gecmisSuzgec.ara = ara.value; gecmisListesi(liste); }, 250);
    };
    gecmisListesi(liste);
  };

  async function gecmisListesi(kap) {
    kap.replaceChildren();
    const s = gecmisSuzgec;
    let kayitlar = [];
    const depo = gecmisDeposu();
    if (depo === "disk") {
      const adim = AL.adimlar(kap).ekle("Geçmiş okunuyor…");
      try {
        const arg = { islem: "listele", en_fazla: 300 };
        if (s.kategori !== "hepsi") arg.kategori = s.kategori;
        if (s.ara.trim()) arg.ara = s.ara.trim();
        const { veri, hata } = await cagir(app, "al_gecmis", arg);
        if (!veri) throw new Error(hata);
        kayitlar = veri.kayitlar || [];
      } catch {
        adim.hata("Geçmiş okunamadı.");
        return;
      }
      kap.replaceChildren();
    } else {
      // Diskteki aramayla aynı: başlıkta ve adımlarda geçen ifade.
      const q = s.ara.trim().toLocaleLowerCase("tr");
      const gecer = (k) => !q || [k.baslik, ...(k.adimlar || []).map((a) => a && a[1])]
        .some((x) => String(x || "").toLocaleLowerCase("tr").includes(q));
      kayitlar = (depo === "cihaz" ? cihazGecmisi() : GECMIS.map(oturumKaydi))
        .filter((k) => (s.kategori === "hepsi" || k.kategori === s.kategori) && gecer(k));
    }
    if (s.ekran) kayitlar = kayitlar.filter((k) => k.ekran === s.ekran);
    if (!kayitlar.length) {
      kap.append(ogesi("div", "bos", s.ara.trim() || s.kategori !== "hepsi" || s.ekran
        ? "Bu süzgeçle kayıt yok."
        : "Henüz geçmiş yok. Masada bir arama yaptığınızda burada o günkü sonucuyla birikir."));
      return;
    }
    let gun = "";
    let grup = null;
    for (const k of kayitlar) {
      const g = gunEtiketi(k.zaman);
      if (g !== gun) {
        gun = g;
        grup = ogesi("div", "liste");
        kap.append(ogesi("div", "gecmis-gun", g), grup);
      }
      const b = ogesi("button", "liste-ogesi");
      b.type = "button";
      const sim = ogesi("span", "simge");
      sim.append(ikon(ekranSimgesi(k.ekran)));
      const m = ogesi("span", "metinler");
      const son = (k.adimlar || []).slice(-1)[0];
      m.append(ogesi("span", "ad", k.baslik), ogesi("span", "ne", [KATEGORI_ADI[k.kategori], son && son[1]].filter(Boolean).join(" · ")));
      b.append(sim, m, ogesi("span", "sayi", new Date(k.zaman).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })));
      b.onclick = () => { gecmisAcik = k.oturum || depo === "cihaz" ? k : k.id; git("gecmis"); };
      grup.append(b);
    }
  }

  async function gecmisAyrinti(ekran, ref) {
    const geri = dugme("Geçmişe dön", { simge: "geri" });
    geri.onclick = () => { gecmisAcik = null; git("gecmis"); };
    const ust = ogesi("div", "eylemler sol");
    ust.append(geri);
    ekran.append(ust);
    let k = ref;
    if (typeof ref === "string") {
      const bekle = ogesi("div", "kesit");
      ekran.append(bekle);
      const adim = AL.adimlar(bekle).ekle("Kayıt açılıyor…");
      try {
        const { veri, hata } = await cagir(app, "al_gecmis", { islem: "getir", id: ref });
        if (!veri) throw new Error(hata);
        k = veri.kayit;
      } catch (e) {
        adim.hata(e.message || "Kayıt açılamadı.");
        return;
      }
      if (aktif !== "gecmis" || gecmisAcik !== ref) return;   // bu arada başka ekrana geçildi
      bekle.remove();
    }
    const kart = ogesi("div", "sonuc-kabi");
    const bas = ogesi("div", "sonuc-ust");
    const bk = ogesi("div", "sonuc-baslik");
    bk.append(ogesi("h2", null, k.baslik), ogesi("div", "kunye",
      [KATEGORI_ADI[k.kategori], ekranAdi(k.ekran) !== KATEGORI_ADI[k.kategori] && ekranAdi(k.ekran), AL.zaman(k.zaman)]
        .filter(Boolean).join(" · ")));
    const ey = ogesi("div", "eylemler");
    const yeniden = yenidenDugmesi(k);
    if (yeniden) ey.append(yeniden);
    const sil = dugme("Sil", { simge: "sil" });
    sil.onclick = async () => {
      sil.disabled = true;
      try {
        if (k.id && gecmisKalici()) {
          const { hata } = await cagir(app, "al_gecmis", { islem: "sil", id: k.id });
          if (hata) throw new Error(hata);
        } else if (k.id) {
          const kalan = cihazGecmisi();
          if (kalan && !cihazaYaz(kalan.filter((x) => x.id !== k.id))) throw new Error("depoya yazılamadı");
        }
        const i = GECMIS.findIndex((g) => g === k.oturum || (k.id && g.id === k.id));
        if (i >= 0) GECMIS.splice(i, 1);
        gecmisAcik = null;
        ortam.duyuru.textContent = "Kayıt silindi.";
        git("gecmis");
      } catch (e) {
        sil.disabled = false;
        ortam.duyuru.textContent = "Kayıt silinemedi: " + (e.message || "bilinmeyen hata");
      }
    };
    ey.append(sil);
    bas.append(bk, ey);
    const ad = ogesi("div", "adimlar");
    for (const [tur, metin] of k.adimlar || []) ad.append(adimSatiri(tur, metin));
    kart.append(bas, ad);
    const icerik = ogesi("div", "kesit");
    if (k.tur === "cevap") {
      icerik.append(bilgi(`Bu cevap ${AL.zaman(k.zaman)} tarihinde yazıldı; kaynaklar o günden sonra değişmiş olabilir. Güncel hali için “Claude'a yeniden sor”.`));
    } else if (k.tur !== "claude") {
      icerik.append(bilgi(`Bu, ${AL.zaman(k.zaman)} tarihindeki sonuçtur; kaynak o günden sonra değişmiş olabilir. Güncel hali için “Yeniden çalıştır”.`));
    }
    anlikCiz(icerik, k);
    ekran.append(kart, icerik);
    bildir(`kullanıcı geçmişte "${k.baslik}" kaydını (${AL.zaman(k.zaman)}) açtı.`);
  }

  // Kaydın o günkü sonucu, ekranların kendi çizicileriyle (düğmeler canlı kaynağa gider).
  function anlikCiz(kap, k) {
    const a = k.anlik;
    if (k.tur === "claude") {
      kap.append(ogesi("div", "balon gecmis-metin", k.sorgu && k.sorgu.metin ? k.sorgu.metin
        : "Mesajın metni saklanmadı (taslağınızdan cümle taşıyordu); yalnız başlığı tutuldu."));
      kap.append(bilgi("Claude'un cevabı masaya geldiyse Geçmiş'te ayrı bir kayıt olarak durur."));
      return;
    }
    if (k.tur === "cevap" && a) {
      const kok = ogesi("div", "cevap-kok");
      cevapIcerik(kok, cevapKaydindan(k), { soruYok: true, adimYok: true });
      kap.append(kok);
      return;
    }
    if (!a) {
      kap.append(bilgi(k.anlik_kesildi ? "Sonuç çok büyük olduğu için saklanmadı; güncel hali için yeniden çalıştırın."
        : "Bu kayıtta sonuç saklanmamış; güncel hali için yeniden çalıştırın."));
      return;
    }
    const s = ogesi("div", "sonuc-kabi");
    if (k.tur === "mevzuat-liste") {
      if (a.metinde) s.append(ogesi("div", "kunye", "Metninde arandı; liste Resmî Gazete tarihine göre, ilgiye göre değil."));
      for (const m of a.liste || []) s.append(mevzuatSatiri(m));
    } else if (k.tur === "kurum") {
      s.append(ogesi("div", "kunye", [a.istek && `İstek: ${a.istek}`, a.kanal === "arşiv" ? "ArthurLegal arşivi" : "resmî liste"].filter(Boolean).join(" · ")));
      for (const v of a.liste || []) s.append(kararSatiri(v));
    } else if (k.tur === "madde" && a.veri) {
      s.append(KART.madde(a.veri, ortam));
    } else if (k.tur === "ictihat" && a.veri) {
      s.append(KART.ictihat(a.veri, ortam));
    } else if (k.tur === "atif") {
      const ust = ogesi("div", "sonuc-ust");
      const bk = ogesi("div", "sonuc-baslik");
      bk.append(ogesi("h2", null, "Atıf teyidi"), ogesi("div", "kunye", `${a.toplam || 0} atıf · ${a.dogru || 0} doğrulandı`));
      ust.append(bk, KART.durumRozeti(a.dogru || 0, a.toplam || 0));
      const t = ogesi("div", "teyit");
      for (const r of a.satirlar || []) t.append(teyitSatiri(r));
      s.append(ust, t);
    }
    if (s.childElementCount <= (k.tur === "mevzuat-liste" || k.tur === "kurum" ? 1 : 0) && !(a.liste || []).length && k.tur !== "atif") {
      s.append(ogesi("div", "bos", "Bu aramada sonuç yoktu."));
    }
    kap.append(s);
  }

  function yenidenDugmesi(k) {
    const s = k.sorgu;
    if (!s) return null;
    const claude = k.tur === "claude" || k.tur === "cevap";
    const etiket = k.tur === "cevap" ? "Claude'a yeniden sor" : claude ? "Claude'a yeniden gönder" : "Yeniden çalıştır";
    const b = dugme(etiket, { sinif: "birincil", simge: claude ? "sohbet" : "yenile" });
    b.onclick = () => {
      if (claude) { claudeaSor(s.metin, k.baslik); return; }
      if (k.tur === "atif") { atifYeniden(k, b); return; }
      gecmisAcik = null;
      if (k.tur === "mevzuat-liste" || k.tur === "kurum") {
        bekleyen = { sekme: "ara", q: s.q };
        mevzuatAktif = "ara";
        git("mevzuat");
      } else if (k.tur === "madde") {
        const h = s.hedef || {};
        mevzuatSecili = h.mevzuat_id ? { mevzuat_id: String(h.mevzuat_id), ad: h.ad, number: h.number, type: h.type } : null;
        bekleyen = { sekme: "getir", kanun: h.number || h.ad || "", maddeler: s.maddeler || [] };
        mevzuatAktif = "getir";
        git("mevzuat");
      } else if (k.tur === "ictihat") {
        bekleyen = { ekran: "ictihat", ...s };
        git("ictihat");
      }
    };
    return b;
  }

  // Atıf teyidi yeniden: taslak saklanmadığı için atıflar (kanun + madde) burada, kaydın altında yeniden doğrulanır.
  async function atifYeniden(k, dugmeEl) {
    const atiflar = ((k.sorgu && k.sorgu.atiflar) || []).map((a) => ({ kanun: String(a.kanun), madde: String(a.madde) }));
    if (!atiflar.length) return;
    dugmeEl.disabled = true;
    const kesit = ogesi("div", "kesit");
    kesit.append(ogesi("h3", null, "Güncel teyit"));
    $("ekran").append(kesit);
    const { tablo, satirlar, dogru } = await atiflariDogrula(atiflar, AL.adimlar(kesit));
    kesit.append(tablo);
    dugmeEl.disabled = false;
    gecmiseEkle(`Atıf teyidi (${atiflar.length} atıf, yeniden)`, [["tamam", `${atiflar.length} atıf`],
      [dogru === atiflar.length ? "tamam" : "uyar", `${dogru} doğrulandı`]],
    { ekran: "mevzuat", kategori: "atif", tur: "atif", sorgu: { atiflar }, anlik: { satirlar, dogru, toplam: atiflar.length } });
    bildir(`geçmişteki atıf teyidi yeniden yapıldı: ${atiflar.length} atıftan ${sayiEki(dogru)} resmî metinde bulundu.`);
  }

  // ---- ArthurTapu ----
  // Tapu'nun 3D uyarısının masadaki kopyası (asıl yeri arthurlegal-mcp tkgm-mcp/tkgm_harita.py UYARI_3D).
  const UYARI_3D = "UYARI: Bu 3B görsel gerçek (ölçülmüş ya da resmî) veriye dayanmaz. Yapay zekâ ve otomatik " +
    "kurallarla üretilmiş bir TAHMİNDİR; yalnız fikir vermek amacıyla oluşturulmuştur. Ölçüm, imar durumu, ruhsat, " +
    "röleve ya da bilirkişi incelemesi yerine geçmez ve resmî işlemde kullanılamaz.";

  CIZIM.tapu = (ekran) => {
    const d = modulDurumu("tapu");
    // Tapu araçları bu uçta yoksa (Claude dizinindeki sürüm) form Claude'a yapamayacağı bir iş bırakmasın.
    if (d === "masaustu") {
      ekran.append(bilgi("ArthurTapu bu bağlantıda yok. Parsel sorgusu ArthurLegal kurulumunda ve ArthurLegal'in kendi bağlantısında çalışır."));
      return;
    }
    const form = ogesi("form", "form");
    const yer = girdi("text", "Kadıköy Caferağa 123 ada 45 parsel");
    const satir = ogesi("div", "satir");
    const sor1 = dugme("Claude ile sorgula", { sinif: "birincil", simge: "sohbet" });
    sor1.type = "submit";
    satir.append(alan("Yer ve ada/parsel", yer), sor1);
    form.append(satir, bilgi("Parsel bilgisi TKGM Parsel Sorgu'dan canlı gelir ve bilgi amaçlıdır; malik, şerh, beyan ve rehin içermez. Kroki aplikasyon krokisi yerine geçmez."));
    form.onsubmit = (e) => {
      e.preventDefault();
      const m = yer.value.trim();
      if (!m) return;
      claudeaSor(`ArthurLegal Tapu: ${m} parselini getir; parsel raporu ve kroki ile.`, `Parsel: ${m}`);
    };
    ekran.append(form);
    if (DURUM.ortam === "masaustu" && d === "hazir") {
      // Tahmini 3D yalnız bu bilgisayardaki Tapu'da: arazi ve çevre binaların tabanı oradan çekilir.
      const kat = girdi("number", "bilmiyorsanız boş");
      kat.min = "1";
      kat.max = "80";
      const uc = dugme("Tahmini 3D görünüm", { simge: "bina" });
      uc.onclick = () => {
        const m = yer.value.trim();
        if (!m) { yer.focus(); ortam.duyuru.textContent = "Önce yer ve ada/parseli yazın."; return; }
        const k = Number.parseInt(kat.value, 10);
        claudeaSor(`ArthurLegal Tapu: ${m} parselini getir ve arazi_3d ile çevre binalarla tahmini 3D görünümünü üret` +
          (k >= 1 && k <= 80 ? `; parseldeki bina ${k} katlı` : "; kat sayısını söylemedim, parseldeki bina için kat uydurma") +
          ". Araç çıktısındaki uyari_3d metnini aynen ilet; arayuzde_ac bağlantısı varsa onu ver.", `Tahmini 3D: ${m}`);
      };
      const ac = dugme("Tapu arayüzünü aç", { simge: "dis" });
      ac.onclick = () => modulAc("tapu", ac);
      const s3 = ogesi("div", "satir");
      s3.append(alan("Parseldeki binanın kat sayısı (isteğe bağlı)", kat, "alan dar"), uc, ac);
      ekran.append(s3, bilgi(UYARI_3D));
    } else if (d === "kurulu-degil") {
      kuruluDegil(ekran, "ArthurLegal Tapu");
    }
  };

  // ---- Beyin ----
  CIZIM.beyin = (ekran) => {
    const d = modulDurumu("beyin");
    if (d === "masaustu") return masaustuTanitimi(ekran, "beyin");
    if (d === "kurulu-degil") return kuruluDegil(ekran, "ArthurLegal Hafıza");
    const form = ogesi("form", "form");
    const q = girdi("text", "kira tespiti davası tercihlerim");
    const satir = ogesi("div", "satir");
    const ara = dugme("Hafızada ara", { sinif: "birincil", simge: "arama" });
    ara.type = "submit";
    satir.append(alan("Ne arıyorsunuz?", q), ara);
    form.append(satir);
    form.onsubmit = (e) => {
      e.preventDefault();
      if (q.value.trim()) claudeaSor(`ArthurLegal Hafıza'da ara ve bulduklarını kaynak notlarıyla göster: ${q.value.trim()}`, `Hafıza: ${q.value.trim()}`);
    };
    const izgara = ogesi("div", "izgara");
    for (const [s, b, n, m] of [
      ["beyin", "Son oturum kartım", "En son nerede kalmıştık?", "ArthurLegal Hafıza'dan son oturum kartımı ve açık işleri göster."],
      ["onay", "Bu oturumu kaydet", "Ne yapıldı, ne kaldı, sonraki adım.", "Bu oturumun kartını ArthurLegal Hafıza'ya yaz: ne yapıldı, neden, açık kalan, sonraki adım. Yazmadan önce bana göster."],
      ["kitap", "Tercihlerim", "Üslup ve düzeltmeleriniz.", "ArthurLegal Hafıza'daki tercihlerimi ve düzeltmelerimi listele."],
    ]) {
      const k = ogesi("button", "eylem-karti");
      k.type = "button";
      const sim = ogesi("span", "simge");
      sim.append(ikon(s));
      k.append(sim, ogesi("b", null, b), ogesi("span", "ne", n));
      k.onclick = () => claudeaSor(m, b);
      izgara.append(k);
    }
    ekran.append(form, izgara, bilgi("Hafıza bu bilgisayardaki kasada durur; kişisel veri kapısı açıkken Claude'a yalnız istediğiniz not gider."));
  };

  // ---- ArthurMask ----
  CIZIM.mask = (ekran) => {
    const d = modulDurumu("mask");
    if (d === "masaustu") return masaustuTanitimi(ekran, "mask");
    if (d === "kurulu-degil") return kuruluDegil(ekran, "ArthurMask");
    const satir = ogesi("div", "satir");
    const ac = dugme("ArthurMask'i aç", { sinif: "birincil", simge: "dis" });
    ac.onclick = () => modulAc("mask", ac);
    const liste = dugme("Hazır belgeleri getir", { simge: "sohbet" });
    liste.onclick = () => claudeaSor("ArthurMask'te incelemesi tamamlanmış maskeli belgeleri listele.", "ArthurMask: hazır belgeler");
    satir.append(ac, liste);
    ekran.append(satir, bilgi("Belgeyi ArthurMask'e bırakın; adlar ve numaralar bu bilgisayarda etiketlenir ({{KİŞİ-01}} gibi). Claude yalnız maskeli metni görür, gerçek değerler bilgisayarınızda geri yazılır."));
  };

  // ---- UYAP Dashboard ----
  // Masa UYAP verisini göstermez: gerçek değerler yalnız Dashboard penceresinde açılır. Burada durum (saatler,
  // sayılar) ve ne yapılacağı durur; durum köprünün yazdığı özetten gelir (moduller.uyap.ozet).
  const UYAP_ADIMLARI = [
    ["dis", "1. Dashboard'u açın", "Masaüstündeki simgeyle ya da aşağıdaki düğmeyle."],
    ["bina", "2. Avukat Portal'a girin", "Dashboard tarayıcıyı kendisi açar; e-imza ya da e-Devlet ile siz girersiniz."],
    ["kitap", "3. Listeleri açın, Tara'ya basın", "UYAP'ta Tebligatlar ve Duruşmalarım ekranını açın; Dashboard açtığınız listeyi maskeleyerek okur."],
  ];
  const UYAP_LISTELERI = { tebligatlar: "Tebligatlar", durusma_takvimi: "Duruşmalar", dosya_listesi: "Dosyalar" };

  function uyapDurumu(kok, o) {
    kok.replaceChildren();
    const adimlar = AL.adimlar(kok);
    if (!o || !o.son_islem) {
      adimlar.ekle("").uyar("Henüz tarama yok. Dashboard'u açıp UYAP'a girin, sonra Tara'ya basın.");
    } else {
      const yazi = `Son işlem ${String(o.son_islem).slice(11, 16)}${o.kaynak ? " · " + o.kaynak : ""}`;
      const a = adimlar.ekle("");
      if (o.sonuc === "tamam") a.tamam(yazi + " · tamamlandı");
      else (o.sonuc === "hazir_degil" ? a.uyar : a.hata)(`${yazi} · ${o.mesaj || "tamamlanamadı"} Dashboard'da Tekrar dene'ye basın.`);
    }
    const g = (o && o.gorulen) || {};
    const gorulen = Object.keys(UYAP_LISTELERI).filter((t) => g[t]).map((t) => `${UYAP_LISTELERI[t]} ${g[t]}`);
    if (gorulen.length) adimlar.ekle("").tamam("UYAP'ta görülen listeler: " + gorulen.join(" · "));
    if (o && o.bugun_istek != null) {
      const yazi = `Bugün UYAP'a giden yenileme isteği: ${o.bugun_istek}/${o.gunluk_sinir || 200}`;
      const a = adimlar.ekle("");
      if (o.durduruldu) a.hata(yazi + " · UYAP erişimi reddetti; bugün yenileme yapılmaz, listeleri UYAP'ta açmaya devam edebilirsiniz.");
      else if (o.bekleme_kalan_sn) a.uyar(`${yazi} · UYAP yoğun: ${Math.ceil(o.bekleme_kalan_sn / 60)} dk yenileme yok.`);
      else a.tamam(yazi);
    }
  }

  CIZIM.uyap = (ekran) => {
    const d = modulDurumu("uyap");
    if (d === "masaustu") return masaustuTanitimi(ekran, "uyap");
    if (d === "kurulu-degil") {
      ekran.append(bilgi("UYAP Dashboard bu kurulumda açık değil. Windows'ta Hukuk Bürosu ya da Kurumsal paketiyle birlikte ArthurMask seçilince kendiliğinden gelir: ArthurLegal kurulumunu yeniden çalıştırıp modül ekranında işaretleyin."));
      return;
    }
    const satir = ogesi("div", "satir");
    const ac = dugme("UYAP Dashboard'u aç", { sinif: "birincil", simge: "dis" });
    ac.onclick = () => modulAc("uyap", ac);
    const yenile = dugme("Durumu yenile", { simge: "otomatik" });
    satir.append(ac, yenile);
    const izgara = ogesi("div", "izgara");
    for (const [s, b, n] of UYAP_ADIMLARI) {
      const k = ogesi("div", "eylem-karti");
      const sim = ogesi("span", "simge");
      sim.append(ikon(s));
      k.append(sim, ogesi("b", null, b), ogesi("span", "ne", n));
      izgara.append(k);
    }
    const durum = ogesi("div", "kesit");
    uyapDurumu(durum, (DURUM.moduller.uyap || {}).ozet);
    yenile.onclick = async () => {
      yenile.disabled = true;
      try {
        const { veri } = await cagir(app, "al_masasi", { bolum: "uyap" });
        if (veri && veri.moduller) DURUM.moduller = veri.moduller;
        uyapDurumu(durum, (DURUM.moduller.uyap || {}).ozet);
      } catch { /* durum eskisiyle kalır */ } finally {
        yenile.disabled = false;
      }
    };
    ekran.append(satir, izgara, durum,
      bilgi("Salt okunur: UYAP'a hiçbir şey yazılmaz. Dashboard UYAP'a ek istek göndermez, sizin açtığınız listeyi okur; yenilemede iki istek arası en az 2 sn, günde en çok 200 istek, 10 dakika içinde aynı liste yeniden istenmez. Ad ve numaralar yalnız Dashboard penceresinde görünür, Claude etiketli hâlini görür."));
  };

  // ---- Donna ----
  const DONNA = "Donna olarak cevap ver: ArthurLegal'in yönetici asistanısın; kısa, sıcak ve net yaz. " +
    "Bağlı uygulamalarımı (e-posta, takvim, Slack, görev uygulaması) yalnız gerekeni okumak için kullan. " +
    "Bir şey göndermeden, oluşturmadan ya da silmeden önce bana göster ve onay iste. " +
    "Hukuki süre hesaplama; tarih ve saatleri benim verdiğim gibi kullan. ";

  CIZIM.donna = (ekran) => {
    const ust = ogesi("div", "donna-ust");
    const metin = ogesi("div", "metinler");
    metin.append(ogesi("h2", null, "Merhaba, ben Donna."),
      ogesi("p", "alt-yazi", "E-postanızı, takviminizi ve görevlerinizi birlikte gözden geçirir; unutulmaması gerekeni hatırlatırım."));
    ust.append(sablon("t-donna"), metin);
    ekran.append(ust);

    const izgara = ogesi("div", "izgara");
    for (const [s, b, n, m] of [
      ["zil", "Bugünümü özetle", "Toplantılar, bekleyen e-postalar, görevler.", "Bugünümü özetle: takvimdeki toplantılar, yanıt bekleyen önemli e-postalar ve bugün biten görevler."],
      ["kitap", "Bu haftayı planla", "Öncelik sırasıyla bir plan.", "Bu haftayı planla: takvim, görevler ve bekleyen yazışmalara göre öncelik sıralı kısa bir plan çıkar."],
      ["sohbet", "Yanıt bekleyenler", "Geciken e-posta ve mesajlar.", "Üç günden uzun süredir yanıt bekleyen e-posta ve Slack mesajlarını listele; her biri için tek cümlelik öneri ver."],
    ]) {
      const k = ogesi("button", "eylem-karti");
      k.type = "button";
      const sim = ogesi("span", "simge");
      sim.append(ikon(s));
      k.append(sim, ogesi("b", null, b), ogesi("span", "ne", n));
      k.onclick = () => claudeaSor(DONNA + m, `Donna: ${b}`);
      izgara.append(k);
    }
    ekran.append(izgara);

    const form = ogesi("form", "form");
    const ne = girdi("text", "Cuma 10:00 · bilirkişi raporuna itiraz dilekçesini gözden geçir");
    const satir = ogesi("div", "satir");
    const hat = dugme("Hatırlat", { sinif: "birincil", simge: "zil" });
    hat.type = "submit";
    satir.append(alan("Neyi, ne zaman hatırlatayım?", ne), hat);
    form.append(satir);
    form.onsubmit = (e) => {
      e.preventDefault();
      const m = ne.value.trim();
      if (!m) return;
      claudeaSor(DONNA + `Şunu takvimime ya da görev uygulamama hatırlatma olarak ekle; eklemeden önce bana göster: ${m}`, `Donna: hatırlatma · ${m}`);
      ne.value = "";
    };
    ekran.append(form);

    // Bağlantılar: MCP'ler ekranıyla aynı liste (Claude'un bildirdiği bağlayıcılar). Bağlı olana düğme konmaz; durum
    // bilinmiyorsa masa tahmin etmez, Claude'dan ister.
    const b = DURUM.baglayicilar;
    const kesit = ogesi("div", "kesit");
    kesit.append(ogesi("h3", null, "Bağlantılar"));
    const liste = ogesi("div", "liste");
    for (const [simge, oneri, desen, acik] of DONNA_UYGULAMALARI) {
      const eslesen = b ? b.liste.filter((x) => !AL_SUNUCUSU.test(x.ad.toLowerCase()) && desen.test(x.ad.toLowerCase())) : [];
      const bagli = eslesen.filter((x) => x.durum === "bagli");
      if (!b) liste.append(sunucuSatiri(simge, oneri, acik, ["Durum bilinmiyor", ""]));
      else if (bagli.length) liste.append(sunucuSatiri(simge, bagli.map((x) => x.ad).join(", "), acik, BAGLAYICI_DURUMU.bagli));
      else if (eslesen.length) {
        const x = eslesen[0];
        liste.append(sunucuSatiri(simge, x.ad, "Claude'un hesabında, bu sohbette çalışmıyor", BAGLAYICI_DURUMU[x.durum], baglaDugmesi(x.ad)));
      } else liste.append(sunucuSatiri(simge, oneri, acik, ["Bağlı değil", ""], baglaDugmesi(oneri)));
    }
    const iste = dugme(b ? "Listeyi Claude'dan yenile" : "Durumu Claude'dan öğren", { sinif: "kucuk", simge: "yenile" });
    iste.onclick = () => claudeaSor(listeIstegi("donna"), null);
    const mcp = dugme("MCP'ler ekranı", { sinif: "kucuk", simge: "fis" });
    mcp.onclick = () => git("mcp");
    const alt = ogesi("div", "alt-satir");
    const ey = ogesi("div", "eylemler");
    ey.append(iste, mcp);
    alt.append(ogesi("span", "zaman", b ? `Claude'un bildirdiği liste · ${AL.zaman(b.zaman)}` : "Durum Claude'dan gelir"), ey);
    kesit.append(liste, alt, bilgi("Bağlantıları Claude hesabınızda bir kez kurarsınız; telefonda da çalışır. Donna onları yalnız siz istediğinizde, sohbet üzerinden kullanır ve her değişiklikten önce onay ister."));
    ekran.append(kesit);
  };

  // ---- MCP'ler ----
  // Araçlar değil, sunucular ve durumları. ArthurLegal'in kendi uçlarının durumu sunucudan gelir; Claude bağlayıcıları
  // (Gmail, Slack ...) yalnız Claude'un bildirdiği listeden: ev sahibi bu listeyi masaya vermez, masa kendisi göremez.
  const BAGLAYICI_KAYDI = "al.masa.baglayicilar";
  const AL_SUNUCUSU = /arthur|^al[\s_-]/;   // ArthurLegal'in kendi sunucuları kendi bölümünde
  const BAGLAYICI_SIMGESI = [[/mail|posta|outlook/, "posta"], [/calendar|takvim/, "takvim"], [/slack|teams|chat/, "sohbet"],
    [/drive|notion|docs|box|dropbox|sharepoint|confluence/, "kitap"]];
  const BAGLAYICI_DURUMU = { bagli: ["Bağlı", "nane"], "giris-gerekli": ["Giriş gerekli", "amber"], hata: ["Hata", "kirmizi"] };
  const MODUL_DURUMU = { hazir: ["Çalışıyor", "nane"], claude: ["Claude üzerinden", "mavi"], masaustu: ["Masaüstünde", ""],
    "kurulu-degil": ["Kurulu değil", ""] };
  // Donna'nın kullandığı uygulamalar: önerilen ad, Claude'un bildirdiği adla eşleşme, ne için.
  const DONNA_UYGULAMALARI = [
    ["posta", "Gmail", /gmail|outlook|e-?posta|mail/, "Yanıt bekleyenler ve önemli yazışmalar"],
    ["takvim", "Google Takvim", /calendar|takvim/, "Toplantılar, duruşma ve randevu notları"],
    ["sohbet", "Slack", /slack|teams/, "Ekipten gelen istekler"],
    ["onay", "Görev uygulaması", /notion|todoist|asana|trello|clickup|linear|tasks|görev/, "Todoist, Asana, Notion ya da kullandığınız uygulama"],
  ];
  function listeIstegi(bolum) {
    return "ArthurLegal Masası: bu sohbette bağlı MCP sunucularımı ve Claude bağlayıcılarımı masada göster. " +
      `al_masasi'yi bolum=${bolum} ile yeniden açın ve baglayicilar'a sunucu adlarını durumlarıyla yazın.`;
  }

  // Claude'un bildirdiği liste (al_masasi girdisi ya da sonucu). Aynı sunucunun bütün masa pencerelerinde ortaktır.
  function baglayicilariAl(liste) {
    const temiz = [];
    const gorulen = new Set();
    for (let o of liste) {
      if (typeof o === "string") o = { ad: o };
      if (!o || typeof o !== "object") continue;
      const ad = dizgi(o.ad).trim().slice(0, 80);
      if (!ad || gorulen.has(ad.toLowerCase())) continue;
      gorulen.add(ad.toLowerCase());
      temiz.push({ ad, durum: BAGLAYICI_DURUMU[o.durum] ? o.durum : "bagli" });
    }
    DURUM.baglayicilar = { liste: temiz.slice(0, 60), zaman: new Date().toISOString() };
    try { localStorage.setItem(BAGLAYICI_KAYDI, JSON.stringify(DURUM.baglayicilar)); } catch { /* yalnız bu pencere */ }
  }
  try {
    const k = JSON.parse(localStorage.getItem(BAGLAYICI_KAYDI) || "null");
    if (k && Array.isArray(k.liste)) DURUM.baglayicilar = k;
  } catch { /* depolama kapalı */ }

  function sunucuSatiri(simge, ad, ne, [durum, renk], ...dugmeler) {
    const o = ogesi("div", "liste-ogesi sunucu");
    const sim = ogesi("span", "simge");
    sim.append(simge === "arma" ? sablon("t-arma") : ikon(simge));
    const mt = ogesi("div", "metinler");
    mt.append(ogesi("span", "ad", ad));
    if (ne) mt.append(ogesi("span", "ne", ne));
    o.append(sim, mt, ogesi("span", "rozet nokta" + (renk ? " " + renk : ""), durum), ...dugmeler);
    return o;
  }

  function baglaDugmesi(ad) {
    const b = dugme("Bağla", { sinif: "kucuk", simge: "bag", baslik: ad + " bağla" });
    b.onclick = () => baglantiAc(app, BAGLAYICILAR, ortam.duyuru);
    return b;
  }

  CIZIM.mcp = (ekran) => {
    const ust = ogesi("div", "satir");
    const yonet = dugme("Bağlayıcıları yönet", { sinif: "birincil", simge: "dis" });
    yonet.onclick = () => baglantiAc(app, BAGLAYICILAR, ortam.duyuru);
    const yenile = dugme("Durumu yenile", { simge: "yenile" });
    ust.append(yonet, yenile);

    // ArthurLegal: araştırma ucu (status) ve bu kurulumun modülleri (masa durumu).
    const al = ogesi("div", "kesit");
    al.append(ogesi("h3", null, "ArthurLegal"));
    const alListe = ogesi("div", "liste");
    const alNe = DURUM.ortam === "masaustu" ? "Bu bilgisayardaki ArthurLegal ve araştırma ucu" : "Araştırma ucu (web ve telefon)";
    let arastirma = sunucuSatiri("arma", "ArthurLegal araştırma", alNe, ["Yoklanıyor", ""]);
    alListe.append(arastirma);
    for (const [id, ad, ne] of [["tapu", "ArthurTapu", "Tapu ve kadastro"], ["uyap", "UYAP Dashboard", "Tebligat ve duruşmalar, salt okunur"],
      ["mask", "ArthurMask", "Belgeyi Claude'a gitmeden maskeler"], ["beyin", "Beyin", "ArthurLegal Hafıza"]]) {
      const d = modulDurumu(id);
      // Uzak masa yerel modülü çalıştıramaz, ama Claude bu sohbette kurulumu bildirdiyse modül bu bilgisayarda bağlıdır.
      const durum = d === "masaustu" && id !== "tapu" && yerelBagli() ? ["Bilgisayarda bağlı", "mavi"] : MODUL_DURUMU[d];
      alListe.append(sunucuSatiri(ekranSimgesi(id), ad, ne, durum || MODUL_DURUMU.hazir));
    }
    const alNot = ogesi("div");
    al.append(alListe, alNot);

    // Claude bağlayıcıları: Claude'un bildirdiği liste; önerilenlerden bağlı olmayanlar "Bağla" ile.
    const cb = ogesi("div", "kesit");
    cb.append(ogesi("h3", null, "Claude bağlayıcılarınız"));
    const b = DURUM.baglayicilar;
    const iste = dugme(b ? "Listeyi Claude'dan yenile" : "Listeyi Claude'dan iste", { sinif: "kucuk", simge: "yenile" });
    iste.onclick = () => claudeaSor(listeIstegi("mcp"), null);
    if (!b) {
      cb.append(ogesi("div", "bos", "Claude, bu sohbette hangi bağlayıcıların açık olduğunu masaya henüz bildirmedi. Masa bunu kendi başına göremez; listeyi Claude'dan isteyin."));
    } else {
      const liste = ogesi("div", "liste");
      const disari = b.liste.filter((x) => !AL_SUNUCUSU.test(x.ad.toLowerCase()));
      for (const x of disari) {
        const k = x.ad.toLowerCase();
        const simge = (BAGLAYICI_SIMGESI.find(([d]) => d.test(k)) || [null, "fis"])[1];
        liste.append(sunucuSatiri(simge, x.ad, x.durum === "bagli" ? "Bu sohbette açık" : "Claude'un hesabında, bu sohbette çalışmıyor",
          BAGLAYICI_DURUMU[x.durum], ...(x.durum === "bagli" ? [] : [baglaDugmesi(x.ad)])));
      }
      for (const [simge, ad, desen] of DONNA_UYGULAMALARI) {
        if (!disari.some((x) => desen.test(x.ad.toLowerCase()))) {
          liste.append(sunucuSatiri(simge, ad, "Donna için önerilir", ["Bağlı değil", ""], baglaDugmesi(ad)));
        }
      }
      cb.append(liste);
    }
    const alt = ogesi("div", "alt-satir");
    const ey = ogesi("div", "eylemler");
    ey.append(iste);
    alt.append(ogesi("span", "zaman", b ? `Claude'un bildirdiği liste · ${AL.zaman(b.zaman)}` : "Liste Claude'dan gelir"), ey);
    cb.append(alt, bilgi("Bağlayıcıları Claude'da Customize › Connectors ekranında bir kez kurarsınız; telefonda da çalışır. Masa sunucuları ve durumlarını gösterir, araçlarını göstermez."));

    async function yukle() {
      yenile.disabled = true;
      alNot.replaceChildren();
      let yeni;
      try {
        const { veri, hata } = await cagir(app, "status", {});
        if (!veri) throw new Error(hata);
        const yuklu = veri.backends_loaded || [];
        const hatali = veri.backends_failed || [];
        DURUM.mcpSaglik = hatali.length ? "kirmizi" : "yesil";
        const ne = [alNe, veri.version && `sürüm ${veri.version}`].filter(Boolean).join(" · ");
        yeni = sunucuSatiri("arma", "ArthurLegal araştırma", ne,
          hatali.length ? [`${yuklu.length}/${yuklu.length + hatali.length} kaynak`, "amber"] : ["Çalışıyor", "nane"]);
        if (hatali.length) {
          alNot.append(bilgi(`Erişilemeyen kaynak: ${hatali.map((x) => x.label || x.prefix).join(", ")}. Bu kaynaklardan gelen “sonuç yok” cevabı “karar yok” demek değildir.`));
        }
        bildir(`MCP'ler ekranında: ArthurLegal araştırma ${hatali.length ? hatali.length + " kaynak erişilemiyor" : "çalışıyor"}.`);
      } catch {
        DURUM.mcpSaglik = "kirmizi";
        yeni = sunucuSatiri("arma", "ArthurLegal araştırma", alNe, ["Ulaşılamıyor", "kirmizi"]);
      } finally {
        yenile.disabled = false;
      }
      arastirma.replaceWith(yeni);
      arastirma = yeni;
      panelYenile();
    }
    yenile.onclick = yukle;
    ekran.append(ust, al, cb);
    yukle();
  };

  // ---------------------------------------------------------------- önizleme ve açılış
  function onizlemeCiz() {
    const kap = ogesi("div", "onizleme");
    const ust = ogesi("header", "kimlik");
    const marka = ogesi("span", "marka", "Arthur");
    marka.append(ogesi("span", null, "Legal"));
    const c = ROL && ROL !== "masa" ? gosterilenCevap() : null;
    ust.append(sablon("t-arma"), marka, Object.assign(ogesi("span", "ayrac"), { ariaHidden: "true" }), ogesi("span", "bolum", c ? "Sohbet" : "Masa"));
    const ac = dugme(c ? "Masada tam ekran aç" : "Masayı tam ekran aç", { sinif: "birincil", simge: "genislet" });
    ac.onclick = tamEkran;
    const sat = ogesi("div", "alt-satir");
    const ey = ogesi("div", "eylemler sol");
    ey.append(ac);
    sat.append(ey, ogesi("span", "zaman", `ArthurLegal ${DURUM.surum}`));
    if (c) {
      // Tam ekran olmayan ev sahibinde soru, adımlar ve cevap sohbetin içinde de okunur.
      const kok = ogesi("div", "cevap-kok");
      cevapIcerik(kok, c);
      kap.append(ust, kok, sat);
    } else {
      const mod = ogesi("div", "moduller");
      for (const e of EKRANLAR) {
        const d = modulDurumu(e.id);
        mod.append(ogesi("span", "rozet" + (d === "hazir" || d === "claude" ? " nane" : ""), e.ad));
      }
      kap.append(ust, ogesi("h2", null, "ArthurLegal Masası hazır"), mod, sat);
    }
    $("kok").replaceChildren(kap);
  }

  // Açılış ekranı: araç girdisi ya da sunucu bir bölüm istediyse o, istemediyse Sohbet. Son ekran hatırlanmaz:
  // kullanıcı masayı açınca doğrudan sohbete gelir (kullanıcı kararı, 02.11.2026).
  function acilisEkrani() {
    return DURUM.acilis;
  }

  let masaKuruldu = false;
  let acilisUygulandi = false;
  function ciz() {
    if (ROL === "adim" && !masaModu()) { kartModuCiz(); return; }
    document.body.classList.remove("kart-modu");
    const ctx = app.getHostContext() || {};
    const modlar = ctx.availableDisplayModes || [];
    const tam = ctx.displayMode === "fullscreen" || !modlar.includes("fullscreen");
    if (tam) {
      if (!masaKuruldu) { iskeletKur(); masaKuruldu = true; git(acilisEkrani()); acilisUygulandi = DURUM.hazir; }
      else panelYenile();
    } else {
      masaKuruldu = false;
      onizlemeCiz();
    }
  }

  async function tamEkran() {
    try {
      await app.requestDisplayMode({ mode: "fullscreen" });
    } catch {
      ortam.duyuru.textContent = "Tam ekran açılamadı; masa burada kullanılabilir.";
    }
  }

  // Bildirimler: girdi yazıldıkça (yalnız teslim), girdinin tamamı, iptal, en son sunucunun cevabı. Rol ilk bildirimde belli olur.
  app.ontoolinputpartial = ({ arguments: arg }) => { if (rolBelirle(arg) === "teslim") cevapAl(arg, false); };
  app.ontoolinput = ({ arguments: arg }) => {
    const rol = rolBelirle(arg);
    if (rol === "teslim") { if (arg) cevapAl(arg, true); return; }
    if (rol === "basla") {
      if (!baslaAlindi) { baslaAlindi = true; calismaBaslat(arg && arg.soru); DURUM.acilis = "sohbet"; cevapYenile(); }
      return;
    }
    if (rol === "adim") { adimBasladi(arg); return; }
    if (!arg) return;
    if (arg.bolum && EKRANLAR.some((e) => e.id === arg.bolum)) DURUM.acilis = arg.bolum;
    if (arg.tam_ekran === false) DURUM.tamEkranIste = false;
    if (Array.isArray(arg.baglayicilar)) baglayicilariAl(arg.baglayicilar);
  };
  app.ontoolcancelled = () => {
    if (ROL === "adim") { if (!ADIM) adimBasladi(null); ADIM.durum = "hata"; ADIM.ozet = "iptal edildi"; adimiYaz(); return; }
    if (CEVAP && !CEVAP.tamam) { CEVAP.kesildi = true; cevapYenile(); }
  };
  app.ontoolresult = (sonuc) => {
    const { veri, hata } = AL.veriAl(sonuc);
    const masaVerisi = !!(veri && typeof veri.surum === "string" && typeof veri.ortam === "string");
    if (!rolBelirle(null)) ROL = masaVerisi ? (veri.basla ? "basla" : veri.teslim ? "teslim" : "masa") : "adim";
    if (ROL === "teslim" && masaVerisi && veri.basla) {   // adı bilinmeyen ev sahibinde yalnız soru taşıyan girdi
      ROL = "basla";
      CEVAP = null;
    }
    if (ROL === "adim") { DURUM.hazir = true; adimBitti(sonuc, veri, hata); return; }
    if (ROL === "basla" && !baslaAlindi && masaVerisi && veri.basla) { baslaAlindi = true; calismaBaslat(veri.basla.soru); }
    if (masaVerisi) {
      DURUM.surum = veri.surum || DURUM.surum;
      DURUM.ortam = veri.ortam || DURUM.ortam;
      if (Array.isArray(veri.yetenekler)) DURUM.yetenekler = new Set(veri.yetenekler);
      DURUM.moduller = veri.moduller || {};
      if (veri.bolum && EKRANLAR.some((e) => e.id === veri.bolum)) DURUM.acilis = veri.bolum;
      if (Array.isArray(veri.baglayicilar)) baglayicilariAl(veri.baglayicilar);
      durumuSakla();
    }
    DURUM.hazir = true;
    // Ev sahibi baştan tam ekransa masa sunucunun cevabından önce, varsayımlarla kurulmuştur: istenen bölüm ve
    // modül durumları (yerel/uzak) şimdi uygulanır, açık ekran yeniden çizilir.
    if (masaKuruldu) { git(acilisUygulandi ? aktif : acilisEkrani()); acilisUygulandi = true; }
    else { ciz(); bildir(CEVAP ? "Sohbet ekranında, cevap açık." : "masa açıldı."); }   // yetenekler artık belli: not kuralla yinelenir
    cevapKaydet();   // teslim: geçmiş, sunucunun bildirdiği yerde (bu bilgisayar ya da oturum) tutulur
  };
  app.addEventListener("hostcontextchanged", (d) => {
    AL.tema.baglamdan(d);
    if (d && "displayMode" in d) ciz();
  });

  await app.connect();
  window.__alBagli = true;
  const ilkBaglam = app.getHostContext() || {};
  AL.tema.baglamdan(ilkBaglam);
  rolBelirle(null);
  if (ROL !== "masa") durumuYukle();   // adım, soru ve cevap pencereleri son bilinen masa durumuyla başlar; sonuç gelince güncellenir
  ciz();
  if (ROL !== "adim") bildir(CEVAP ? "Sohbet ekranında, cevap açık." : "masa açıldı.");
  // Adım penceresi tam ekranı yalnız masada bir çalışma sürüyorsa ister; masa açılmamış sohbette satır içinde kalır.
  if ((ROL === "adim" ? !!acikCalisma() : DURUM.tamEkranIste) && ilkBaglam.displayMode !== "fullscreen" && (ilkBaglam.availableDisplayModes || []).includes("fullscreen")) {
    tamEkran();
  }
</script>
</body>
</html>
