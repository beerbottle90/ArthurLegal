<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ArthurLegal Masası</title>
<!--
  AL Masası: ArthurLegal'in tek panelli yüzü (one app). al_masasi aracıyla açılır, Claude'da tam ekran
  çalışır. Sohbet Claude'undur (yazma kutusu altta); masa kaynakları getirir, doğrular, adımları
  gösterir ve modülleri tek panelden açar.

  Masa yalnız kendi sunucusunun araçlarını çağırabilir. Elinde aracı olmayan işi (tapu, hafıza,
  Donna'nın bağlı uygulamaları) Claude'a mesajla bırakır; Claude ilgili bağlayıcıyı kullanır.
  Ortak tasarım ve kod sunucuda gömülür (sunucu/al_arayuz.py).

  Sohbet kaydı masanın arkasında kalır ve masa onu okuyamaz. Claude soruyu al_masada_basla ile yazar, araştırır, cevabı
  al_masaya_yaz ile teslim eder. Bütün ArthurLegal araçları bu görünümü açar: tam ekran bölmesi en yeni pencereyi
  gösterir, pencereler çalışmayı tarayıcı deposunda paylaşır ve Sohbet ekranı soruyu, canlı adımları ve cevabı çizer.
  Masa açılmamış sohbette aynı görünüm kart (madde, içtihat) ya da tek satırlık adım şerididir.
-->
<style>
/*AL:CSS*/
html, body { min-height: 100%; }
body { background: var(--zemin); }

.masa {
  display: grid;
  grid-template-columns: 252px minmax(0, 1fr);
  min-height: 100vh;
  box-sizing: border-box;
  padding: var(--guvenli-ust) var(--guvenli-sag) var(--guvenli-alt) var(--guvenli-sol);
}

/* ---- Sol panel ---- */
.panel {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 16px 12px;
  border-right: 0.5px solid var(--cizgi);
  background: var(--zemin);
}
.panel-ust { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; }
.panel nav { display: flex; flex-direction: column; gap: 2px; }
.bolum-adi {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--soluk);
  padding: 14px 10px 6px;
}
.git {
  justify-content: flex-start;
  width: 100%;
  min-height: 38px;
  padding: 0 10px;
  gap: 10px;
  border-radius: 12px;
  background: transparent;
  color: var(--metin);
  font-weight: 500;
}
.git:hover { background: var(--dolgu); }
.git svg { color: var(--ikincil); }
.git[aria-current="page"] { background: var(--secili); }
.git[aria-current="page"] svg { color: var(--altin-metin); }
.git .donna { width: 20px; height: 20px; border-radius: 6px; box-shadow: none; }
.git .ek { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--soluk); white-space: nowrap; }
/* Uzun modül adı ("UYAP Dashboard" + "masaüstünde") iki satıra inerse sola yaslı kalır, ortalanmaz. */
.git > span:not(.ek):not(.nokta) { text-align: left; line-height: 1.25; min-width: 0; }
.git .nokta { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--soluk); }
.git .nokta.yesil { background: #3fa97c; }
.git .nokta.kirmizi { background: #e5533f; }
.panel-alt { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px 6px 0; }
.segment { display: flex; gap: 2px; padding: 3px; border-radius: var(--k-hap); background: var(--dolgu); }
.segment button { flex: 1; min-height: 30px; padding: 0 10px; font-size: 13px; background: transparent; }
/* Üç simgeli seçenek 252 px'lik panele sığsın; daha geniş bir yazı tipinde yazı taşmaz, kısalır. */
.tema-secimi button { flex: 1 1 auto; min-width: 0; padding: 0 4px; gap: 4px; font-size: 12.5px; }
.tema-secimi button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.segment button[aria-pressed="true"] { background: var(--yuzey); box-shadow: var(--golge); font-weight: 600; }
.surum { font-size: 12px; color: var(--soluk); padding: 0 6px; }

/* ---- İçerik ---- */
.icerik { display: flex; flex-direction: column; min-width: 0; }
.icerik-ust { display: flex; align-items: flex-start; gap: 12px; padding: 24px 32px 8px; }
.icerik-ust .metinler { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.icerik-ust h1 { font-size: 24px; }
.alt-yazi { margin: 0; color: var(--ikincil); font-size: 15px; max-width: 68ch; }
/* Altta Claude'un yazma kutusu durur: içerik onun altında kalmasın. */
#ekran { display: flex; flex-direction: column; gap: 16px; max-width: 940px; padding: 8px 32px 140px; }
.kesit { display: flex; flex-direction: column; gap: 10px; }
.kesit > h3 { color: var(--ikincil); font-size: 13px; font-weight: 600; }

.izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.eylem-karti {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 6px;
  min-height: 0;
  padding: 16px;
  text-align: left;
  border-radius: var(--k-grup);
  background: var(--yuzey);
  border: 0.5px solid var(--cizgi);
  box-shadow: var(--golge);
  font-weight: 400;
}
.eylem-karti:hover { background: var(--yuzey); border-color: var(--cizgi-guclu); }
.eylem-karti .simge {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--secili);
  color: var(--altin-metin);
  margin-bottom: 4px;
}
.eylem-karti .simge svg { width: 18px; height: 18px; }
.eylem-karti b { font-weight: 600; font-size: 15px; }
.eylem-karti .ne { font-size: 13px; color: var(--ikincil); }

.form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px;
  border-radius: var(--k-kart);
  background: var(--yuzey);
  border: 0.5px solid var(--cizgi);
  box-shadow: var(--golge);
}
.satir { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.alan { display: flex; flex-direction: column; gap: 5px; flex: 1 1 180px; min-width: 0; }
.alan.dar { flex: 0 1 140px; }
.alan label { font-size: 12px; font-weight: 600; color: var(--ikincil); }
.sonuc-kabi {
  padding: 16px;
  border-radius: var(--k-kart);
  background: var(--yuzey);
  border: 0.5px solid var(--cizgi);
  box-shadow: var(--golge);
}
.bilgi {
  display: flex;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--k-alan);
  background: var(--grup);
  color: var(--ikincil);
  font-size: 14px;
}
.bilgi svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--altin-metin); }

/* Oturum akışı: sohbet balonu + adımlar + kısa sonuç */
.akis { display: flex; flex-direction: column; gap: 14px; }
.akis-ogesi { display: flex; flex-direction: column; gap: 8px; }
.balon {
  align-self: flex-end;
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 18px 18px 6px 18px;
  background: var(--grup);
  font-size: 14px;
}
.bos {
  padding: 18px;
  border-radius: var(--k-grup);
  border: 0.5px dashed var(--cizgi-guclu);
  color: var(--ikincil);
  font-size: 14px;
}

/* Atıf teyidi tablosu */
.teyit { display: flex; flex-direction: column; gap: 6px; }
.teyit-satiri {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  padding: 10px 12px;
  border-radius: var(--k-alan);
  background: var(--grup);
}
.teyit-satiri .ne { font-weight: 600; white-space: nowrap; }
.teyit-satiri .baslik-k { flex: 1 1 200px; min-width: 0; color: var(--ikincil); font-size: 14px; }

/* Bağlantılar (Donna) ve kaynaklar (MCP'ler) */
.liste { display: flex; flex-direction: column; gap: 8px; }
.liste-ogesi {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--k-grup);
  background: var(--yuzey);
  border: 0.5px solid var(--cizgi);
}
.liste-ogesi .simge {
  width: 32px;
  height: 32px;
  flex: none;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--dolgu);
  color: var(--ikincil);
}
.liste-ogesi .simge svg { width: 18px; height: 18px; }
.liste-ogesi .metinler { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.liste-ogesi .ad { font-weight: 600; }
.liste-ogesi .ne { font-size: 13px; color: var(--ikincil); }
.liste-ogesi .sayi { font-size: 13px; color: var(--ikincil); font-variant-numeric: tabular-nums; white-space: nowrap; }
.donna-ust { display: flex; align-items: center; gap: 14px; }
.donna-ust .donna { width: 64px; height: 64px; border-radius: 18px; }

/* Sohbetteki önizleme (tam ekrana geçmeden önce) */
.onizleme {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 4px 4px 12px;
  padding: 16px;
  border-radius: var(--k-kart);
  background: var(--yuzey);
  border: 0.5px solid var(--cizgi);
  box-shadow: var(--golge);
}
.onizleme .moduller { display: flex; flex-wrap: wrap; gap: 6px; }

@media (max-width: 760px) {
  .masa { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .panel {
    flex-direction: row;
    align-items: center;
    gap: 6px;
    padding: 10px 12px;
    border-right: 0;
    border-bottom: 0.5px solid var(--cizgi);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .panel-ust { padding: 0 4px 0 0; }
  .panel-ust .marka, .bolum-adi, .surum, .git .ek, .git .nokta { display: none; }
  .panel nav { flex-direction: row; gap: 4px; }
  .git { width: auto; flex: none; white-space: nowrap; }
  .panel-alt { margin: 0; padding: 0; }
  .tema-secimi button { padding: 0 10px; }
  .tema-secimi button span { display: none; }
  .icerik-ust { padding: 16px 16px 6px; }
  .icerik-ust h1 { font-size: 20px; }
  #ekran { padding: 6px 16px 150px; }
}
/* Mevzuat: kapsam notu, madde ağacı, seçili mevzuat, aday listesi */
.kapsam-notu { margin: 0 0 12px; font-size: 13.5px; line-height: 1.45; color: var(--ikincil); }
/* Hesap kartları: tutar büyük, her kalemin dayanağı altında; açıklama ve teyit notları katlanır. */
.hesap-kutular { display: flex; flex-direction: column; gap: 12px; }
.hesap-kutular > .alan { flex: none; }
.hesap-sonuc { display: flex; flex-direction: column; gap: 12px; }
.hesap-toplam { display: flex; flex-direction: column; gap: 2px; }
.hesap-tutar { font-family: var(--yazi-baslik); font-size: 28px; font-weight: 700; letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums; }
.hesap-kalemler { display: flex; flex-direction: column; border-top: 0.5px solid var(--cizgi); }
.hesap-satir { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0;
  border-bottom: 0.5px solid var(--cizgi); font-size: 14px; }
.hesap-satir .tutar { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hesap-satir .dayanak { grid-column: 1 / -1; font-size: 12.5px; line-height: 1.4; color: var(--ikincil); }
.hesap-adimlar { margin: 0; padding-left: 20px; font-size: 13.5px; line-height: 1.5; color: var(--ikincil); }
.kucuk-not { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--ikincil); }
.hesap-katlanir summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ikincil); }
.hesap-katlanir ul { margin: 8px 0 0; padding-left: 20px; font-size: 13px; line-height: 1.5; color: var(--ikincil); }
/* Tazelik: kaynak ve son kontrol küçük satırda; yeni düzenleme kırmızı kutu (toplam gizli), denetlenemedi sarı kutu. */
.hesap-tazelik { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--ikincil); font-variant-numeric: tabular-nums; }
.uyari.kirmizi { background: var(--kirmizi-zemin); color: var(--kirmizi-metin); }
.tazelik-kutu { display: flex; flex-direction: column; gap: 8px; }
.tazelik-kutu p { margin: 0; }
.tazelik-kutu .eylemler { margin: 0; }
.onay-kutusu { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; min-height: 34px; }
.onay-kutusu input { width: 18px; height: 18px; margin: 0; accent-color: var(--birincil); }
.ornekler { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 10px; }
.ornekler .zaman { margin-right: 2px; }
@media (max-width: 520px) { .ornekler button:nth-of-type(n+3) { display: none; } }
/* .alan satırda yana esner (flex 1 1 180px); alt alta dizilen madde ağacında yükseklik olmasın */
.karar-metni > .alan { flex: none; }
.madde-listesi, .aday-listesi { display: flex; flex-direction: column; max-height: 320px; overflow: auto;
  border: 1px solid var(--cizgi); border-radius: 12px; background: var(--yuzey); }
.aday-listesi { max-height: none; margin-top: 4px; }
.madde-satiri { display: flex; align-items: baseline; gap: 12px; width: 100%; min-height: 0; padding: 9px 12px;
  border: 0; border-bottom: 1px solid var(--cizgi); border-radius: 0; background: transparent; color: var(--metin);
  font: inherit; font-size: 14px; text-align: left; cursor: pointer; box-shadow: none; }
.madde-satiri:last-child { border-bottom: 0; }
.madde-satiri:hover { background: var(--dolgu); }
.madde-satiri .no { flex: none; min-width: 64px; font-weight: 650; color: var(--altin-metin); font-variant-numeric: tabular-nums; }
.madde-satiri .ad { flex: 1; min-width: 0; }
.secili-mevzuat { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 6px 6px 12px;
  border: 1px solid var(--cizgi); border-radius: 12px; background: var(--yuzey); }
.secili-mevzuat .ad { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Geçmiş: başlıktaki bağlantı, gün başlıkları, tıklanır satırlar, kayıt ayrıntısı */
.icerik-ust .gecmis-bag { flex: none; margin-top: 2px; }
.gecmis-gun { margin: 8px 2px 0; color: var(--ikincil); font-size: 13px; font-weight: 600; }
button.liste-ogesi { width: 100%; min-height: 0; font: inherit; color: var(--metin); text-align: left; cursor: pointer;
  box-shadow: none; }
button.liste-ogesi:hover { background: var(--dolgu); }
.liste-ogesi .ad { overflow: hidden; text-overflow: ellipsis; }
.gecmis-ust { align-items: flex-end; }
.gecmis-ust .alan { flex: 1 1 240px; }
.gecmis-metin { white-space: pre-wrap; align-self: stretch; max-width: none; border-radius: 14px; }
/* Cevap: soru balonu, yapılanlar, Markdown gövde, atıf teyidi, kaynaklar, devam sorusu */
.cevap-kok { display: flex; flex-direction: column; gap: 14px; }
.cevap-govde { font-size: 15.5px; line-height: 1.6; overflow-wrap: anywhere; }
.yaziyor { display: inline-flex; align-items: center; gap: 8px; color: var(--soluk); font-size: 13px; }
.yaziyor::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--altin); animation: nabiz 1.2s ease-in-out infinite; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h3, .md h4, .md h5 { margin: 1.1em 0 0.4em; line-height: 1.3; }
.md h3 { font-size: 18px; }
.md h4 { font-size: 16px; }
.md h5 { font-size: 15px; color: var(--ikincil); }
.md p, .md ul, .md ol, .md blockquote, .md pre, .md .md-tablo { margin: 0 0 0.8em; }
.md ul, .md ol { padding-left: 1.4em; }
.md li { margin: 0.25em 0; }
.md li > ul, .md li > ol { margin: 0.25em 0 0; }
.md blockquote { padding: 2px 0 2px 14px; border-left: 3px solid var(--altin); color: var(--ikincil); }
.md code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.9em; padding: 1px 5px; border-radius: 6px; background: var(--dolgu); }
.md pre { padding: 12px 14px; border-radius: var(--k-alan); background: var(--grup); overflow-x: auto; }
.md pre code { padding: 0; background: none; }
.md a { color: var(--mavi-metin); text-decoration: underline; text-underline-offset: 2px; }
.md hr { border: 0; border-top: 0.5px solid var(--cizgi-guclu); margin: 1.2em 0; }
.md-tablo { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.md th, .md td { padding: 8px 10px; border-bottom: 0.5px solid var(--cizgi); text-align: left; vertical-align: top; }
.md th { font-weight: 600; background: var(--grup); }
.devam .satir { align-items: stretch; }
.devam textarea { resize: vertical; min-height: 44px; }
.devam .birincil { align-self: flex-end; }
/* MCP'ler: sunucu satırları (araç listesi yok) */
.sunucu .simge svg { width: 18px; height: 18px; }
.sunucu .simge .arma { width: 22px; height: 22px; }
.sunucu .rozet { flex: none; }
@media (prefers-reduced-motion: reduce) { .yaziyor::before { animation: none; } }
/* Çalışma adımları: kartlı adımın sonucu satırın altında açılır */
.son-is-ust { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.son-is-zaman { color: var(--soluk); font-size: 12px; white-space: nowrap; }
.adim .sonuc-ac { margin-left: auto; min-height: 24px; padding: 0 10px; font-size: 12px; flex: none; }
.adim-sonuc { margin: 6px 0 8px 24px; }
/* Masa açılmamış sohbette araç penceresi: kart ya da tek satırlık adım şeridi */
body.kart-modu { background: transparent; }
body.kart-modu #kok { padding: calc(var(--guvenli-ust) + 4px) calc(var(--guvenli-sag) + 4px)
  calc(var(--guvenli-alt) + 12px) calc(var(--guvenli-sol) + 4px); }
.serit .adim { font-size: 14px; }
</style>
</head>
<body>
<div id="kok">
  <div class="onizleme" aria-busy="true">
    <header class="kimlik">
      <!--AL:ARMA-->
      <span class="marka">Arthur<span>Legal</span></span>
      <span class="ayrac" aria-hidden="true"></span>
      <span class="bolum">Masa</span>
    </header>
    <div class="iskelet" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>
</div>
<div class="gizli" aria-live="polite" id="duyuru"></div>
<template id="t-arma"><!--AL:ARMA--></template>
<template id="t-donna"><!--AL:DONNA--></template>

<script>
  window.__alBagli = false;
  setTimeout(function () {
    if (window.__alBagli) return;
    var p = document.createElement("p");
    p.className = "aciklama";
    p.textContent = "Masa yüklenemedi. Claude Desktop'u güncelleyip tekrar deneyin; araştırma araçları sohbette çalışmaya devam eder.";
    var k = document.querySelector(".onizleme");
    if (k) { k.querySelector(".iskelet").replaceWith(p); k.removeAttribute("aria-busy"); }
  }, 12000);
</script>

<!-- Dışarıdan yüklenen tek betik, MCP Apps istemcisi: tarayıcı parmak izini denetler, tutmazsa yüklemez. -->

</script>

    moduller: {},

  };

  const EKRANLAR = [
    { id: "sohbet", ad: "Sohbet", simge: "sohbet", bolum: "Çalışma",
      baslik: "Sohbet", alt: "Sorunuzu aşağıdaki kutuya yazın ya da bir işle başlayın. Claude araştırır; cevabı, yaptığı adımlar, kaynaklar ve atıfların resmî metinden teyidiyle burada açılır." },
    { id: "mevzuat", ad: "Mevzuat ve kararlar", simge: "kitap", bolum: "Çalışma",
      baslik: "Mevzuat ve kurul kararları", alt: "İsteğinizi yazın: mevzuatın tamamı ve EPDK, SPK, Rekabet gibi kurumların kararları gelir. Maddeyi resmî metinden getirin, taslağınızdaki atıfları teyit edin." },
    { id: "ictihat", ad: "İçtihat", simge: "terazi", bolum: "Çalışma",
      baslik: "İçtihat", alt: "Yargıtay ve Danıştay kararlarını künyeleriyle bulun, metni kartın içinde açın." },
    { id: "hesap", ad: "Hesap kartları", simge: "hesap", bolum: "Çalışma",
      baslik: "Hesap kartları", alt: "Vekâlet ücreti, yargı harcı ve gider avansı. Hesabı kod yapar; her kalem dayanağı ve Resmî Gazete kaynağıyla gelir." },
    { id: "gecmis", ad: "Geçmiş", simge: "saat", bolum: "Çalışma",
      baslik: "Geçmiş", alt: "Masada yaptığınız aramalar, getirdiğiniz maddeler ve kararlar, o günkü sonuçlarıyla. Yeniden çalıştırınca güncel hali gelir." },
    { id: "tapu", ad: "ArthurTapu", simge: "harita", bolum: "Modüller",
      baslik: "ArthurTapu", alt: "Parseli il, ilçe, mahalle ve ada/parselle ya da yer adıyla sorgulayın; rapor ve kroki Claude'da gelir." },
    { id: "beyin", ad: "Beyin", simge: "beyin", bolum: "Modüller",
      baslik: "Beyin", alt: "ArthurLegal Hafıza: tercihleriniz, düzeltmeleriniz ve son oturum kartlarınız bu bilgisayarda." },
    { id: "mask", ad: "ArthurMask", simge: "maske", bolum: "Modüller",
      baslik: "ArthurMask", alt: "Müvekkil belgesi Claude'a gitmeden önce bu bilgisayarda maskelenir." },
    { id: "uyap", ad: "UYAP Dashboard", simge: "bina", bolum: "Modüller",
      baslik: "UYAP Dashboard", alt: "Tebligat ve duruşmalarınız, UYAP'ta açtığınız listelerden; salt okunur, gerçek değerler kendi penceresinde." },
    { id: "donna", ad: "Donna", donna: true, bolum: "Modüller",
      baslik: "Donna", alt: "İşlerinizi bağlı uygulamalarınızdan toplar, hatırlatır ve planlar." },
    { id: "mcp", ad: "MCP'ler", simge: "fis", bolum: "Bağlantılar",
      baslik: "MCP'ler", alt: "Bağlı sunucularınız ve durumları: ArthurLegal ve Claude bağlayıcılarınız (Gmail, Takvim, Slack …)." },
  ];

  // Modülün bu uçta kullanılabilirliği: hazir | claude (masa Claude'a bırakır) | masaustu | kurulu-degil
  function modulDurumu(id) {
    const m = DURUM.moduller[id];
    if (m && m.durum) return m.durum;
    if (["beyin", "mask", "uyap"].includes(id)) return DURUM.ortam === "masaustu" ? "kurulu-degil" : "masaustu";
    if (id === "tapu") return "claude";
    return "hazir";
  }
  const EK_YAZISI = { masaustu: "masaüstünde", "kurulu-degil": "kurulu değil" };

  function sablon(id) {
    return $(id).content.firstElementChild.cloneNode(true);
  }

  // Claude'a o an ekranda ne olduğunu söyler; kullanıcı "bunu açıkla" dediğinde Claude bilir. Ev sahibi notu bir sonraki
  // kullanıcı mesajıyla gönderir ve her not öncekinin yerini alır: masanın açık olduğu ve cevabın nereye yazılacağı her
  // notta yeniden söylenir (sohbet kaydı masanın arkasında kalır, kullanıcı cevabı ancak masada okur).
  // Teslim aracı olmayan uçta (Claude dizini profili) kural söylenmez; cevap orada sohbette kalır.
  const MASA_ACIK = "ArthurLegal Masası: ekranda açık.";
  const TESLIM_NOTU = " Her soruda: önce al_masada_basla ile soruyu masaya yazın, araştırın, cevabı al_masaya_yaz ile " +
    "teslim edin; sohbete yalnız 'Cevap masada.' yazın.";
  async function bildir(metin) {
    const not = MASA_ACIK + (DURUM.yetenekler.has("al_masaya_yaz") ? TESLIM_NOTU : "") + (metin ? " Şu an: " + metin : "");
    try { await app.updateModelContext({ content: [{ type: "text", text: not }] }); } catch { /* ev sahibi desteklemiyor */ }
  }

  // metinSaklanmaz: mesaj kullanıcının taslağından cümle taşıyorsa geçmişe yalnız başlığı yazılır.
  async function claudeaSor(metin, kayit, { metinSaklanmaz = false } = {}) {
    try {
      await sor(app, metin);
      if (kayit) gecmiseEkle(kayit, [["tamam", "Claude'a iletildi; cevap masaya gelir."]],
        { kategori: "claude", tur: "claude", sorgu: metinSaklanmaz ? null : { metin } });
      ortam.duyuru.textContent = "Mesaj Claude'a gönderildi.";
    } catch {
      ortam.duyuru.textContent = "Mesaj gönderilemedi; aynı metni aşağıdaki kutuya yazabilirsiniz.";
    }
  }

  // Geçmiş oturumdan ve ArthurLegal sürümünden bağımsızdır, 90 gün durur ve hiçbir sunucuya yazılmaz. Kalıcı depo:
  //  - disk: yerel AL sunucusu al_gecmis veriyorsa bu bilgisayarın diski (veri/masa-gecmisi, sürüm klasörünün dışında);
  //  - cihaz: yoksa (uzak bağlantı: Claude Desktop'taki uzak bağlayıcı, web, telefon) masanın bu cihazdaki tarayıcı
  //    deposu. Ev sahibi masa pencerelerine bağlantı başına sabit bir köken verir: depo yeni sohbette, Claude yeniden
  //    açılınca ve masa güncellenince de durur; başka cihazda görünmez;
  //  - pencere: depo kapalıysa (gizli pencere, yalıtılmış çerçeve) liste yalnız bu pencere açıkken (GECMIS).
  // Kayıt biçimi ikisinde aynıdır: { id, zaman, ekran, kategori, tur, baslik, adimlar, sorgu, anlik }.
  // kayit: { kategori, tur, sorgu, anlik, ekran? }. UYAP işleri hiçbir depoya yazılmaz.
  const gecmisKalici = () => DURUM.yetenekler.has("al_gecmis");
  const CIHAZ_GECMISI = "al.masa.gecmis";
  const GECMIS_GUN = 90;
  const CIHAZ_AZAMI = 300;           // kayıt
  const CIHAZ_SINIRI = 2000000;      // karakter: tarayıcı deposu köken başına ~5 MB, masanın öteki kayıtlarına yer kalır
  const ANLIK_SINIRI = 200000;       // tek kaydın o günkü sonucu; aşarsa kayıt sonuçsuz saklanır (disktekiyle aynı ilke)
  const GECMIS_KIMLIGI = /^\d{8}-\d{6}-[0-9a-f]{6}$/;
  const iki = (n) => String(n).padStart(2, "0");
  const zamanKimligi = (d) => `${d.getFullYear()}${iki(d.getMonth() + 1)}${iki(d.getDate())}-` +
    `${iki(d.getHours())}${iki(d.getMinutes())}${iki(d.getSeconds())}`;
  function gecmisKimligi(d) {
    const r = new Uint8Array(3);
    try { crypto.getRandomValues(r); } catch { r.forEach((_, i) => { r[i] = Math.floor(Math.random() * 256); }); }
    return zamanKimligi(d) + "-" + [...r].map((b) => b.toString(16).padStart(2, "0")).join("");
  }

  // Cihaz deposundaki kayıtlar, en yeni önce; süresi dolan ve bozuk kayıt atlanır. Depo kullanılamıyorsa null.
  function cihazGecmisi() {
    try {
      const d = JSON.parse(localStorage.getItem(CIHAZ_GECMISI) || "null");
      const sinir = zamanKimligi(new Date(Date.now() - GECMIS_GUN * 86400000));
      return (d && Array.isArray(d.kayitlar) ? d.kayitlar : [])
        .filter((k) => k && typeof k === "object" && GECMIS_KIMLIGI.test(String(k.id)) && k.id.slice(0, 15) >= sinir &&
          typeof k.baslik === "string");
    } catch { return null; }
  }

  // Sınırı aşan ya da depoya sığmayan en eski kayıtlar bırakılır.
  function cihazaYaz(kayitlar) {
    let liste = kayitlar.slice(0, CIHAZ_AZAMI);
    for (;;) {
      const metin = JSON.stringify({ surum: 1, kayitlar: liste });
      if (metin.length <= CIHAZ_SINIRI) {
        try { localStorage.setItem(CIHAZ_GECMISI, metin); return true; } catch { if (!liste.length) return false; }
      }
      liste = liste.slice(0, -1);
    }
  }

  const gecmisDeposu = () => (gecmisKalici() ? "disk" : cihazGecmisi() ? "cihaz" : "pencere");

  function gecmiseEkle(soru, adimlar, kayit = null) {
    const { ekran = aktif, ...geri } = kayit || {};
    const saat = new Date();
    const g = { soru, adimlar, saat, ekran, ...geri };
    GECMIS.unshift(g);
    if (GECMIS.length > 50) GECMIS.pop();
    if (!kayit || ekran === "uyap") return;
    if (gecmisKalici()) {
      cagir(app, "al_gecmis", { islem: "kaydet", kayit: { ekran, baslik: soru, adimlar, ...geri } })
        .then(({ veri }) => { if (veri && veri.id) g.id = veri.id; })
        .catch(() => { /* geçmiş yazılamadıysa iş yine ekranda */ });
      return;
    }
    const onceki = cihazGecmisi();
    if (!onceki) return;
    const tam = { id: gecmisKimligi(saat), zaman: saat.toISOString(), ekran, kategori: geri.kategori || "claude",
      tur: geri.tur || "claude", baslik: String(soru || "").slice(0, 300),
      adimlar: (adimlar || []).slice(0, 10).map(([t, m]) => [t, String(m || "").slice(0, 300)]),
      sorgu: geri.sorgu ?? null, anlik: geri.anlik ?? null };
    if (JSON.stringify(tam.anlik).length > ANLIK_SINIRI) { tam.anlik = null; tam.anlik_kesildi = true; }
    if (cihazaYaz([tam, ...onceki])) g.id = tam.id;
  }

  // ---------------------------------------------------------------- iskelet
  let aktif = "sohbet";

  function iskeletKur() {
    const masa = ogesi("div", "masa");
    const panel = ogesi("aside", "panel");
    const ust = ogesi("div", "panel-ust");
    const marka = ogesi("span", "marka", "Arthur");
    marka.append(ogesi("span", null, "Legal"));
    ust.append(sablon("t-arma"), marka);
    const nav = ogesi("nav");
    nav.setAttribute("aria-label", "ArthurLegal modülleri");
    let bolum = "";
    for (const e of EKRANLAR) {
      if (e.bolum !== bolum) { bolum = e.bolum; nav.append(ogesi("div", "bolum-adi", bolum)); }
      const b = ogesi("button", "git");
      b.type = "button";
      b.dataset.ekran = e.id;
      b.append(e.donna ? sablon("t-donna") : ikon(e.simge), ogesi("span", null, e.ad));
      b.onclick = () => { if (e.id === "gecmis") gecmisSifirla(); git(e.id); };
      nav.append(b);
    }
    const alt = ogesi("div", "panel-alt");
    const seg = ogesi("div", "segment tema-secimi");
    seg.setAttribute("role", "group");
    seg.setAttribute("aria-label", "Tema");
    for (const [deger, yazi, simge] of [["acik", "Açık", "gunes"], ["koyu", "Koyu", "ay"], ["otomatik", "Otomatik", "otomatik"]]) {
      const b = dugme(yazi, { simge, baslik: yazi + " tema" });
      b.dataset.tema = deger;
      b.onclick = () => AL.tema.sec(deger);
      seg.append(b);
    }
    alt.append(seg, ogesi("div", "surum", `ArthurLegal ${DURUM.surum}`));
    panel.append(ust, nav, alt);

    const icerik = ogesi("main", "icerik");
    const iust = ogesi("header", "icerik-ust");
    const metinler = ogesi("div", "metinler");
    metinler.append(ogesi("h1", null, ""), ogesi("p", "alt-yazi", ""));
    // Her ekranın başlığında o ekranın işlerine süzülmüş geçmiş (UYAP ve kaynak durumu geçmiş tutmaz).
    const gb = dugme("Geçmiş", { sinif: "kucuk gecmis-bag", simge: "saat", baslik: "Bu ekranın geçmişi" });
    gb.onclick = () => { gecmisSifirla(ekraninSuzgeci(aktif)); git("gecmis"); };
    iust.append(metinler, gb);
    icerik.append(iust, Object.assign(ogesi("section"), { id: "ekran" }));
    masa.append(panel, icerik);
    $("kok").replaceChildren(masa);
    temaDugmeleri();
    panelYenile();
  }

  function temaDugmeleri() {
    const s = AL.tema._gecici || AL.tema.secim();
    document.querySelectorAll(".tema-secimi button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tema === s)));
  }
  document.addEventListener("al-tema", temaDugmeleri);

  function panelYenile() {
    document.querySelectorAll(".git").forEach((b) => {
      const id = b.dataset.ekran;
      b.toggleAttribute("aria-current", id === aktif);
      if (id === aktif) b.setAttribute("aria-current", "page");
      b.querySelectorAll(".ek, .nokta").forEach((x) => x.remove());
      const d = modulDurumu(id);
      if (EK_YAZISI[d]) b.append(ogesi("span", "ek", EK_YAZISI[d]));
      if (id === "mcp" && DURUM.mcpSaglik) b.append(ogesi("span", "nokta " + DURUM.mcpSaglik));
    });
    // Dar ekranda panel yatay şerittir: seçili ekranın düğmesi şeridin ortasına gelir (geniş ekranda kayma olmaz).
    const panel = document.querySelector(".panel");
    const secili = document.querySelector(".git[aria-current]");
    if (panel && secili && panel.scrollWidth > panel.clientWidth) {
      const p = panel.getBoundingClientRect();
      const s = secili.getBoundingClientRect();
      panel.scrollLeft += (s.left + s.width / 2) - (p.left + p.width / 2);
    }
  }

  function git(id) {
    aktif = id;
    const e = EKRANLAR.find((x) => x.id === id) || EKRANLAR[0];
    document.querySelector(".icerik-ust h1").textContent = e.baslik;
    document.querySelector(".icerik-ust .alt-yazi").textContent = e.alt;
    const gb = document.querySelector(".gecmis-bag");
    if (gb) gb.hidden = ["gecmis", "uyap", "mcp", "hesap"].includes(id);
    if (id !== "gecmis") gecmisAcik = null;
    const ekran = $("ekran");
    ekran.replaceChildren();
    (CIZIM[id] || CIZIM.sohbet)(ekran);
    panelYenile();
    bildir(`kullanıcı "${e.ad}" ekranında.`);
  }

  // ---------------------------------------------------------------- yardımcı bileşenler
  function bilgi(metin) {
    const b = ogesi("div", "bilgi");
    b.append(ikon("uyari"), ogesi("span", null, metin));
    return b;
  }

  function alan(etiket, girdi, sinif = "alan") {
    const a = ogesi("div", sinif);
    const id = "g-" + Math.random().toString(36).slice(2, 8);
    girdi.id = id;
    const l = ogesi("label", null, etiket);
    l.htmlFor = id;
    a.append(l, girdi);
    return a;
  }

  function girdi(tur, yer, deger = "") {
    const g = document.createElement(tur === "metin-alani" ? "textarea" : "input");
    if (tur !== "metin-alani") g.type = tur;
    g.placeholder = yer;
    g.value = deger;
    return g;
  }

  // Uzak masada (web, telefon ya da Claude Desktop'taki uzak bağlayıcı) bilgisayardaki modüller boş kalmaz: ne işe
  // yaradığı ve nereden açıldığı. Uzak masa bu modüllerin aracını çağıramaz (görünüm yalnız kendi sunucusunu çağırır);
  // Claude bu sohbette yerel kurulumu (arthurlegal-yerel) bildirdiyse masayı oradan yeniden açtırır.
  const INDIR = "https://github.com/beerbottle90/ArthurLegal#indir";
  const MODUL_TANITIMI = {
    beyin: { ad: "Beyin (ArthurLegal Hafıza)", maddeler: [
      ["kitap", "Tercihlerinizi hatırlar", "Üslubunuz ve düzeltmeleriniz her sohbette geçerli olur."],
      ["saat", "Nerede kaldığınızı bilir", "Son oturum kartı: ne yapıldı, ne kaldı, sonraki adım."],
      ["beyin", "Bu bilgisayarda durur", "Hafıza kasası bilgisayarınızda; Claude'a yalnız istediğiniz not gider."]] },
    mask: { ad: "ArthurMask", maddeler: [
      ["maske", "Adları ve numaraları etiketler", "Belgedeki kişi, kimlik ve dosya numaraları {{KİŞİ-01}} gibi etiketlenir."],
      ["sohbet", "Claude maskeli metni görür", "Gerçek değerler bilgisayarınızdan çıkmaz."],
      ["onay", "Word çıktısı gerçek değerlerle", "Düzeltilen ya da yeni yazılan belge bilgisayarınızda gerçek değerlerle oluşur."]] },
    uyap: { ad: "UYAP Dashboard", maddeler: [
      ["bina", "Tebligat ve duruşmalar tek yerde", "UYAP'ta açtığınız listeleri okur ve özetler."],
      ["onay", "Salt okunur", "UYAP'a hiçbir şey yazılmaz."],
      ["maske", "Gerçek değerler kendi penceresinde", "Claude ad ve numaraların etiketli hâlini görür."]] },
  };
  const YEREL_SUNUCU = /arthur\s*legal[\s_()-]*yerel/;

  // Bu sohbette bilgisayardaki kurulum bağlı mı: true / false, Claude listeyi bildirmediyse null (bilinmiyor).
  function yerelBagli() {
    const b = DURUM.baglayicilar;
    if (!b) return null;
    return b.liste.some((x) => x.durum === "bagli" && YEREL_SUNUCU.test(x.ad.toLowerCase()));
  }

  function yerelMasaIstegi(id) {
    return `ArthurLegal Masası'nı bu bilgisayardaki kurulumdan açın: arthurlegal-yerel sunucusunun al_masasi aracını bolum=${id} ` +
      "ile çağırın. Bu sohbette arthurlegal-yerel yoksa bunu bir cümleyle söyleyin.";
  }

  function masaustuTanitimi(ekran, id) {
    const t = MODUL_TANITIMI[id];
    const izgara = ogesi("div", "izgara");
    for (const [s, b, n] of t.maddeler) {
      const k = ogesi("div", "eylem-karti");
      const sim = ogesi("span", "simge");
      sim.append(ikon(s));
      k.append(sim, ogesi("b", null, b), ogesi("span", "ne", n));
      izgara.append(k);
    }
    const yerel = yerelBagli();
    const kesit = ogesi("div", "kesit");
    kesit.append(ogesi("h3", null, yerel ? "Bu bilgisayarda kurulu" : "Bilgisayarınızda çalışır"));
    const satir = ogesi("div", "satir");
    const ac = dugme("Masayı bu bilgisayarda aç", { sinif: "birincil", simge: "dis" });
    ac.onclick = () => claudeaSor(yerelMasaIstegi(id), null);
    const indir = dugme("ArthurLegal'i indir", { sinif: yerel === false ? "birincil" : "", simge: "dis" });
    indir.onclick = () => baglantiAc(app, INDIR, ortam.duyuru);
    if (yerel) satir.append(ac);
    else if (yerel === false) satir.append(indir);
    else satir.append(ac, indir);
    const not = yerel
      ? `${t.ad} bu bilgisayardaki ArthurLegal kurulumunda çalışıyor. Bu masa uzak bağlantıdan açıldı; düğme masayı kurulumun kendi bağlantısıyla (arthurlegal-yerel) yeniden açar.`
      : `${t.ad} yalnız ArthurLegal'in kurulu olduğu bilgisayarda çalışır; müvekkil verisi bu yüzden buluta çıkmaz. ` +
        (yerel === false ? "Web'de ve telefonda mevzuat, içtihat ve kurul kararları ekranları çalışır."
          : "Bilgisayardaysanız masayı kurulumun kendi bağlantısıyla açın; kurulu değilse indirin.");
    kesit.append(satir, bilgi(not));
    ekran.append(izgara, kesit);
  }

  function kuruluDegil(ekran, ne) {
    ekran.append(bilgi(`${ne} bu kurulumda seçilmemiş. ArthurLegal kurulumunu yeniden çalıştırıp modül ekranında işaretleyebilirsiniz.`));
  }

  async function modulAc(modul, dugmeEl) {
    const adim = AL.adimlar($("ekran")).ekle("Modül bu bilgisayarda açılıyor…");
    dugmeEl.disabled = true;
    try {
      const { veri, hata } = await cagir(app, "al_modul_ac", { modul });
      if (hata) throw new Error(hata);
      adim.tamam((veri && veri.mesaj) || "Açıldı.");
    } catch (e) {
      adim.hata("Açılamadı: " + (e.message || "bilinmeyen hata"));
    } finally {
      dugmeEl.disabled = false;
    }
  }

  // ---------------------------------------------------------------- ekranlar
  const CIZIM = {};

  // Sohbet: Claude'un cevabı (varsa) en üstte, altında devam sorusu, işe başlama önerileri ve bu oturumda yapılanlar.
  CIZIM.sohbet = (ekran) => {
    const c = gosterilenCevap();
    if (c) {
      const kok = ogesi("div", "cevap-kok");
      cevapIcerik(kok, c);
      ekran.append(kok);
      if (c.tamam || c.kesildi) ekran.append(devamFormu(c));   // devam sorusu cevap bitince
    }
    const izgara = ogesi("div", "izgara");
    const kartlar = [
      ["kitap", "Mevzuatta ara, madde getir", "Kanundan tebliğe bütün mevzuat; resmî metin ve birebir atıf.", () => git("mevzuat")],
      ["onay", "Taslaktaki atıfları teyit et", "Metni yapıştırın, her atıf tek tek kontrol edilir.", () => { git("mevzuat"); mevzuatSekme("teyit"); }],
      ["terazi", "Konuyla ilgili kararları bul", "Yargıtay ve Danıştay, künyeleriyle.", () => git("ictihat")],
      ["harita", "Parsel sorgula", "Ada/parsel ya da yer adıyla.", () => git("tapu")],
      ["maske", "Belgeyle maskeli çalış", "Adlar ve numaralar etiketlenir.", () => git("mask")],
      ["zil", "Bugünümü Donna ile planla", "Takvim, e-posta ve görevler.", () => git("donna")],
    ];
    for (const [s, b, n, f] of kartlar) {
      const k = ogesi("button", "eylem-karti");
      k.type = "button";
      const sim = ogesi("span", "simge");
      sim.append(ikon(s));
      k.append(sim, ogesi("b", null, b), ogesi("span", "ne", n));
      k.onclick = f;
      izgara.append(k);
    }
    if (c) {
      const oneriler = ogesi("div", "kesit");
      oneriler.append(ogesi("h3", null, "Öneriler"), izgara);
      ekran.append(oneriler);
    } else ekran.append(izgara);

    const kesit = ogesi("div", "kesit");
    kesit.append(ogesi("h3", null, "Son işler"));
    const liste = ogesi("div");
    const tum = dugme(gecmisDeposu() === "pencere" ? "Bu pencerenin geçmişi" : "Bütün geçmiş", { sinif: "kucuk", simge: "saat" });
    tum.onclick = () => { gecmisSifirla(); git("gecmis"); };
    const ey = ogesi("div", "eylemler sol");
    ey.append(tum);
    kesit.append(liste, ey);
    ekran.append(kesit);
    sonIsler(liste, c);
  };

  // Son 6 iş, kalıcı geçmişten: yeni sohbette ve Claude yeniden açıldığında da görünür. Yukarıda açık olan cevap
  // yinelenmez. Diskteki kayıtların listesi özettir; cevabı açmak için kayıt getirilir.
  async function sonIsler(kap, c) {
    const depo = gecmisDeposu();
    let kayitlar;
    if (depo === "disk") {
      const { veri } = await cagir(app, "al_gecmis", { islem: "listele", en_fazla: 7 }).catch(() => ({}));
      if (!kap.isConnected) return;
      kayitlar = veri && Array.isArray(veri.kayitlar) ? veri.kayitlar : GECMIS.map(oturumKaydi);
    } else {
      kayitlar = depo === "cihaz" ? cihazGecmisi() : GECMIS.map(oturumKaydi);
    }
    kayitlar = kayitlar.filter((k) => !(c && k.tur === "cevap" && (k.anlik && k.anlik.cevap !== undefined
      ? k.anlik.cevap === c.cevap : k.baslik === c.soru))).slice(0, 6);
    if (!kayitlar.length) {
      kap.append(ogesi("div", "bos", c ? "Başka iş yok." : "Henüz bir iş yok. Bir kart seçin ya da sorunuzu aşağıdaki kutuya yazın; yaptığınız işler adımlarıyla burada birikir, tümü Geçmiş'te."));
      return;
    }
    const akis = ogesi("div", "akis");
    for (const k of kayitlar) {
      const o = ogesi("div", "akis-ogesi");
      const ust = ogesi("div", "son-is-ust");
      ust.append(ogesi("span", "son-is-zaman",
        `${gunEtiketi(k.zaman)} ${new Date(k.zaman).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })}`),
        ogesi("div", "balon", k.baslik));
      o.append(ust);
      const ad = ogesi("div", "adimlar");
      for (const [tur, metin] of k.adimlar || []) ad.append(adimSatiri(tur, metin));
      o.append(ad);
      const ey = ogesi("div", "eylemler sol");
      if (k.tur === "cevap" && (k.anlik || (depo === "disk" && k.id))) {
        const ac = dugme("Cevabı aç", { sinif: "kucuk", simge: "cevap" });
        ac.onclick = async () => {
          let tam = k;
          if (!k.anlik || k.anlik === true) {
            ac.disabled = true;
            const { veri } = await cagir(app, "al_gecmis", { islem: "getir", id: k.id }).catch(() => ({}));
            ac.disabled = false;
            if (!veri || !veri.kayit) { ortam.duyuru.textContent = "Cevap açılamadı; Geçmiş'ten deneyin."; return; }
            tam = veri.kayit;
          }
          acikCevap = cevapKaydindan(tam); git("sohbet"); scrollTo(0, 0);
        };
        ey.append(ac);
      } else {
        const ac = dugme("Aç", { sinif: "kucuk", simge: "saat" });
        ac.onclick = () => { gecmisSifirla(); gecmisAcik = k.oturum || depo === "cihaz" ? k : k.id; git("gecmis"); };
        ey.append(ac);
      }
      o.append(ey);
      akis.append(o);
    }
    kap.append(akis);
  }

  function adimSatiri(tur, metin) {
    const s = ogesi("div", "adim " + tur);
    const im = ogesi("span", "im");
    if (tur !== "suruyor") im.append(ikon(tur === "tamam" ? "onay" : tur === "hata" ? "carpi" : "uyari"));
    s.append(im, ogesi("span", null, metin));
    return s;
  }

  // ---- Cevap ----
  // Claude sohbet kutusuna yazılan sorunun cevabını al_masaya_yaz ile teslim eder; ev sahibi bu görünümü o aracın
  // girdisiyle yeni bir pencerede açar ve girdiyi yazıldıkça (parça parça) gönderir. Cevap bitince masa içindeki madde
  // atıflarını resmî metinden teyit eder, sonucu Claude'a bildirir ve işi geçmişe yazar. Soruyu ve araştırma adımlarını
  // aşağıdaki çalışma akışı taşır.
  const TESLIM = "al_masaya_yaz";
  let CEVAP = null;          // bu pencereye teslim edilen: { soru, adimlar, cevap, kaynaklar, tamam, kesildi, teyit }
  let acikCevap = null;      // "Son işler"den ya da geçmişten açılan eski cevap
  let cevapKaydedildi = false;
  let cevapAcildi = false;   // teslim penceresi Sohbet ekranına bir kez kendiliğinden geçer

  const dizgi = (x) => (typeof x === "string" ? x : "");

  // Yazılırken gelen girdi eksik olabilir: yarım öğe atlanmaz, boş alan boş kalır.
  function cevapDuzenle(arg) {
    const adimlar = (Array.isArray(arg.adimlar) ? arg.adimlar : []).filter((a) => a && typeof a === "object")
      .map((a) => [["tamam", "uyar", "hata"].includes(a.durum) ? a.durum : "tamam", dizgi(a.metin).trim()]).filter((a) => a[1]);
    const kaynaklar = (Array.isArray(arg.kaynaklar) ? arg.kaynaklar : []).filter((k) => k && typeof k === "object")
      .map((k) => ({ baslik: dizgi(k.baslik).trim(), atif: dizgi(k.atif).trim(),
        url: /^https?:\/\/\S+$/i.test(dizgi(k.url).trim()) ? dizgi(k.url).trim() : "" }))
      .filter((k) => k.baslik || k.atif);
    return { soru: dizgi(arg.soru).trim(), cevap: dizgi(arg.cevap), adimlar, kaynaklar };
  }

  function cevapAl(arg, tamam) {
    if (CEVAP && CEVAP.tamam) return;   // tam girdiden sonra gelen geç parça cevabı bozmasın
    const calisma = acikCalisma();
    CEVAP = { ...cevapDuzenle(arg), araclar: calisma ? calisma.adimlar : [], tamam, kesildi: false, teyit: null };
    if (!CEVAP.soru && calisma) CEVAP.soru = calisma.soru;
    if (tamam) calismaBitir();
    acikCevap = null;
    DURUM.acilis = "sohbet";
    if (masaKuruldu && aktif !== "sohbet" && !cevapAcildi) { cevapAcildi = true; git("sohbet"); }
    else cevapYenile();
    if (tamam) cevapTeyidi();
  }

  // Kayıttan (oturum listesi ya da kalıcı geçmiş) gösterilecek cevap.
  function cevapKaydindan(k) {
    const a = k.anlik || {};
    const t = a.teyit || {};
    return { soru: k.soru || k.baslik || "", cevap: dizgi(a.cevap), adimlar: Array.isArray(a.adimlar) ? a.adimlar : [],
      araclar: Array.isArray(a.araclar) ? a.araclar : [],
      kaynaklar: Array.isArray(a.kaynaklar) ? a.kaynaklar : [], tamam: true, kesildi: false,
      zaman: k.zaman || (k.saat && k.saat.toISOString()),
      teyit: { durum: t.toplam ? "bitti" : "yok", satirlar: t.satirlar || [], dogru: t.dogru || 0, toplam: t.toplam || 0 } };
  }

  function gosterilenCevap() {
    if (acikCevap) return acikCevap;
    if (CEVAP) return CEVAP;
    if (ROL === "basla" || ROL === "adim") {   // soru masada, cevap gelmedi: çalışma sürüyor
      const c = acikCalisma();
      if (c) return { soru: c.soru, araclar: c.adimlar, adimlar: [], kaynaklar: [], cevap: "", tamam: false,
        kesildi: false, teyit: null, calisiyor: true };
    }
    const g = GECMIS.find((x) => x.tur === "cevap" && x.anlik);
    return g ? cevapKaydindan(g) : null;
  }

  // Yazılırken çok sık gelen parçalar birleşir; ekran en çok 60 ms'de bir yeniden çizilir.
  let cevapZamanlayici = 0;
  function cevapYenile() {
    if (cevapZamanlayici) return;
    cevapZamanlayici = setTimeout(() => {
      cevapZamanlayici = 0;
      if (!window.__alBagli) return;
      if (!masaKuruldu) { if (!document.body.classList.contains("kart-modu")) onizlemeCiz(); return; }
      if (aktif !== "sohbet") return;
      const kok = document.querySelector(".cevap-kok");
      const c = gosterilenCevap();
      if (kok && c) { kok.replaceChildren(); cevapIcerik(kok, c); }
      else git("sohbet");   // çalışma yeni başladı: Sohbet ekranı cevap alanıyla yeniden kurulur
    }, 60);
  }

  async function cevapTeyidi() {
    const c = CEVAP;
    const gorulen = new Set();
    const atiflar = atiflariBul(c.cevap).filter((a) => !gorulen.has(a.kanun + "/" + a.madde) && gorulen.add(a.kanun + "/" + a.madde)).slice(0, 40);
    c.teyit = { durum: atiflar.length ? "suruyor" : "yok", satirlar: [], dogru: 0, toplam: atiflar.length };
    cevapYenile();
    if (atiflar.length) {
      const { satirlar, dogru } = await atiflariDogrula(atiflar, AL.adimlar(ogesi("div")));
      c.teyit = { durum: "bitti", satirlar, dogru, toplam: atiflar.length };
      cevapYenile();
      const yanlis = satirlar.filter((s) => !s.ok).map((s) => `${kisaAd(s.kanun)} m. ${s.madde}`);
      bildir(`Sohbet ekranında. Cevaptaki ${atiflar.length} madde atfından ${sayiEki(dogru)} resmî metinde bulundu` +
        (yanlis.length ? `; doğrulanamayan: ${yanlis.join(", ")}. Bir sonraki cevabınızda bunu kullanıcıya söyleyip düzeltin.` : "."));
    }
    cevapKaydet();
  }

  // Cevap bitince ve teyidi tamamlanınca bir kez; masa durumu (al_gecmis var mı) sunucunun cevabıyla gelir.
  function cevapKaydet() {
    const c = CEVAP;
    if (!c || !c.tamam || c.kesildi || cevapKaydedildi || !DURUM.hazir || !c.cevap.trim()) return;
    if (!c.teyit || c.teyit.durum === "suruyor") return;
    cevapKaydedildi = true;
    const t = c.teyit;
    const araclar = (c.araclar || []).map(({ sonuc, ...a }) => a);   // geçmişe adımın ham sonucu yazılmaz
    const satirlar = araclar.map((a) => [a.durum === "suruyor" ? "tamam" : a.durum, [a.baslik, a.ozet].filter(Boolean).join(" · ")]);
    const adimlar = [...satirlar, ...c.adimlar].slice(0, t.toplam ? 9 : 10);
    if (t.toplam) adimlar.push([t.dogru === t.toplam ? "tamam" : "uyar", `Atıf teyidi: ${t.toplam} atıftan ${sayiEki(t.dogru)} doğrulandı`]);
    gecmiseEkle(c.soru || "Claude'un cevabı", adimlar.length ? adimlar : [["tamam", "Cevap masaya geldi"]], {
      ekran: "sohbet", kategori: "claude", tur: "cevap", sorgu: c.soru ? { metin: c.soru } : null,
      anlik: { cevap: c.cevap, adimlar: c.adimlar, araclar, kaynaklar: c.kaynaklar,
        teyit: { satirlar: t.satirlar, dogru: t.dogru, toplam: t.toplam } } });
  }

  // Cevabın gövdesi; Sohbet ekranı, sohbetteki önizleme ve geçmiş ayrıntısı aynı çiziciyi kullanır.
  function cevapIcerik(kap, c, { soruYok = false, adimYok = false } = {}) {
    if (!soruYok && c.soru) kap.append(ogesi("div", "balon", c.soru));
    const yaziliyor = !c.tamam && !c.kesildi;
    const araclar = c.araclar || [];
    if (!adimYok && (araclar.length || c.adimlar.length || (yaziliyor && !c.cevap))) {
      const ad = ogesi("div", "adimlar");
      for (const a of araclar) ad.append(aracSatiri(a));
      for (const [tur, m] of c.adimlar) ad.append(adimSatiri(tur, m));
      if (yaziliyor && !c.cevap) ad.append(adimSatiri("suruyor", c.calisiyor ? "Claude çalışıyor…" : "Claude cevabı yazıyor…"));
      kap.append(ad);
    }
    if (c.cevap || !yaziliyor) {
      const kart = ogesi("div", "sonuc-kabi");
      const govde = MD.ciz(c.cevap, { baglanti: (url) => baglantiAc(app, url, ortam.duyuru) });
      govde.classList.add("cevap-govde");
      const alt = ogesi("div", "alt-satir");
      if (yaziliyor) alt.append(ogesi("span", "yaziyor", "Claude yazıyor"));
      else {
        alt.append(ogesi("span", "zaman", c.kesildi ? "Cevap yarıda kesildi" :
          ["Claude", c.zaman && AL.zaman(c.zaman)].filter(Boolean).join(" · ")));
        const ey = ogesi("div", "eylemler");
        const kp = dugme("Kopyala", { sinif: "kucuk", simge: "kopya" });
        kp.onclick = () => kopyala(MD.duzMetin(c.cevap), kp, govde, ortam.duyuru);
        ey.append(kp);
        alt.append(ey);
      }
      kart.append(govde, alt);
      kap.append(kart);
    }
    if (!c.tamam || c.kesildi) return;

    const t = c.teyit;
    const teyit = ogesi("div", "kesit");
    teyit.append(ogesi("h3", null, "Atıf teyidi"));
    if (!t || t.durum === "suruyor") {
      const ad = ogesi("div", "adimlar");
      ad.append(adimSatiri("suruyor", t ? `${t.toplam} madde atfı resmî metinden kontrol ediliyor…` : "Atıflar aranıyor…"));
      teyit.append(ad);
    } else if (!t.toplam) {
      teyit.append(ogesi("div", "bos", "Cevapta tanınan bir madde atfı yok. “TBK m. 344” ya da “6098 sayılı … 344. maddesi” biçimleri tanınır."));
    } else {
      const ust = ogesi("div", "sonuc-ust");
      const bk = ogesi("div", "sonuc-baslik");
      bk.append(ogesi("div", "kunye", `${t.toplam} atıf · ${t.dogru} doğrulandı`));
      ust.append(bk, KART.durumRozeti(t.dogru, t.toplam));
      const tablo = ogesi("div", "teyit");
      for (const s of t.satirlar) tablo.append(teyitSatiri(s));
      teyit.append(ust, tablo, bilgi("Bu kontrol, madde numarasının resmî metinde var olduğunu ve başlığını gösterir. Maddeye yüklenen içeriğin (hakkın sahibi, şart, süre) metinle örtüşmesini ayrıca okuyun."));
    }
    kap.append(teyit);

    if (c.kaynaklar.length) {
      const ks = ogesi("div", "kesit");
      ks.append(ogesi("h3", null, "Kaynaklar"));
      const liste = ogesi("div", "liste");
      for (const k of c.kaynaklar) {
        const o = ogesi("div", "liste-ogesi");
        const sim = ogesi("span", "simge");
        sim.append(ikon("kitap"));
        const mt = ogesi("div", "metinler");
        mt.append(ogesi("span", "ad", k.baslik || k.atif));
        if (k.atif && k.baslik) mt.append(ogesi("span", "ne", k.atif));
        const ey = ogesi("div", "eylemler");
        if (k.atif) {
          const kp = dugme("Atfı kopyala", { sinif: "kucuk", simge: "kopya" });
          kp.onclick = () => kopyala(k.atif, kp, null, ortam.duyuru);
          ey.append(kp);
        }
        if (k.url) {
          const ac = dugme("Kaynağı aç", { sinif: "kucuk", simge: "dis" });
          ac.onclick = () => baglantiAc(app, k.url, ortam.duyuru);
          ey.append(ac);
        }
        o.append(sim, mt, ey);
        liste.append(o);
      }
      ks.append(liste);
      kap.append(ks);
    }
  }

  // Devam sorusu sohbete gider; cevabı yine masaya gelir (yeni bir masa penceresinde).
  function devamFormu(c) {
    const form = ogesi("form", "form devam");
    const soru = girdi("metin-alani", c ? "Bu cevapla ilgili ne sormak istersiniz?" : "Sorunuzu yazın");
    soru.rows = 2;
    const gonder = dugme("Sor", { sinif: "birincil", simge: "sohbet" });
    gonder.type = "submit";
    const satir = ogesi("div", "satir");
    satir.append(alan(c ? "Devam sorusu" : "Soru", soru), gonder);
    const durum = ogesi("span", "zaman", "");
    form.append(satir, durum);
    soru.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } };
    form.onsubmit = async (e) => {
      e.preventDefault();
      const m = soru.value.trim();
      if (!m) return;
      gonder.disabled = true;
      await claudeaSor(m, null);
      gonder.disabled = false;
      soru.value = "";
      durum.textContent = "Gönderildi. Claude'un cevabı masada açılacak.";
    };
    return form;
  }

  // ---- Çalışma akışı ----
  // Claude Desktop'ın tam ekran bölmesi her zaman en son açılan görünümü gösterir. Bütün ArthurLegal araçları masayı açar
  // ve her pencere bir rol üstlenir: masa (al_masasi), basla (al_masada_basla: soru masada, çalışma başlar), adim
  // (araştırma aracı: çalışmaya bir satır), teslim (al_masaya_yaz: cevap). Pencereler aynı kaynaktan açıldığı için
  // çalışmayı tarayıcı deposunda paylaşır; en yeni pencere Sohbet ekranında soruyu, adımları ve gelirse cevabı çizer.
  // Masa açılmamış sohbette adım penceresi masa değildir: madde ve içtihat için kart, öteki araçlar için tek satırlık şerit.
  const CALISMA = "al.masa.calisma";
  const DURUM_KAYDI = "al.masa.durum";
  const CALISMA_OMRU = 30 * 60 * 1000;
  const SONUC_SINIRI = 150000;   // karakter; kartlı adımın sonucu bundan büyükse çalışmaya yazılmaz, yalnız kendi penceresinde
  const KARTLI = { tr_mevzuat_madde_getir: "madde", tr_ictihat_ara: "ictihat" };
  let ROL = null;             // masa | basla | teslim | adim
  let ARAC = "";              // bu pencereyi açan araç
  let ADIM = null;            // adım penceresinin satırı: { id, arac, baslik, durum, ozet, zaman, sonuc? }
  let ADIM_SONUC = null;      // kartlı adımın sonucu (kart modunda kart çizilir)
  let baslaAlindi = false;
  const ACIK_SONUCLAR = new Set();   // açılan adım sonuçları yeniden çizimde açık kalır

  const aracBilgisi = () => (app.getHostContext() || {}).toolInfo || {};
  const kisalt = (x, n) => { const t = String(x ?? "").replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n - 1) + "…" : t; };
  const yeniKimlik = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // Rol aracın adından (ev sahibinin toolInfo'su) belli olur; ad yoksa girdiden, o da yetmezse sunucunun cevabından.
  function rolBelirle(arg) {
    if (ROL) return ROL;
    const bilgi = aracBilgisi();
    ARAC = (bilgi.tool && bilgi.tool.name) || "";
    if (ARAC === "al_masasi") ROL = "masa";
    else if (ARAC === "al_masada_basla") ROL = "basla";
    else if (ARAC === TESLIM) ROL = "teslim";
    else if (ARAC) ROL = "adim";
    else if (arg && ("cevap" in arg || "soru" in arg)) ROL = "teslim";
    else if (arg && ("bolum" in arg || "baglayicilar" in arg || "tam_ekran" in arg)) ROL = "masa";
    return ROL;
  }

  function calismaOku() {
    try {
      const c = JSON.parse(localStorage.getItem(CALISMA) || "null");
      return c && Array.isArray(c.adimlar) && Date.now() - (c.guncel || c.basla || 0) < CALISMA_OMRU ? c : null;
    } catch { return null; }
  }
  function calismaYaz(c) {
    c.guncel = Date.now();
    try { localStorage.setItem(CALISMA, JSON.stringify(c)); }
    catch {   // depo doluysa sonuçlar atılır, satırlar kalır
      try { c.adimlar.forEach((a) => { delete a.sonuc; }); localStorage.setItem(CALISMA, JSON.stringify(c)); } catch { /* depo kapalı */ }
    }
  }
  const acikCalisma = () => { const c = calismaOku(); return c && !c.bitti ? c : null; };
  function calismaBaslat(soru) {
    // Sorudan önce başlamış adımlar (ör. talimat) sorusuz bir çalışmada birikmişse aynı çalışma soruyu alır.
    const c = acikCalisma();
    if (c && !c.soru && Date.now() - c.basla < 5 * 60 * 1000) { c.soru = dizgi(soru).trim(); calismaYaz(c); return c; }
    const yeni = { id: yeniKimlik(), soru: dizgi(soru).trim(), basla: Date.now(), adimlar: [], bitti: 0 };
    calismaYaz(yeni);
    return yeni;
  }
  function calismaBitir() {
    const c = acikCalisma();
    if (c) { c.bitti = Date.now(); calismaYaz(c); }
  }
  addEventListener("storage", (e) => {
    if (e.key === CIHAZ_GECMISI && masaKuruldu && (aktif === "sohbet" || (aktif === "gecmis" && !gecmisAcik))) git(aktif);
    if (e.key === CALISMA && (ROL === "basla" || (ROL === "adim" && masaModu()) || (ROL === "teslim" && CEVAP && !CEVAP.tamam))) {
      if (CEVAP && !CEVAP.tamam) { const c = acikCalisma(); if (c) CEVAP.araclar = c.adimlar; }
      cevapYenile();
    }
  });

  // Masanın durumu (ortam, yetenekler, modüller) masa pencerelerinden gelir; adım penceresi son bilineni kullanır.
  function durumuSakla() {
    try {
      localStorage.setItem(DURUM_KAYDI, JSON.stringify({ surum: DURUM.surum, ortam: DURUM.ortam,
        yetenekler: [...DURUM.yetenekler], moduller: DURUM.moduller }));
    } catch { /* yok */ }
  }
  function durumuYukle() {
    try {
      const d = JSON.parse(localStorage.getItem(DURUM_KAYDI) || "null");
      if (!d) return;
      DURUM.ortam = d.ortam || DURUM.ortam;
      if (Array.isArray(d.yetenekler)) DURUM.yetenekler = new Set(d.yetenekler);
      DURUM.moduller = d.moduller || {};
    } catch { /* yok */ }
  }

  // Adım penceresi masa mı olur? Tam ekran bölmesindeyse ya da masada bir çalışma sürüyorsa evet; masa açılmamış
  // sohbette (çalışma yok, satır içi) ya da tam ekranı olmayan ev sahibinde kart ya da şerit.
  function masaModu() {
    if (ROL !== "adim") return true;
    const ctx = app.getHostContext() || {};
    if (!(ctx.availableDisplayModes || []).includes("fullscreen")) return false;
    return ctx.displayMode === "fullscreen" || !!acikCalisma();
  }

  // Adımın Türkçe adı ve aranan şey: "İçtihat aranıyor: “yeni malik …”".
  const ULKE = { tr: "Türkiye", eu: "AB", de: "Almanya", az: "Azerbaycan", uk: "Birleşik Krallık", nl: "Hollanda",
    pl: "Polonya", at: "Avusturya", ie: "İrlanda", fi: "Finlandiya", es: "İspanya", jp: "Japonya", gleif: "Tüzel kişi (LEI)",
    scholar: "Doktrin", contracts: "Sözleşme emsali", tkgm: "Tapu", hafiza: "Hafıza", arthurlegal: "ArthurLegal",
    hesap: "Hesap" };
  const ADIM_ADI = {
    tr_hukuk_arastirma_rehberi: "Araştırma yolu belirleniyor", tr_kurum_listesi: "Kurumlar listeleniyor",
    tr_mevzuat_ara: "Mevzuatta aranıyor", tr_mevzuat_getir: "Mevzuat getiriliyor",

    tr_aym_ara: "Anayasa Mahkemesi kararları aranıyor", tr_aym_getir: "AYM kararı açılıyor",
    tr_uyusmazlik_ara: "Uyuşmazlık Mahkemesi kararları aranıyor", tr_uyusmazlik_getir: "Uyuşmazlık kararı açılıyor",
    tr_kurum_karari_ara: "Kurul kararları aranıyor", tr_kurum_karari_getir: "Kurul kararı açılıyor",
    tr_resmi_gazete_tara: "Resmî Gazete taranıyor", tr_resmi_gazete_fihrist: "Resmî Gazete fihristi açılıyor",
    tr_resmi_gazete_getir: "Resmî Gazete metni açılıyor", tr_semantik_ara: "Arşivde anlam araması",

  };
  // Tutar yazımı (hesap kartları): sunucunun verdiği sayı, Türkçe biçimde; masa yuvarlamaz.
  const tlYaz = (x) => `${Number(x).toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} TL`;
  const ARANAN = ["query", "q", "sorgu", "ara", "search_term", "term", "keyword", "text", "metin", "konu", "title",
    "baslik", "kurum", "name", "ad", "id", "doc_id", "madde_id", "mevzuat_id", "yol", "il", "ilce"];
  function adimMetni(arac, g) {
    const bilgi = aracBilgisi();
    const on = ULKE[arac.split("_")[0]];
    const ad = ADIM_ADI[arac] || (on ? `${on}: ` : "") + ((bilgi.tool && bilgi.tool.title) || arac || "ArthurLegal aracı");
    g = g && typeof g === "object" ? g : {};
    if (g.madde_no || g.madde) {
      const no = [].concat(g.madde_no || g.madde).join(", ");
      return `${ad}: ${[g.number ? kisaAd(String(g.number)) : "", "m. " + no].filter(Boolean).join(" ")}`;
    }
    for (const a of ARANAN) {
      const v = g[a];
      if (typeof v === "string" && v.trim()) return `${ad}: “${kisalt(v, 90)}”`;
      if (typeof v === "number") return `${ad}: ${v}`;
    }
    const ilk = Object.values(g).find((v) => typeof v === "string" && v.trim());
    return ilk ? `${ad}: “${kisalt(ilk, 90)}”` : ad;
  }

  // Sonucun tek satırlık özeti; hata ve erişilemeyen kaynak ayrı işaretlenir ("sonuç yok" ile "aranamadı" aynı değildir).
  function sonucOzeti(arac, sonuc, veri, hata) {
    if (sonuc && sonuc.isError) return ["hata", kisalt(hata || "araç hata döndürdü", 120)];
    if (!veri || typeof veri !== "object") return ["tamam", "tamamlandı"];
    if (veri.unavailable || veri.upstream_blocked) return ["uyar", "kaynağa ulaşılamadı"];
    if (arac.startsWith("hesap_")) {
      const tz = veri.tazelik || {};
      if (tz.durum === "yeni_duzenleme") return ["uyar", "Resmî Gazete'de yeni düzenleme var: toplam verilmedi"];
      const teyitsiz = tz.durum === "kontrol_edilemedi" ? " (teyit edilmedi)" : "";
      const durum = teyitsiz ? "uyar" : "tamam";
      if (typeof veri.asgari_tl === "number") return [durum, `asgari ücret ${tlYaz(veri.asgari_tl)}${teyitsiz}`];
      if (typeof veri.toplam_tl === "number") return [durum, `toplam ${tlYaz(veri.toplam_tl)}${teyitsiz}`];
    }
    if (Array.isArray(veri.items) && veri.items.length && "ok" in (veri.items[0] || {})) {
      const ok = veri.items.filter((i) => i && i.ok).length;
      return [ok === veri.items.length ? "tamam" : "uyar", `${veri.items.length} maddeden ${sayiEki(ok)} getirildi`];
    }
    const ad = /ictihat|aym|uyusmazlik|karar|case|decision/.test(arac) ? "karar" : "sonuç";
    const liste = ["results", "sonuclar", "kararlar", "liste", "items", "documents", "hits", "data", "acts", "records"]
      .map((k) => veri[k]).find(Array.isArray);
    const n = typeof veri.total === "number" ? veri.total : typeof veri.count === "number" ? veri.count : liste ? liste.length : null;
    if (n == null) return ["tamam", "tamamlandı"];
    return n ? ["tamam", `${n} ${ad}`] : ["uyar", `${ad} bulunamadı`];
  }

  function adimBasladi(arg) {
    if (ADIM) return;
    const bilgi = aracBilgisi();
    ADIM = { id: bilgi.id != null ? String(bilgi.id) : yeniKimlik(), arac: ARAC, baslik: adimMetni(ARAC, arg),
      durum: "suruyor", ozet: "", zaman: Date.now() };
    adimiYaz();
  }
  function adimBitti(sonuc, veri, hata) {
    if (!ADIM) adimBasladi(null);
    const [durum, ozet] = sonucOzeti(ARAC, sonuc, veri, hata);
    ADIM.durum = durum;
    ADIM.ozet = ozet;
    if (KARTLI[ARAC] && veri && !(sonuc && sonuc.isError)) {
      ADIM_SONUC = veri;
      try { if (JSON.stringify(veri).length < SONUC_SINIRI) ADIM.sonuc = veri; } catch { /* yok */ }
    }
    adimiYaz();
  }
  function adimCiz() {
    if (!window.__alBagli) return;
    if (masaModu()) { if (document.body.classList.contains("kart-modu") || !masaKuruldu) ciz(); else cevapYenile(); }
    else kartModuCiz();
  }
  function adimiYaz() {
    if (masaModu()) {
      const c = acikCalisma() || calismaBaslat("");
      const i = c.adimlar.findIndex((a) => a.id === ADIM.id);
      if (i >= 0) c.adimlar[i] = ADIM; else c.adimlar.push(ADIM);
      calismaYaz(c);
    }
    adimCiz();
  }

  // Çalışmanın bir satırı; kartlı adımın sonucu satırın altında açılır.
  function aracSatiri(a) {
    const kap = ogesi("div");
    const satir = adimSatiri(a.durum, [a.baslik, a.ozet].filter(Boolean).join(" · "));
    kap.append(satir);
    if (a.sonuc && KARTLI[a.arac]) {
      const yer = ogesi("div", "adim-sonuc");
      const b = dugme("", { sinif: "kucuk sonuc-ac" });
      const ac = (acik) => {
        if (acik && !yer.childElementCount) yer.append(KARTLI[a.arac] === "madde" ? KART.madde(a.sonuc, ortam) : KART.ictihat(a.sonuc, ortam));
        yer.hidden = !acik;
        b.querySelector("span").textContent = acik ? "Sonucu gizle" : "Sonucu göster";
      };
      b.onclick = () => { const acik = yer.hidden; acik ? ACIK_SONUCLAR.add(a.id) : ACIK_SONUCLAR.delete(a.id); ac(acik); };
      ac(ACIK_SONUCLAR.has(a.id));
      satir.append(b);
      kap.append(yer);
    }
    return kap;
  }

  // Masa açılmamış sohbette adım penceresi: madde ve içtihat için kart, öteki araçlar için tek satır.
  function kartModuCiz() {
    document.body.classList.add("kart-modu");
    masaKuruldu = false;
    const kart = ogesi("article", "kart");
    const ust = ogesi("header", "kimlik");
    const marka = ogesi("span", "marka", "Arthur");
    marka.append(ogesi("span", null, "Legal"));
    const tur = KARTLI[ARAC];
    ust.append(sablon("t-arma"), marka, Object.assign(ogesi("span", "ayrac"), { ariaHidden: "true" }),
      ogesi("span", "bolum", tur === "madde" ? "Mevzuat" : tur === "ictihat" ? "İçtihat" : "Araştırma"));
    kart.append(ust);
    if (tur && ADIM_SONUC) kart.append(tur === "madde" ? KART.madde(ADIM_SONUC, ortam) : KART.ictihat(ADIM_SONUC, ortam));
    else {
      const serit = ogesi("div", "serit");
      serit.append(adimSatiri(ADIM ? ADIM.durum : "suruyor",
        ADIM ? [ADIM.baslik, ADIM.ozet].filter(Boolean).join(" · ") : "ArthurLegal aracı çalışıyor…"));
      kart.append(serit);
    }
    $("kok").replaceChildren(kart);
  }

  // ---- Mevzuat ve kararlar ----
  // Kapsam Türk mevzuatının tamamıdır (tr_mevzuat_ara: kanundan tebliğe, mülga dâhil). atif.js'teki kısa ad listesi
  // yalnız "TBK -> 6098" çözümü içindir; ekranda seçenek listesi olarak gösterilmez, yoksa kapsam dar sanılır.
  const { kanunCoz, kanunAdi, kisaAd, atiflariBul } = ATIF;

  const TUR_ADI = {
    KANUN: "Kanun", KHK: "KHK", TUZUK: "Tüzük", CB_KARARNAME: "CB kararnamesi", CB_KARAR: "CB kararı",
    CB_YONETMELIK: "CB yönetmeliği", CB_GENELGE: "CB genelgesi", YONETMELIK: "Yönetmelik", KKY: "Kurum yönetmeliği",
    UY: "Üniversite yönetmeliği", TEBLIGLER: "Tebliğ", MULGA: "Mülga",
  };
  const MEVZUAT_KAYNAK = "https://www.mevzuat.gov.tr/";

  let mevzuatAktif = "ara";
  let mevzuatSecili = null;   // { mevzuat_id, ad, number, type }: aramadan "Madde getir"e taşınan mevzuat
  function mevzuatSekme(s) {
    mevzuatAktif = s;
    if (aktif === "mevzuat") { const e = $("ekran"); e.replaceChildren(); CIZIM.mevzuat(e); }
    else git("mevzuat");   // geçmişteki bir sonuçtan "Madde getir"
  }

  const mevzuatAdi = (m) => AL.baslikDuzeni(m.title || "");
  const mevzuatKunyesi = (m) => [m.number && `No. ${m.number}`, m.rg_number && `RG ${[AL.tarih(m.rg_date), m.rg_number].filter(Boolean).join("/")}`]
    .filter(Boolean).join(" · ");

  CIZIM.mevzuat = (ekran) => {
    ekran.append(ogesi("p", "kapsam-notu", "Kapsam: Türk mevzuatının tamamı (kanun, KHK, Cumhurbaşkanlığı kararname, karar, " +
      "yönetmelik ve genelgeleri, tüzük, yönetmelik, tebliğ, mülga) ve sekiz kurumun kararları: EPDK, SPK bültenleri, " +
      "Rekabet Kurulu, BDDK, KVKK, BTK, GİB özelgeleri, Sigorta Tahkim Komisyonu. Kaynaklar canlı."));
    const seg = ogesi("div", "segment");
    seg.style.maxWidth = "520px";
    for (const [id, yazi] of [["ara", "Ara"], ["getir", "Madde getir"], ["teyit", "Atıf teyidi"]]) {
      const b = dugme(yazi);
      b.setAttribute("aria-pressed", String(mevzuatAktif === id));
      b.onclick = () => mevzuatSekme(id);
      seg.append(b);
    }
    ekran.append(seg);
    ({ ara: mevzuatAra, getir: maddeGetir, teyit: atifTeyidi }[mevzuatAktif] || mevzuatAra)(ekran);
  };

  // Tek kutu: istek istek.js ile çözülür (kurum, sayı, piyasa, tür, yıl, konu). Kurum kararı isteği kurumun canlı
  // listesine, gerisi mevzuat aramasına gider; çözülen istek ilk adım satırında yazar, kullanıcı neyin arandığını görür.
  const ORNEKLER = ["son 5 EPDK elektrik piyasası kurul kararı", "Rekabet Kurulu son 10 birleşme ve devralma kararı",
    "SPK son 3 bülten", "BDDK faaliyet izni kararları", "6446 sayılı Elektrik Piyasası Kanunu", "kira bedelinin belirlenmesi"];

  function mevzuatAra(ekran) {
    const form = ogesi("form", "form");
    const sorgu = girdi("text", "Örnek: son 5 EPDK elektrik piyasası kurul kararı");
    const ara = dugme("Ara", { sinif: "birincil", simge: "arama" });
    ara.type = "submit";
    const s1 = ogesi("div", "satir");
    s1.append(alan("Ne arıyorsunuz? Mevzuat adı, numarası ya da konusu; bir kurumun kararları", sorgu), ara);
    const ornek = ogesi("div", "ornekler");
    ornek.append(ogesi("span", "zaman", "Örnek:"));
    for (const o of ORNEKLER) {
      const b = dugme(o, { sinif: "kucuk" });
      b.onclick = () => { sorgu.value = o; form.requestSubmit(); };
      ornek.append(b);
    }
    form.append(s1, ornek);
    const sonuc = ogesi("div", "kesit");
    form.onsubmit = async (e) => {
      e.preventDefault();
      sonuc.replaceChildren();
      const q = sorgu.value.trim();
      if (!q) { AL.adimlar(sonuc).ekle("").hata("Aradığınızı yazın: bir mevzuat, konu ya da kurum kararı."); return; }
      const c = ISTEK.coz(q);
      ara.disabled = true;
      try {
        await (c.hedef === "kurum" ? kurumKararlari : mevzuatListesi)(sonuc, c, q);
      } finally {
        ara.disabled = false;
      }
    };
    ekran.append(form, sonuc);
    if (bekleyen && bekleyen.sekme === "ara") { sorgu.value = bekleyen.q; bekleyen = null; form.requestSubmit(); }
  }

  // Claude'a bırakma: çözücünün anlamadığı ya da yorum isteyen soru sohbete gider, masa kaynağı yine gösterir.
  function claudeaBirak(kap, q, yazi = "Claude'a sor", birincil = false) {
    const b = dugme(yazi, { sinif: birincil ? "birincil" : "kucuk", simge: "sohbet" });
    b.onclick = () => claudeaSor(`ArthurLegal araçlarıyla (mevzuat ve kurum kararları) bul, maddeyi resmî metinden getir ve künyeleri birebir kullan: ${q}`, `Claude: ${q}`);
    kap.append(b);
  }

  // ---- Mevzuat: önce başlıkta; başlıkta yoksa metninde ifadenin geçtiği kanunlar (kullanıcı seçmez) ----
  // Kaynağın metin araması ilgiye göre değil Resmî Gazete tarihine göre sıralar: konu sorusunda bu dürüstçe yazar
  // ve "hangi madde?" sorusu Claude'a bırakılır (Claude maddeyi bulur, masa resmî metinden doğrular).
  async function mevzuatListesi(sonuc, c, q, sayfa = 1, kapsam = { yer: "title" }) {
    const adimlar = AL.adimlar(sonuc);
    const kod = /^\d{1,6}$/.test(q) ? { number: q } : { query: q };
    const metinde = kapsam.yer === "fulltext";
    const a = adimlar.ekle(metinde
      ? `Metninde “${q}” ifadesi geçen ${kapsam.yalnizKanun ? "kanunlar" : "mevzuat"} aranıyor…`
      : `Mevzuatta “${q}” başlıkta aranıyor…`);
    try {
      const arg = { ...kod, page: sayfa, page_size: 10, search_in: kapsam.yer };
      if (metinde) arg.exact_phrase = true;
      if (kapsam.yalnizKanun) arg.types = ["KANUN"];
      const { veri, hata } = await cagir(app, "tr_mevzuat_ara", arg);
      if (!veri) throw new Error(hata);
      // Başlığı aranan ifadeyle başlayanlar (kısası önce) öne alınır.
      const bas = (m) => !!kod.query && AL.baslikDuzeni(m.title || "").toLocaleLowerCase("tr").startsWith(q.toLocaleLowerCase("tr"));
      const kisaOnce = (x, y) => (bas(y) - bas(x)) || (bas(x) && bas(y) ? (x.title || "").length - (y.title || "").length : 0);
      let one = [];
      if (sayfa === 1 && kod.query && !metinde) {
        try {
          const k = await cagir(app, "tr_mevzuat_ara", { query: q, types: ["KANUN"], page_size: 5, search_in: "title" });
          one = ((k.veri && k.veri.results) || []).filter(bas).sort(kisaOnce);
        } catch { /* öne alma yalnız kolaylıktır */ }
      }
      const kimlik = new Set(one.map((m) => String(m.mevzuat_id)));
      const liste = [...one, ...[...(veri.results || [])].sort(kisaOnce).filter((m) => !kimlik.has(String(m.mevzuat_id)))];
      const toplam = veri.total ?? liste.length;
      if (!liste.length && kod.query && !metinde) {
        a.uyar(`Başlığında “${q}” geçen mevzuat yok.`);
        return mevzuatListesi(sonuc, c, q, 1, { yer: "fulltext", yalnizKanun: true });
      }
      if (!liste.length && kapsam.yalnizKanun) {
        a.uyar(`Metninde bu ifade geçen kanun yok.`);
        return mevzuatListesi(sonuc, c, q, 1, { yer: "fulltext" });
      }
      (liste.length ? a.tamam : a.uyar)(liste.length
        ? (metinde
          ? `${toplam} ${kapsam.yalnizKanun ? "kanunda" : "mevzuatta"} geçiyor; liste Resmî Gazete tarihine göre, ilgiye göre değil.`
          : `${toplam} mevzuat bulundu; ${(sayfa - 1) * 10 + 1}–${(sayfa - 1) * 10 + liste.length} gösteriliyor.`)
        : "Bu aramayla mevzuat bulunamadı. Daha kısa bir ad ya da numara deneyin; kurum kararı arıyorsanız kurumun adını yazın.");
      const kap = ogesi("div", "sonuc-kabi");
      if (metinde && sayfa === 1) {
        // Konu sorusu: hangi maddenin uygulanacağını Claude söyler, masa getirir ve doğrular.
        const ust = ogesi("div", "eylemler sol");
        claudeaBirak(ust, q, "Claude'a sor: hangi mevzuat ve madde?", true);
        kap.append(ust);
      }
      for (const m of liste) kap.append(mevzuatSatiri(m));
      const alt = ogesi("div", "alt-satir");
      const ey = ogesi("div", "eylemler");
      if (toplam > sayfa * 10) {
        const sonraki = dugme(`Sonraki ${Math.min(10, toplam - sayfa * 10)}`, { simge: "ok" });
        sonraki.onclick = () => { sonraki.disabled = true; mevzuatListesi(sonuc, c, q, sayfa + 1, kapsam); };
        ey.append(sonraki);
      }
      if (kapsam.yalnizKanun) {
        const genis = dugme("Bütün mevzuatta göster", { simge: "arama" });
        genis.onclick = () => { sonuc.replaceChildren(); mevzuatListesi(sonuc, c, q, 1, { yer: "fulltext" }); };
        ey.append(genis);
      }
      if (!metinde) claudeaBirak(ey, q);
      alt.append(ogesi("span", "zaman", "mevzuat.gov.tr · Bedesten"), ey);
      kap.append(alt);
      sonuc.append(kap);
      if (sayfa === 1) {
        gecmiseEkle(`Mevzuat: “${q}”`, [[liste.length ? "tamam" : "uyar", `${toplam} mevzuat`]],
          { kategori: "mevzuat", tur: "mevzuat-liste", sorgu: { q },
            anlik: { liste, toplam, metinde, yalnizKanun: !!kapsam.yalnizKanun } });
        bildir(`mevzuat araması "${q}" (${metinde ? "metinde" : "başlıkta"}): ${toplam} sonuç. İlkler: ${liste.slice(0, 5).map((m) => m.citation).join(" | ")}`);
      }
    } catch {
      a.hata("Mevzuat aranamadı.");
      sonuc.append(ogesi("p", "uyari", AL.UYARI + MEVZUAT_KAYNAK));
    }
  }

  // ---- Kurul kararları ----
  const KURUM_KAYNAK = {
    epdk: "https://www.epdk.gov.tr/Detay/Icerik/3-0-39-3/son-kurul-kararlari/elektrik", spk: "https://spk.gov.tr/spk-bultenleri",
    rekabet: "https://www.rekabet.gov.tr/tr/Kararlar", bddk: "https://www.bddk.org.tr/Mevzuat/Liste/55",
    kvkk: "https://www.kvkk.gov.tr/Icerik/5406/kurul-karar-ozetleri", btk: "https://www.btk.tr/kurul-kararlari",
    gib: "https://gib.gov.tr/gibmevzuat", sigorta_tahkim: "https://www.sigortatahkim.org",
  };

  // "22.10.2026", "26/12/2024", "2014-03-31", "30.6.2026" → sıralanabilir sayı (yyyymmdd); okunamazsa 0.
  function tarihSirasi(t) {
    const s = String(t || "");
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return Number(m[1]) * 10000 + Number(m[2]) * 100 + Number(m[3]);
    m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/);
    return m ? Number(m[3]) * 10000 + Number(m[2]) * 100 + Number(m[1]) : 0;
  }

  // Kurumların cevapları farklı alanlar taşır; satır tek biçime indirilir.
  function kararVerisi(kurum, r) {
    const belge = r.documents && r.documents[0] && r.documents[0].url;
    const rg = r.rg_no ? `RG ${[r.rg_date, r.rg_no].filter(Boolean).join("/")}` : "";
    return {
      kurum,
      baslik: kurum === "spk" && r.bulten ? `SPK Bülteni ${r.bulten}` : (r.subject || r.title || r.summary || r.konu || r.citation || ""),
      tarih: r.date || r.decision_date || "",
      no: r.decision_no || r.decision_number || r.ozelge_no || "",
      ek: [r.decision_type, r.category, rg, r.publication_date && `yayım ${r.publication_date}`,
        kurum === "spk" && r.bulten && "haftalık bülten; Kurul kararları içinde"].filter(Boolean),
      atif: r.citation || "",
      url: r.source_url || r.pdf_url || belge || KURUM_KAYNAK[kurum],
      getir: (belge || r.id || r.karar_id || r.pdf_url) ? { kurum, id: String(belge || r.id || r.karar_id || r.pdf_url) } : null,
      bulten: r.bulten || null,
    };
  }

  function anlamVerisi(kurum, r) {
    return { kurum, baslik: r.title || "", tarih: r.date || "", no: "", ek: [], atif: r.citation || "", url: r.url || KURUM_KAYNAK[kurum],
      ref: r.ref, ozet: r.snippet || "" };
  }

  async function kurumCanli(c) {
    const n = Math.max(1, Math.min(50, c.sayi || 10));
    const arg = { kurum: c.kurum };
    if (c.konu) arg.query = c.konu;
    if (c.kurum === "epdk") { if (c.piyasa) arg.market = c.piyasa; if (c.yil) arg.year = c.yil; arg.limit = n; }
    if (c.kurum === "rekabet" && c.karar_turu) arg.decision_type = c.karar_turu;
    if (["spk", "bddk"].includes(c.kurum)) { if (c.yil) arg.year = c.yil; arg.limit = n; }
    if (["kvkk", "sigorta_tahkim"].includes(c.kurum)) arg.limit = n;
    if (["btk", "gib"].includes(c.kurum)) {
      arg.page_size = n;
      if (c.yil) { arg.date_from = `${c.yil}-01-01`; arg.date_to = `${c.yil}-12-31`; }
    }
    let sonuclar = [];
    let toplam = null;
    // Rekabet sayfa başına 10 karar verir: istenen sayıya kadar sayfa sayfa (en çok 5 sayfa).
    const sayfalar = c.kurum === "rekabet" ? Math.min(5, Math.ceil(n / 10)) : 1;
    for (let sayfa = 1; sayfa <= sayfalar && sonuclar.length < n; sayfa++) {
      const { veri, hata } = await cagir(app, "tr_kurum_karari_ara", sayfalar > 1 ? { ...arg, page: sayfa } : arg);
      if (!veri) throw new Error(hata || "Kaynak cevap vermedi.");
      toplam = veri.total ?? null;
      sonuclar.push(...(veri.results || []));
      if ((veri.results || []).length < 10) break;
    }
    let liste = sonuclar.map((r) => kararVerisi(c.kurum, r));
    if (c.yil && ["rekabet", "kvkk", "sigorta_tahkim"].includes(c.kurum)) {
      liste = liste.filter((v) => String(Math.floor(tarihSirasi(v.tarih) / 10000)) === String(c.yil));
    }
    // "son", "en yeni" ya da konusuz istek: en yeni önce (kaynağın sırası korunarak, tarihi okunamayan sona).
    if (c.en_yeni || !c.konu) liste = liste.map((v, i) => [v, i]).sort((x, y) => (tarihSirasi(y[0].tarih) - tarihSirasi(x[0].tarih)) || (x[1] - y[1])).map((x) => x[0]);
    return { liste: liste.slice(0, n), toplam };
  }

  async function kurumKararlari(sonuc, c, q) {
    const adimlar = AL.adimlar(sonuc);
    adimlar.ekle("").tamam(`İstek: ${ISTEK.ozet(c)}`);
    let liste = [];
    let kanal = "canlı";
    try {
      // SPK kararları haftalık bültenlerde: konu verildiyse bülten arşivinde anlamca aranır.
      if (!(c.kurum === "spk" && c.konu)) {
        const a = adimlar.ekle(`${c.kurum_adi} resmî listesinden getiriliyor…`);
        const r = await kurumCanli(c);
        liste = r.liste;
        if (liste.length) a.tamam(`${liste.length} ${c.kurum === "spk" ? "bülten" : "karar"} geldi` + (r.toplam ? ` (listede ${r.toplam}).` : "."));
        else a.uyar(c.konu ? `Resmî listede “${c.konu}” geçen karar yok.` : "Resmî listeden karar gelmedi.");
      }
      if (!liste.length && c.konu) {
        const konu = [c.piyasa && ISTEK.PIYASA_ADI[c.piyasa], c.konu].filter(Boolean).join(" ");
        const b = adimlar.ekle(`${c.kurum_adi} arşivinde “${konu}” anlamca aranıyor (ilgiye göre sıralı)…`);
        const arg = { kurum: c.kurum, query: konu, limit: Math.min(20, c.sayi || 10), snippet_chars: 260 };
        if (c.yil) { arg.date_from = `${c.yil}-01-01`; arg.date_to = `${c.yil}-12-31`; }
        const { veri, hata } = await cagir(app, "tr_semantik_ara", arg);
        if (!veri) throw new Error(hata);
        liste = (veri.results || []).map((r) => anlamVerisi(c.kurum, r));
        if (c.en_yeni) liste.sort((x, y) => tarihSirasi(y.tarih) - tarihSirasi(x.tarih));
        kanal = "arşiv";
        (liste.length ? b.tamam : b.uyar)(liste.length ? `${liste.length} karar bulundu (arşiv, ${c.en_yeni ? "en yeni önce" : "ilgiye göre"}).` : "Arşivde de bulunamadı.");
      }
    } catch {
      adimlar.ekle("").hata(`${c.kurum_adi} kararları getirilemedi.`);
      sonuc.append(ogesi("p", "uyari", AL.UYARI + KURUM_KAYNAK[c.kurum]));
      return;
    }
    const kap = ogesi("div", "sonuc-kabi");
    for (const v of liste) kap.append(kararSatiri(v));
    const alt = ogesi("div", "alt-satir");
    const ey = ogesi("div", "eylemler");
    claudeaBirak(ey, q);
    alt.append(ogesi("span", "zaman", `${c.kurum_adi} · ${kanal === "canlı" ? "resmî liste, canlı" : "ArthurLegal arşivi"}`), ey);
    kap.append(alt);
    sonuc.append(kap);
    gecmiseEkle(`${c.kurum_adi}: “${q}”`, [["tamam", ISTEK.ozet(c)], [liste.length ? "tamam" : "uyar", `${liste.length} sonuç`]],
      { kategori: "mevzuat", tur: "kurum", sorgu: { q },
        anlik: { kurum_adi: c.kurum_adi, istek: ISTEK.ozet(c), kanal, liste } });
    bildir(`kurum kararı isteği "${q}" (${ISTEK.ozet(c)}): ${liste.length} sonuç. ${liste.slice(0, 5).map((v) => v.atif || v.baslik).join(" | ")}`);
  }
