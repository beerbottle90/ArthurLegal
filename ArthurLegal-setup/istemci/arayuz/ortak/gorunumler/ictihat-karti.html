<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ArthurLegal · İçtihat kartı</title>
<!--
  tr_ictihat_ara için sohbet içi kart: kararlar künyeleriyle listelenir; "Metni aç" kararın metnini
  tr_ictihat_getir ile kartın içine getirir, "Claude'a özetlet" işi sohbete bırakır.
  Ortak tasarım ve kod sunucuda gömülür (sunucu/al_arayuz.py).
-->
<style>
/*AL:CSS*/
body {
  background: transparent;
  padding: calc(var(--guvenli-ust) + 4px) calc(var(--guvenli-sag) + 4px)
           calc(var(--guvenli-alt) + 12px) calc(var(--guvenli-sol) + 4px);
}
</style>
</head>
<body>
<article class="kart" id="kart" aria-busy="true">
  <header class="kimlik">
    <!--AL:ARMA-->
    <span class="marka">Arthur<span>Legal</span></span>
    <span class="ayrac" aria-hidden="true"></span>
    <span class="bolum">İçtihat</span>
  </header>
  <div id="govde">
    <div class="sonuc-baslik"><h2 id="sorgu">Kararlar aranıyor…</h2><div class="kunye">Yargıtay · Danıştay</div></div>
    <div class="iskelet" aria-hidden="true" style="margin-top:12px"><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="gizli" aria-live="polite" id="duyuru"></div>
</article>

<script>
  window.__alBagli = false;
  setTimeout(function () {
    if (window.__alBagli) return;
    var p = document.createElement("p");
    p.className = "aciklama";
    p.textContent = "Kart yüklenemedi. Karar listesi ve künyeler, sohbetteki araç sonucunda yer alıyor.";
    document.getElementById("govde").replaceChildren(p);
    document.getElementById("kart").removeAttribute("aria-busy");
  }, 12000);
</script>

<script type="module">
  import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@1.7.5/dist/src/app-with-deps.js";
  /*AL:JS*/
  /*AL:KARTLAR*/

  const app = new App({ name: "ArthurLegal İçtihat Kartı", version: AL.SURUM });
  const ortam = { app, duyuru: document.getElementById("duyuru") };
  const govde = document.getElementById("govde");
  let cizildi = false;

  function hata(mesaj) {
    const g = AL.ogesi("section", "grup");
    g.append(AL.ogesi("p", "aciklama", mesaj),
      AL.ogesi("p", "uyari", AL.UYARI + "https://karararama.yargitay.gov.tr/"));
    govde.replaceChildren(AL.ogesi("h2", null, "Kararlar getirilemedi"), g);
    document.getElementById("kart").removeAttribute("aria-busy");
  }

  app.ontoolinput = ({ arguments: arg }) => {
    if (cizildi || !arg || !arg.query) return;
    const s = document.getElementById("sorgu");
    if (s) s.textContent = `“${arg.query}” aranıyor…`;
  };
  app.ontoolresult = (sonuc) => {
    const { veri, hata: h } = AL.veriAl(sonuc);
    if (!veri) return hata(h);
    cizildi = true;
    govde.replaceChildren(KART.ictihat(veri, ortam));
    document.getElementById("kart").removeAttribute("aria-busy");
  };
  app.ontoolcancelled = () => hata("Araç çağrısı iptal edildi.");
  app.addEventListener("hostcontextchanged", (d) => AL.tema.baglamdan(d));

  await app.connect();
  window.__alBagli = true;
  AL.tema.baglamdan(app.getHostContext());
</script>
</body>
</html>
